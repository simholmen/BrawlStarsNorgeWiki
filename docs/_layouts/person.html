---
layout: default
---
<div class="infobox">
    <div class="infobox-title">
        {{ page.name }}
        {% if page.subtitle %}
        <span class="subtitle">{{ page.subtitle }}</span>
        {% endif %}
    </div>
    <img src="{{ page.image }}" alt="{{ page.name }}">
    <table>
        <tbody>
            {% for row in page.facts %}
            <tr>
                <th>{{ row[0] }}</th>
                <td>{{ row[1] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<h2 class="strekstopp">{{ page.name }}</h2>

<div id="toc">
    <h2>Innhold</h2>
    <ul>
        <li><a href="#bakgrunn">1. Bakgrunn</a></li>
        <li><a href="#karriere">2. Karriere</a></li>
        <li><a href="#prestasjoner">3. Prestasjoner</a></li>
        <li><a href="#brawl-stars-profil">4. Brawl Stars profil</a></li>
    </ul>
</div>

{{ content }}
