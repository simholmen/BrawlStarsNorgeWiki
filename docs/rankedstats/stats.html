<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ranked Stats</title>
<!--
  rankedstats/stats.html — standalone local ranked-stats viewer.

  This page is LOCAL-ONLY. It is meant to be opened directly from disk as a `file://` URL (or
  served by any static file server you happen to have handy) — it is deliberately NOT wired into
  the Jekyll site under `docs/`, has no Jekyll front matter, and does not load `docs/style.css`.
  All styling below is self-contained inline CSS so the page renders identically no matter how it
  is opened.

  It talks directly to Supabase's PostgREST API via the `@supabase/supabase-js` v2 UMD bundle
  loaded from the jsdelivr CDN below — no build step, no bundler, no npm install, no
  `package.json`. Every query in this file is a plain SELECT against one of the `v_player_*`
  views defined in `rankedstats/migrations/003_views.sql`; it never queries `ranked_sets`,
  `set_participants`, or `battles` directly, and it never writes/inserts/updates/deletes anything.

  The Supabase URL and key hardcoded below are a PUBLISHABLE (anon) key — a deliberately different,
  weaker credential than the elevated write-capable key used by the server-side ingest script — so
  it is safe to commit. Every table and view this page can see is governed by row-level security
  policies that only ever grant SELECT to the `anon`/`authenticated` roles (see 001_init.sql and
  003_views.sql), so this key cannot write anything even if asked to.
-->
<link rel="stylesheet" href="stats.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="brawler_classes.js"></script>
</head>
<body>

<!-- ===================== HERO ===================== -->
<!-- .hero-content holds 3 children, in order: .hero-rank-badge, .hero-identity (name + subline +
     the "Form" chip row, all stacked in one column), and .hero-kpis (5 KPI cards, right-aligned
     via margin-left: auto on .hero-kpis). #hero-rank-chart (Task 15) is the FIRST child of
     .hero, absolutely positioned behind .hero-content — .hero already has position: relative to
     support that without further restructuring; .hero-content itself has position: relative and
     z-index: 1 so the foreground layers on top of the chart. -->
<header class="hero" id="hero">
  <div id="hero-rank-chart" class="hero-rank-chart"></div>
  <div class="hero-content">
    <div class="hero-rank-badge" id="hero-rank-badge">
      <img class="hero-rank-icon" id="hero-rank-icon" alt="" />
      <span class="hero-rank-roman" id="hero-rank-roman"></span>
    </div>
    <div class="hero-identity">
      <h1 class="hero-player-name" id="hero-player-name">Velg en spiller</h1>
      <p class="hero-subline" id="hero-subline"></p>
      <div class="hero-form-row">
        <span class="hero-form-label">Form</span>
        <div class="hero-form" id="hero-form"></div>
      </div>
    </div>
    <div class="hero-kpis" id="hero-kpis"></div>
  </div>
</header>

<div class="layout">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="controls">
      <div class="control-group">
        <label for="player-select">Spiller</label>
        <select id="player-select">
          <option value="">Laster spillere...</option>
        </select>
      </div>
      <div class="control-group">
        <div class="tree-header" id="brawler-tree-header"></div>
        <div class="tree-list" id="brawler-tree-list"></div>
      </div>
      <div class="control-group">
        <span class="control-group-title">Mode</span>
        <div class="chip-row" id="mode-chips"></div>
      </div>
      <div class="control-group">
        <span class="control-group-title">Periode</span>
        <div class="chip-row" id="period-chips"></div>
      </div>
      <div class="control-group">
        <label for="min-sample-input">Minimum sett</label>
        <div class="min-sets-row">
          <input type="range" id="min-sample-input" min="1" max="15" value="3">
          <span id="min-sample-value">3</span>
        </div>
        <span id="min-sample-hint" class="min-sets-hint"></span>
      </div>
    </div>

    <p id="player-list-status" class="status" style="display: none;"></p>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <main class="main" id="main-content">

    <!-- ===================== ACTIVE FILTER BAR ===================== -->
    <div class="filter-bar" id="filter-bar"></div>

    <!-- ===================== BEST/WORST MAP CALLOUTS ===================== -->
    <div class="callouts" id="map-callouts"></div>

    <!-- ===================== SECTION 2: BY MAP ===================== -->
    <section class="stats-section" id="map-section">
      <h2>Map</h2>
      <div id="map-content">
        <p class="status empty">Velg en spiller for å se statistikk.</p>
      </div>
    </section>

    <!-- ===================== SECTION 3: BY BRAWLER ===================== -->
    <section class="stats-section" id="brawler-section">
      <h2>Brawler</h2>
      <div id="brawler-content">
        <p class="status empty">Velg en spiller for å se statistikk.</p>
      </div>
    </section>

    <!-- ===================== SECTION 4: TEAMMATES ===================== -->
    <section class="stats-section" id="teammate-section">
      <h2>Teammates</h2>
      <div id="teammate-content">
        <p class="status empty">Velg en spiller for å se statistikk.</p>
      </div>
    </section>

    <!-- ===================== SECTION 5: RECENT MATCHES ===================== -->
    <section class="stats-section" id="recent-section">
      <h2>Siste sett</h2>
      <div id="recent-content">
        <p class="status empty">Velg en spiller for å se statistikk.</p>
      </div>
    </section>

  </main>

</div>

<!-- ===================== MATCH DETAIL MODAL (Task 14) ===================== -->
<!-- Static modal chrome, placed once as a direct child of <body>, initially hidden via the
     `.modal-overlay`'s base `display: none;` (toggled to `flex` by openMatchDetailModal/
     closeMatchDetailModal in the script below — see the MATCH DETAIL MODAL section). The
     `#match-detail-content` div nested inside `.modal-box` is the SAME div `loadMatchDetail`/
     `renderMatchDetail` have always rendered into — it moved here from its old inline home inside
     `#recent-section`, but its own render logic is otherwise unchanged. -->
<div class="modal-overlay" id="match-detail-overlay">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="match-detail-title">
    <div class="modal-header">
      <div class="modal-header-info">
        <div class="modal-thumb-placeholder" id="match-detail-thumb"></div>
        <h3 id="match-detail-title"></h3>
      </div>
      <button type="button" id="match-detail-close" aria-label="Lukk">✕</button>
    </div>
    <div id="match-detail-content"></div>
  </div>
</div>

<script>

  // =========================================================================================
  // === CONFIG ===
  // === Publishable key only (RLS/grants govern access, SELECT-only). Safe to commit.
  // =========================================================================================

  const SUPABASE_URL = "https://pojzifcfobmsnsvrnvob.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3WuJOVb5GuP4h6fCBGBV-Q_HjOjfH54";

  // Named `sb`, never `supabase` at top level — the UMD bundle above occupies the global
  // `window.supabase`, so shadowing that name with a top-level `const supabase = ...` would break it.
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // =========================================================================================
  // === LABELS ===
  // === Every user-facing string on this page, in Norwegian, in one flat object — per the
  // === rankedstats-redesign plan's RESOLVED "UI language" decision (Norwegian, matching the
  // === mockup's own confirmed labels and the public docs/ wiki's language). Change wording here,
  // === not inline, so a future language change is a one-object edit. Internal code (variable/
  // === function names, CSS classes/ids, comments) stays English — only strings actually rendered
  // === to the user live here. Some genuinely static HTML (plain <label> text, <h2> titles, the
  // === initial hero placeholder) is hardcoded as Norwegian directly in the markup below instead
  // === of referencing this object, because no JS render pass ever (re)writes that exact text at
  // === runtime — see the notepad entry for this task for the full list of which strings that
  // === applies to. Future tasks (8, 10, 13, 15) should add their own new keys to THIS object
  // === rather than hardcoding more strings — reserved terms already confirmed by the mockup but
  // === not yet needed by any landed code ("Nullstill", "TYNT", "Periode", "Vis alle brawlere",
  // === "rader skjult", "rader over grensen") are intentionally omitted until the task that needs
  // === them lands. Task 14 has already landed and added its own "recent matches / modal" keys
  // === below (including "Klikk for settdetaljer", no longer reserved/unused).
  // =========================================================================================

  const LABELS = {
    // --- status messages (setStatus() calls shared by the map/brawler/teammate/recent panels
    // --- and the match-detail modal) ---
    loading: "Laster...",
    errorPrefix: "Feil: ",
    noSetsRecorded: "Ingen rangerte sett registrert ennå.",
    selectPlayerToViewStats: "Velg en spiller for å se statistikk.",

    // --- hero ---
    selectPlayer: "Velg en spiller",
    form: "Form",
    setsPlayed: "Sett spilt",
    winrate: "Winrate",
    wins: "Seire",
    losses: "Tap",
    draws: "Uavgjort",

    // --- sidebar ---
    playerLabel: "Spiller",
    minSetsLabel: "Minimum sett",
    loadingPlayers: "Laster spillere...",
    errorLoadingPlayers: "Feil ved lasting av spillere: ",
    noTrackedPlayers: "Ingen sporede spillere funnet ennå.",
    failedToLoadPlayers: "(klarte ikke å laste spillere)",
    noTrackedPlayersOption: "(ingen sporede spillere)",
    choosePlayer: "-- velg en spiller --",

    // --- section titles ---
    mapSectionTitle: "Map",
    brawlerSectionTitle: "Brawler",
    teammateSectionTitle: "Teammates",
    recentSectionTitle: "Siste sett",

    // --- best/worst map callouts ---
    bestMap: "Beste map",
    worstMap: "Dårligste map",
    setsSuffix: "sett",

    // --- table headers (map/brawler/teammate/recent tables) ---
    tableMode: "Mode",
    tableMap: "Map",
    tableSets: "Sett",
    tableWins: "Seire",
    tableLosses: "Tap",
    tableDraws: "Uavgjort",
    tableWinrate: "Winrate",
    tableBrawler: "Brawler",
    tableTeammate: "Teammate",
    tableTag: "Tag",
    tableSetsTogether: "Sett sammen",
    roster: "Liste",
    tableDate: "Dato",
    tableResult: "Resultat",
    tableTrend: "Trend",
    loadMore: "Last inn flere",

    // --- table rows / badges (Task 10) ---
    thinBadge: "TYNT",
    thinBadgeTooltip: "Lite datagrunnlag",
    rowsOverThreshold: "rader over grensen",

    // --- match-detail modal ---
    loadingMatchDetail: "Laster settdetaljer...",
    matchDetailNotFound: "Fant ikke settdetaljer.",
    started: "Startet: ",
    ended: "Avsluttet: ",
    gamesPlayed: "Runder spilt: ",
    team0Wins: "Lag 0 seire: ",
    team1Wins: "Lag 1 seire: ",
    winningTeam: "Vinnende lag: ",
    drawUnresolved: "— (uavgjort / uavklart)",
    teamPrefix: "Lag ",
    complete: "Fullført: ",
    yes: "ja",
    no: "nei",
    gamesHeading: "Runder",
    tablePlayer: "Spiller",
    tableBrawlerCol: "Brawler",
    tablePower: "Styrke",
    tableRank: "Rang",
    tableGameNumber: "#",
    tableBattleTime: "Kamptidspunkt",
    tableDuration: "Varighet (s)",
    tableWinningTeam: "Vinnende lag",
    tableStarPlayer: "Stjernespiller",
    draw: "uavgjort",

    // --- filters (mode/period chips, min-sets slider, active-filter bar) ---
    allModes: "Alle modes",
    modeGroupTitle: "Mode",
    periodGroupTitle: "Periode",
    allTime: "Alle tider",
    last30Days: "Siste 30 dager",
    last7Days: "Siste 7 dager",
    rowsHiddenSuffix: "rader skjult",
    activeFilterLabel: "Aktivt filter",
    clear: "Nullstill",

    // --- sidebar brawler class filter tree (Task 13) ---
    // --- LABELS.clear (above) is reused for the tree's own "✕ Nullstill" clear link, not
    // --- duplicated under a new key. ---
    brawlerTreeTitle: "Brawler",

    // --- recent matches / modal (Task 14) ---
    clickForDetails: "Klikk for settdetaljer",
    closeModal: "Lukk",
    resultWin: "Seier",
    resultLoss: "Tap",
    resultDraw: "Uavgjort",
  };

  // =========================================================================================
  // === DATA LAYER ===
  // === Single fetch per player selection: `loadPlayerData` issues exactly 3 PostgREST requests,
  // === one per row-level view added in 007_redesign_views.sql, and stores the raw, unaggregated
  // === rows in STATE. Every filter change (mode/period/min-sets/brawler/class) is handled
  // === entirely client-side by `applyFilters` + `aggregate`, then re-rendered by `renderAll` —
  // === no further network requests are ever issued after the initial 3.
  // =========================================================================================

  let STATE = {
    tag: null,
    setRows: [],
    mateRows: [],
    rankHistory: [],
    filter: { kind: null, value: null },
    mode: "All modes",
    period: "All time",
    minSets: 3,
    collapsed: {},
    // Keyed by class name (a BRAWLER_CLASS_ORDER entry). `true` means that class's row in the
    // sidebar tree is currently expanded (child brawler rows visible); `false` or absent (the
    // default) means collapsed. Never read/written by applyFilters/aggregate — only by
    // renderBrawlerTree() in the SIDEBAR FILTERS section below.
    expandedClasses: {},
  };

  async function loadPlayerData(tag) {
    const mapContainer = document.getElementById("map-content");
    const brawlerContainer = document.getElementById("brawler-content");
    const teammateContainer = document.getElementById("teammate-content");
    const recentContainer = document.getElementById("recent-content");
    const allContainers = [
      mapContainer,
      brawlerContainer,
      teammateContainer,
      recentContainer,
    ];

    allContainers.forEach(function (container) {
      setStatus(container, "loading", LABELS.loading);
    });
    clearElement(document.getElementById("match-detail-content"));

    const [setRowsResult, mateRowsResult, rankHistoryResult] = await Promise.all([
      sb.from("v_player_set_rows").select("*").eq("player_tag", tag),
      sb.from("v_player_teammate_rows").select("*").eq("player_tag", tag),
      sb.from("v_player_rank_history").select("*").eq("player_tag", tag),
    ]);

    const firstError = setRowsResult.error || mateRowsResult.error || rankHistoryResult.error;
    if (firstError) {
      allContainers.forEach(function (container) {
        setStatus(container, "error", LABELS.errorPrefix + firstError.message);
      });
      return;
    }

    const setRows = setRowsResult.data || [];
    const mateRows = mateRowsResult.data || [];
    const rankHistory = rankHistoryResult.data || [];

    if (setRows.length === 0 && mateRows.length === 0 && rankHistory.length === 0) {
      allContainers.forEach(function (container) {
        setStatus(container, "empty", LABELS.noSetsRecorded);
      });
      return;
    }

    STATE.tag = tag;
    STATE.setRows = setRows;
    STATE.mateRows = mateRows;
    STATE.rankHistory = rankHistory;

    renderAll();
  }

  function applyFilters(rows) {
    let filteredRows = rows;

    if (STATE.period !== "All time") {
      const daysBack = STATE.period === "Last 7 days" ? 7 : 30;
      const cutoffDate = new Date(Date.now() - daysBack * 24 * 60 * 60 * 1000);
      filteredRows = filteredRows.filter(function (row) {
        return new Date(row.ended_at) >= cutoffDate;
      });
    }

    if (STATE.mode !== "All modes") {
      filteredRows = filteredRows.filter(function (row) {
        return row.mode === STATE.mode;
      });
    }

    if (STATE.filter.kind === "brawler") {
      filteredRows = filteredRows.filter(function (row) {
        return row.brawler_id === STATE.filter.value;
      });
    } else if (STATE.filter.kind === "class") {
      filteredRows = filteredRows.filter(function (row) {
        const brawlerClass = BRAWLER_CLASSES[row.brawler_id] || "Unclassified";
        return brawlerClass === STATE.filter.value;
      });
    }

    return filteredRows;
  }

  function aggregate(rows, keyFn, labelFn) {
    const groupsByKey = new Map();

    rows.forEach(function (row) {
      const key = keyFn(row);
      if (!groupsByKey.has(key)) {
        groupsByKey.set(key, []);
      }
      groupsByKey.get(key).push(row);
    });

    const aggregatedRows = [];

    groupsByKey.forEach(function (groupRows, key) {
      const sortedGroupRows = groupRows.slice().sort(function (rowA, rowB) {
        return new Date(rowA.ended_at) - new Date(rowB.ended_at);
      });

      let wins = 0;
      let losses = 0;
      let draws = 0;
      sortedGroupRows.forEach(function (row) {
        if (row.result === "win") {
          wins++;
        } else if (row.result === "loss") {
          losses++;
        } else if (row.result === "draw") {
          draws++;
        }
      });

      const winrate = wins + losses === 0 ? null : wins / (wins + losses);

      aggregatedRows.push({
        key: key,
        label: labelFn(sortedGroupRows[0]),
        sub: undefined,
        sets: sortedGroupRows.length,
        wins: wins,
        losses: losses,
        draws: draws,
        winrate: winrate,
        rows: sortedGroupRows,
      });
    });

    return aggregatedRows;
  }

  // =========================================================================================
  // === Field-shaping bridge — Task 10 confirmed the map/brawler/teammate row shapes below are
  // === exactly what `renderMapTable`/`renderBrawlerTable`/`renderTeammateTable` need, so this
  // === mapping from aggregate() output stays (it is not dead code to remove); only the renderers
  // === themselves were rewritten to consume it differently. Task 14 still owns rewriting the
  // === recent-matches renderer and its own bridge block below.
  // =========================================================================================

  function renderAll() {
    renderHero(STATE.tag);
    renderBrawlerTree();
    renderModeChips();
    renderPeriodChips();
    renderFilterBar();

    const filteredSetRows = applyFilters(STATE.setRows);
    const filteredMateRows = applyFilters(STATE.mateRows);

    renderKpiCards(filteredSetRows);
    renderFormChips(filteredSetRows);

    // --- Map (aggregate() output shaped to what renderMapTable expects) ---
    const mapContainer = document.getElementById("map-content");
    if (filteredSetRows.length === 0) {
      setStatus(mapContainer, "empty", LABELS.noSetsRecorded);
      renderCallouts([]);
    } else {
      const mapGroups = aggregate(
        filteredSetRows,
        function (row) {
          return row.mode + "||" + row.map;
        },
        function (row) {
          return row.map;
        }
      );
      const mapRows = mapGroups.map(function (group) {
        return {
          mode: group.rows[0].mode,
          map: group.label,
          sets_played: group.sets,
          wins: group.wins,
          losses: group.losses,
          draws: group.draws,
          winrate: group.winrate,
          rows: group.rows,
        };
      });
      mapRows.sort(function (rowA, rowB) {
        return rowB.sets_played - rowA.sets_played;
      });
      renderCallouts(mapRows);
      renderMapTable(mapContainer, mapRows);
      applyMinSampleFilter();
    }

    // --- Brawler (aggregate() output shaped to what renderBrawlerTable expects) ---
    const brawlerContainer = document.getElementById("brawler-content");
    if (filteredSetRows.length === 0) {
      setStatus(brawlerContainer, "empty", LABELS.noSetsRecorded);
    } else {
      const brawlerGroups = aggregate(
        filteredSetRows,
        function (row) {
          return row.brawler_id;
        },
        function (row) {
          return row.brawler_name || String(row.brawler_id);
        }
      );
      const brawlerRows = brawlerGroups.map(function (group) {
        return {
          brawler_id: group.key,
          brawler_name: group.label,
          sets_played: group.sets,
          wins: group.wins,
          losses: group.losses,
          draws: group.draws,
          winrate: group.winrate,
          rows: group.rows,
        };
      });
      brawlerRows.sort(function (rowA, rowB) {
        return rowB.sets_played - rowA.sets_played;
      });
      renderBrawlerTable(brawlerContainer, brawlerRows);
      applyMinSampleFilter();
    }

    // --- Teammates (aggregate() output shaped to what renderTeammateTable expects, note the
    // --- `sets_together` field name is preserved exactly since renderTeammateTable reads it,
    // --- unlike every other section which uses `sets_played`) ---
    const teammateContainer = document.getElementById("teammate-content");
    if (filteredMateRows.length === 0) {
      setStatus(teammateContainer, "empty", LABELS.noSetsRecorded);
    } else {
      const teammateGroups = aggregate(
        filteredMateRows,
        function (row) {
          return row.teammate_tag;
        },
        function (row) {
          return row.teammate_name || row.teammate_tag;
        }
      );
      const teammateRows = teammateGroups.map(function (group) {
        return {
          teammate_tag: group.key,
          teammate_name: group.label,
          teammate_is_tracked: group.rows[0].teammate_is_tracked,
          sets_together: group.sets,
          wins: group.wins,
          winrate: group.winrate,
          rows: group.rows,
        };
      });
      teammateRows.sort(function (rowA, rowB) {
        return rowB.sets_together - rowA.sets_together;
      });
      renderTeammateTable(teammateContainer, teammateRows);
      applyMinSampleFilter();
    }

    // applyMinSampleFilter() (called up to 3x above) always finishes updating every table's
    // .filtered-out classes by this point regardless of which branches ran, so it is simplest and
    // safest to refresh all 3 panels' right-side counts here in one place rather than duplicating
    // this call inside each of the 3 branches above — countFilteredOutRows() returns 0 for a
    // table that doesn't exist yet (e.g. an empty-state branch ran instead), so a panel showing no
    // rows always reports "0 rader over grensen", never a stale count from a previous player.
    updatePanelRightText("map-panel", countFilteredOutRows("map-table"));
    updatePanelRightText("brawler-panel", countFilteredOutRows("brawler-table"));
    updatePanelRightText("teammate-panel", countFilteredOutRows("teammate-table"));

    // --- Recent (the raw set-row view already has every field renderRecentTable reads, so
    // --- filteredSetRows is passed through with no field mapping) ---
    const recentContainer = document.getElementById("recent-content");
    if (filteredSetRows.length === 0) {
      setStatus(recentContainer, "empty", LABELS.noSetsRecorded);
    } else {
      const recentRows = filteredSetRows
        .slice()
        .sort(function (rowA, rowB) {
          return new Date(rowB.ended_at) - new Date(rowA.ended_at);
        })
        .slice(0, 10);
      renderRecentTable(recentContainer, recentRows);
    }

    updateMinSetsHint();
  }

  // =========================================================================================
  // === HERO ===
  // === Reads only STATE.rankHistory (already fetched by loadPlayerData) and the currently
  // === selected <option> in #player-select — issues no network requests of its own. Mirrors the
  // === exact `ended_at`-ascending sort renderAll() uses for `currentRankLabel` so both agree on
  // === which rank-history row is "current". Also renders the Task 15 rank-tier chart
  // === (`renderRankChart`) and appends a period-relative rank-delta span to `#hero-subline`.
  // =========================================================================================

  function renderHero(tag) {
    renderRankChart(STATE.rankHistory);

    const rankIconEl = document.getElementById("hero-rank-icon");
    const rankRomanEl = document.getElementById("hero-rank-roman");
    const playerNameEl = document.getElementById("hero-player-name");
    const sublineEl = document.getElementById("hero-subline");

    const playerSelect = document.getElementById("player-select");
    const selectedOption = playerSelect.options[playerSelect.selectedIndex];
    const displayName = (selectedOption && selectedOption.textContent) || tag;
    playerNameEl.textContent = displayName;

    const sortedRankHistory = STATE.rankHistory.slice().sort(function (rowA, rowB) {
      return new Date(rowA.ended_at) - new Date(rowB.ended_at);
    });
    const latestRank =
      sortedRankHistory.length > 0 ? sortedRankHistory[sortedRankHistory.length - 1] : null;

    if (!latestRank) {
      sublineEl.textContent = "— · " + tag;
      rankIconEl.removeAttribute("src");
      rankRomanEl.textContent = "";
      return;
    }

    // Rank-delta baseline: the earliest rank-history row within the CURRENT period window only
    // (never mode-filtered — rank-history rows have no `mode` field, so `filterByModeAndPeriod`/
    // `applyFilters` cannot be reused here; see `filterRankHistoryByPeriod` below).
    const periodRankHistory = filterRankHistoryByPeriod(STATE.rankHistory);
    const sortedPeriodRankHistory = periodRankHistory.slice().sort(function (rowA, rowB) {
      return new Date(rowA.ended_at) - new Date(rowB.ended_at);
    });
    const baselineRank = sortedPeriodRankHistory.length > 0 ? sortedPeriodRankHistory[0] : null;

    clearElement(sublineEl);
    sublineEl.appendChild(
      document.createTextNode((latestRank.rank_label || "—") + " · " + tag)
    );

    if (baselineRank) {
      const rankDelta = latestRank.rank_value - baselineRank.rank_value;
      const rankDeltaText =
        rankDelta > 0 ? "+" + rankDelta : rankDelta < 0 ? String(rankDelta) : "±0";
      const rankDeltaEl = document.createElement("span");
      rankDeltaEl.className = "hero-rank-delta";
      rankDeltaEl.textContent = " " + rankDeltaText;
      sublineEl.appendChild(rankDeltaEl);
    }

    const iconUrl = tierIconUrl(latestRank.tier_name);
    if (iconUrl) {
      rankIconEl.src = iconUrl;
      rankIconEl.alt = latestRank.tier_name;
    } else {
      rankIconEl.removeAttribute("src");
      rankIconEl.alt = "";
    }
    rankRomanEl.textContent = tierRoman(latestRank.tier_level);
  }

  // === Period-only filter for rank-history rows (Task 15) — byte-for-byte the same cutoff-date
  // === math as `applyFilters`/`filterByModeAndPeriod`'s own period block, but deliberately
  // === self-contained: `v_player_rank_history` rows have no `mode` column, so reusing either of
  // === those 2 functions directly would either silently do nothing extra (harmless but
  // === misleading) or, worse, incorrectly zero out every row the moment a mode filter is active
  // === (since `row.mode === STATE.mode` would never match an undefined `row.mode`). ===
  function filterRankHistoryByPeriod(rows) {
    if (STATE.period === "All time") {
      return rows;
    }
    const daysBack = STATE.period === "Last 7 days" ? 7 : 30;
    const cutoffDate = new Date(Date.now() - daysBack * 24 * 60 * 60 * 1000);
    return rows.filter(function (row) {
      return new Date(row.ended_at) >= cutoffDate;
    });
  }

  // =========================================================================================
  // === RANK-TIER CHART (Task 15) ===
  // === `renderRankChart(history)` draws a translucent rank-tier line chart into
  // === #hero-rank-chart, absolutely positioned behind .hero-content by CSS. Y-axis labels are
  // === drawn only from tier_values/rank_labels actually observed in this player's own
  // === `history` — never a fabricated 1-22 full-range label, and never an "Elo"/points value.
  // === Built entirely with createElementNS — no raw markup injection anywhere.
  // =========================================================================================

  const SVG_NS = "http://www.w3.org/2000/svg";

  function renderRankChart(history) {
    const container = document.getElementById("hero-rank-chart");
    clearElement(container);

    const sortedHistory = history.slice().sort(function (rowA, rowB) {
      return new Date(rowA.ended_at) - new Date(rowB.ended_at);
    });

    // A single point (or no points at all) cannot draw a meaningful line — render nothing rather
    // than a misleading flat/empty chart, and never throw.
    if (sortedHistory.length < 2) {
      return;
    }

    const viewBoxWidth = 640;
    const viewBoxHeight = 170;

    let minRank = sortedHistory[0].rank_value;
    let maxRank = sortedHistory[0].rank_value;
    sortedHistory.forEach(function (row) {
      if (row.rank_value < minRank) {
        minRank = row.rank_value;
      }
      if (row.rank_value > maxRank) {
        maxRank = row.rank_value;
      }
    });
    // A perfectly flat history (every row the same tier) would otherwise divide by zero below —
    // widen the observed range by 1 tier on each side just for the y-axis math, not for the
    // labels (labels are still matched against the real, unwidened rank_value of each row).
    const rankRange = maxRank === minRank ? 1 : maxRank - minRank;
    const rankRangeMin = maxRank === minRank ? minRank - 0.5 : minRank;

    function rankValueToY(rankValue) {
      return viewBoxHeight - ((rankValue - rankRangeMin) / rankRange) * viewBoxHeight;
    }

    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + viewBoxWidth + " " + viewBoxHeight);

    // --- 4 evenly-spaced gridlines, each labelled with the closest real observation's tier label
    // --- (within 2 tier-values) or, failing that, the plain rounded numeric value. ---
    const gridlineCount = 4;
    for (let gridlineIndex = 0; gridlineIndex < gridlineCount; gridlineIndex++) {
      const gridRankValue = minRank + (rankRange * gridlineIndex) / (gridlineCount - 1);
      const gridY = rankValueToY(gridRankValue);

      const gridline = document.createElementNS(SVG_NS, "line");
      gridline.setAttribute("x1", "0");
      gridline.setAttribute("y1", String(gridY));
      gridline.setAttribute("x2", String(viewBoxWidth));
      gridline.setAttribute("y2", String(gridY));
      gridline.style.stroke = "var(--divider)";
      gridline.setAttribute("stroke-width", "1");
      svg.appendChild(gridline);

      let closestRow = sortedHistory[0];
      let closestDistance = Math.abs(closestRow.rank_value - gridRankValue);
      sortedHistory.forEach(function (row) {
        const distance = Math.abs(row.rank_value - gridRankValue);
        if (distance < closestDistance) {
          closestRow = row;
          closestDistance = distance;
        }
      });
      const gridLabelText =
        closestDistance <= 2 && closestRow.rank_label
          ? closestRow.rank_label
          : String(Math.round(gridRankValue));

      const gridLabel = document.createElementNS(SVG_NS, "text");
      gridLabel.setAttribute("x", "4");
      gridLabel.setAttribute("y", String(gridY - 4));
      gridLabel.setAttribute("font-size", "10");
      gridLabel.style.fill = "var(--text-muted-2)";
      gridLabel.textContent = gridLabelText;
      svg.appendChild(gridLabel);
    }

    // --- gold area fill + line + terminal point, one point per history row, evenly spaced by
    // --- index order across the viewBox's width. ---
    const xStep = viewBoxWidth / (sortedHistory.length - 1);
    const linePoints = sortedHistory.map(function (row, index) {
      return index * xStep + "," + rankValueToY(row.rank_value);
    });

    const area = document.createElementNS(SVG_NS, "polygon");
    area.setAttribute(
      "points",
      "0," + viewBoxHeight + " " + linePoints.join(" ") + " " + viewBoxWidth + "," + viewBoxHeight
    );
    area.style.fill = "rgba(255,210,61,.13)";
    svg.appendChild(area);

    const line = document.createElementNS(SVG_NS, "polyline");
    line.setAttribute("points", linePoints.join(" "));
    line.setAttribute("fill", "none");
    line.style.stroke = "var(--accent-gold)";
    line.setAttribute("stroke-width", "2.4");
    line.setAttribute("stroke-linejoin", "round");
    svg.appendChild(line);

    const lastRow = sortedHistory[sortedHistory.length - 1];
    const terminalPoint = document.createElementNS(SVG_NS, "circle");
    terminalPoint.setAttribute("cx", String((sortedHistory.length - 1) * xStep));
    terminalPoint.setAttribute("cy", String(rankValueToY(lastRow.rank_value)));
    terminalPoint.setAttribute("r", "4");
    terminalPoint.style.fill = "var(--accent-gold)";
    svg.appendChild(terminalPoint);

    container.appendChild(svg);
  }

  // =========================================================================================
  // === HERO KPI CARDS + FORM CHIPS ===
  // === `renderKpiCards`/`renderFormChips` both take the same filtered set-rows array
  // === `renderAll()` already computed via `applyFilters(STATE.setRows)` — neither function
  // === re-filters or re-fetches anything. Both render into containers Task 6 wired directly into
  // === `.hero-content` (`#hero-kpis`, `#hero-form`); the old Overall-section summary display
  // === these replace is gone entirely.
  // =========================================================================================

  function winrateTone(winrate) {
    if (winrate === null || winrate === undefined) {
      return null;
    }
    if (winrate >= 0.6) {
      return "var(--win)";
    }
    if (winrate >= 0.45) {
      return "var(--accent-gold)";
    }
    return "var(--loss)";
  }

  function renderKpiCards(rows) {
    const container = document.getElementById("hero-kpis");
    clearElement(container);

    let wins = 0;
    let losses = 0;
    let draws = 0;
    rows.forEach(function (row) {
      if (row.result === "win") {
        wins++;
      } else if (row.result === "loss") {
        losses++;
      } else if (row.result === "draw") {
        draws++;
      }
    });
    const winrate = wins + losses === 0 ? null : wins / (wins + losses);

    const cards = [
      { label: LABELS.setsPlayed, value: String(rows.length), color: null },
      { label: LABELS.winrate, value: formatWinrate(winrate), color: winrateTone(winrate) },
      { label: LABELS.wins, value: String(wins), color: "var(--win)" },
      { label: LABELS.losses, value: String(losses), color: "var(--loss)" },
      { label: LABELS.draws, value: String(draws), color: "var(--draw)" },
    ];

    cards.forEach(function (card) {
      const cardEl = document.createElement("div");
      cardEl.className = "hero-kpi-card";

      const labelEl = document.createElement("div");
      labelEl.className = "hero-kpi-label";
      labelEl.textContent = card.label;

      const valueEl = document.createElement("div");
      valueEl.className = "hero-kpi-value";
      valueEl.textContent = card.value;
      if (card.color) {
        valueEl.style.color = card.color;
      }

      cardEl.appendChild(labelEl);
      cardEl.appendChild(valueEl);
      container.appendChild(cardEl);
    });
  }

  function renderFormChips(rows) {
    const container = document.getElementById("hero-form");
    clearElement(container);

    const sortedRows = rows.slice().sort(function (rowA, rowB) {
      return new Date(rowB.ended_at) - new Date(rowA.ended_at);
    });
    const recentRows = sortedRows.slice(0, 10).reverse();

    recentRows.forEach(function (row) {
      const chip = document.createElement("span");
      chip.className = "hero-form-chip";

      if (row.result === "win") {
        chip.textContent = "W";
        chip.style.background = "var(--win)";
      } else if (row.result === "loss") {
        chip.textContent = "L";
        chip.style.background = "var(--loss)";
      } else {
        chip.textContent = "D";
        chip.style.background = "var(--text-muted-4)";
      }

      container.appendChild(chip);
    });
  }

  // =========================================================================================
  // === DOM HELPERS ===
  // =========================================================================================

  function clearElement(element) {
    while (element.firstChild) {
      element.removeChild(element.firstChild);
    }
  }

  function setStatus(container, statusClass, message) {
    clearElement(container);
    const paragraph = document.createElement("p");
    paragraph.className = "status " + statusClass;
    paragraph.textContent = message;
    container.appendChild(paragraph);
  }

  function formatWinrate(winrate) {
    if (winrate === null || winrate === undefined) {
      return "—";
    }
    return (winrate * 100).toFixed(1) + "%";
  }

  function makeCell(text) {
    const cell = document.createElement("td");
    cell.textContent = text;
    return cell;
  }

  // =========================================================================================
  // === MODE / TIER HELPERS ===
  // === Pure, dependency-free display formatters. `prettyMode` degrades gracefully for any
  // === unseen camelCase mode string (new modes ship regularly, so no closed lookup list here).
  // === Tier helpers take `tier_name`/`tier_level` as already-structured inputs (never parse
  // === `rank_label`) — those columns come straight from rank_tiers via the views in
  // === 007_redesign_views.sql.
  // =========================================================================================

  const TIER_ROMAN_NUMERALS = {
    1: "I",
    2: "II",
    3: "III"
  };

  function prettyMode(mode) {
    if (!mode) {
      return "";
    }
    const spaced = mode.replace(/([a-z0-9])([A-Z])/g, "$1 $2");
    return spaced.charAt(0).toUpperCase() + spaced.slice(1);
  }

  // =========================================================================================
  // === ICON LOOKUPS (map/brawler tables) ===
  // === `modeIconUrl` maps a raw ranked mode string (e.g. "gemGrab") to its game-mode icon in
  // === images/gamemodes/ — only the 6 ranked-eligible modes have artwork, so anything else falls
  // === back to null (caller keeps the placeholder). `brawlerIconUrl` derives a brawler's portrait
  // === path in images/brawlers/Assets2026-08-25/ from `brawler_name` by lowercasing/hyphenating —
  // === this generalizes to new brawlers automatically, with a small override table for the 3 names
  // === whose punctuation doesn't hyphenate cleanly (and 1 filename that doesn't follow the
  // === `<slug>_portrait.png` convention).
  // =========================================================================================

  const MODE_ICON_FILENAMES = {
    bounty: "bounty_icon.png",
    brawlBall: "brawl_ball_icon.png",
    gemGrab: "gem_grab_icon.png",
    heist: "heist_icon.png",
    hotZone: "hot_zone_icon.png",
    knockout: "knock_out_icon.png",
  };

  function modeIconUrl(mode) {
    const filename = MODE_ICON_FILENAMES[mode];
    return filename ? "images/gamemodes/" + filename : null;
  }

  const BRAWLER_ICON_SLUG_OVERRIDES = {
    "R-T": "rt",
    "STARR NOVA": "starr_nova",
    "LARRY & LAWRIE": "larry&lawrie",
  };

  const BRAWLER_ICON_FILENAME_OVERRIDES = {
    SPROUT: "sprout_portrait_new.png",
  };

  function brawlerIconUrl(brawlerName) {
    if (!brawlerName) {
      return null;
    }
    const upperName = brawlerName.toUpperCase();
    const overrideFilename = BRAWLER_ICON_FILENAME_OVERRIDES[upperName];
    if (overrideFilename) {
      return "images/brawlers/Assets2026-08-25/" + overrideFilename;
    }
    const slug =
      BRAWLER_ICON_SLUG_OVERRIDES[upperName] ||
      upperName
        .toLowerCase()
        .replace(/\./g, "")
        .replace(/[^a-z0-9&]+/g, "-")
        .replace(/^-+|-+$/g, "");
    return "images/brawlers/Assets2026-08-25/" + slug + "_portrait.png";
  }

  function tierIconUrl(tier_name) {
    if (!tier_name) {
      return null;
    }
    return "images/ranks/icon_rank_sticker_" + tier_name.toLowerCase() + ".png";
  }

  function tierRoman(tier_level) {
    if (tier_level === null || tier_level === undefined) {
      return "";
    }
    return TIER_ROMAN_NUMERALS[tier_level] || "";
  }

  // =========================================================================================
  // === COLLAPSIBLE PANEL ===
  // === `makeCollapsiblePanel({id, title, tint, rightText, bodyEl})` builds a reusable
  // === `<section class="panel">` (header + body) that Tasks 10/14 wrap the map/brawler/teammate/
  // === recent sections in. Collapse/expand state lives in `STATE.collapsed[id]` (global STATE
  // === from the DATA LAYER section above) so a later `renderAll()` re-render can call this again
  // === without resetting a panel the user had collapsed. `STATE.collapsed[id] === true` means the
  // === panel is currently collapsed (body hidden); `false` or absent (the default) means expanded.
  // === Toggling is a pure class/attribute flip — `options.bodyEl`'s inner DOM is never touched,
  // === so sort state on `<th data-order>` elsewhere in the app survives a collapse/expand cycle.
  // =========================================================================================

  function makeCollapsiblePanel(options) {
    const panelId = options.id;

    if (STATE.collapsed[panelId] === undefined) {
      STATE.collapsed[panelId] = false;
    }

    const panel = document.createElement("section");
    panel.className = "panel";
    panel.id = panelId;

    const header = document.createElement("div");
    header.className = "panel-header";
    header.setAttribute("role", "button");
    header.setAttribute("tabindex", "0");
    header.style.background = "linear-gradient(100deg, " + options.tint + ", var(--panel) 70%)";

    const chevron = document.createElement("span");
    chevron.className = "panel-chevron";

    const title = document.createElement("div");
    title.className = "panel-title";
    title.textContent = options.title;

    const rightText = document.createElement("span");
    rightText.className = "panel-right-text";
    rightText.textContent = options.rightText;

    header.appendChild(chevron);
    header.appendChild(title);
    header.appendChild(rightText);

    const body = document.createElement("div");
    body.className = "panel-body";
    body.appendChild(options.bodyEl);

    panel.appendChild(header);
    panel.appendChild(body);

    function updatePanelState() {
      const isCollapsed = STATE.collapsed[panelId] === true;
      chevron.textContent = isCollapsed ? "▸" : "▾";
      header.setAttribute("aria-expanded", String(!isCollapsed));
      panel.classList.toggle("panel-collapsed", isCollapsed);
    }

    function togglePanel() {
      STATE.collapsed[panelId] = STATE.collapsed[panelId] === true ? false : true;
      updatePanelState();
    }

    function handleHeaderClick() {
      togglePanel();
    }

    function handleHeaderKeydown(event) {
      if (event.key !== "Enter" && event.key !== " ") {
        return;
      }
      event.preventDefault();
      togglePanel();
    }

    header.addEventListener("click", handleHeaderClick);
    header.addEventListener("keydown", handleHeaderKeydown);

    updatePanelState();

    return panel;
  }

  // =========================================================================================
  // === SORT HELPER ===
  // === Mirrors the click-to-sort pattern from docs/script.js:3-21 (toggle asc/desc via a
  // === data-order attribute on the clicked header cell, parseFloat compare when both cells in
  // === the column are numeric, otherwise localeCompare) — generalized here to take an arbitrary
  // === table element and column index instead of a single hardcoded table id.
  // =========================================================================================

  function sortTableByColumn(table, columnIndex) {
    const headerRow = table.tHead.rows[0];
    const headerCell = headerRow.cells[columnIndex];
    const isAscending = headerCell.getAttribute("data-order") === "asc";
    const rows = Array.from(table.tBodies[0].rows);

    rows.sort(function (rowA, rowB) {
      const textA = rowA.cells[columnIndex].textContent.trim();
      const textB = rowB.cells[columnIndex].textContent.trim();
      const numA = parseFloat(textA.replace(/[%\s]/g, ""));
      const numB = parseFloat(textB.replace(/[%\s]/g, ""));
      if (!isNaN(numA) && !isNaN(numB)) {
        return isAscending ? numA - numB : numB - numA;
      }
      return isAscending ? textA.localeCompare(textB) : textB.localeCompare(textA);
    });

    rows.forEach(function (row) {
      table.tBodies[0].appendChild(row);
    });

    for (let i = 0; i < headerRow.cells.length; i++) {
      if (i !== columnIndex) {
        headerRow.cells[i].removeAttribute("data-order");
      }
    }
    headerCell.setAttribute("data-order", isAscending ? "desc" : "asc");
  }

  function makeSortableHeader(table, columnIndex, label) {
    const th = document.createElement("th");
    th.textContent = label;
    th.addEventListener("click", function () {
      sortTableByColumn(table, columnIndex);
    });
    return th;
  }

  // =========================================================================================
  // === MIN-SAMPLE FILTER ===
  // === Client-side only: every filterable row carries a data-sets attribute with the row's
  // === sample size, set once at render time. Changing the threshold input just toggles the
  // === "filtered-out" class on already-rendered rows — no re-query.
  // =========================================================================================

  function applyMinSampleFilter() {
    const minSampleInput = document.getElementById("min-sample-input");
    const threshold = parseInt(minSampleInput.value, 10) || 0;
    const filterableTableIds = ["map-table", "brawler-table", "teammate-table"];

    filterableTableIds.forEach(function (tableId) {
      const table = document.getElementById(tableId);
      if (!table || !table.tBodies[0]) {
        return;
      }
      const rows = Array.from(table.tBodies[0].rows);
      rows.forEach(function (row) {
        const rowSampleSize = parseInt(row.getAttribute("data-sets"), 10) || 0;
        if (rowSampleSize < threshold) {
          row.classList.add("filtered-out");
        } else {
          row.classList.remove("filtered-out");
        }
      });
    });
  }

  function updateMinSetsHint() {
    const filterableTableIds = ["map-table", "brawler-table", "teammate-table"];
    let hiddenCount = 0;

    filterableTableIds.forEach(function (tableId) {
      const table = document.getElementById(tableId);
      if (!table || !table.tBodies[0]) {
        return;
      }
      hiddenCount += table.querySelectorAll("tr.filtered-out").length;
    });

    const hintEl = document.getElementById("min-sample-hint");
    hintEl.textContent = hiddenCount + " " + LABELS.rowsHiddenSuffix;
  }

  // === Task 10: per-panel "N rader over grensen" counts (the collapsible panels' own right-side
  // === text, distinct from the slider's single combined `#min-sample-hint`, above). Both read the
  // === same `.filtered-out` classes `applyMinSampleFilter()` already maintains — neither of these
  // === 2 helpers ever toggles that class itself. ===

  function countFilteredOutRows(tableId) {
    return document.querySelectorAll("#" + tableId + " tbody tr.filtered-out").length;
  }

  function updatePanelRightText(panelId, count) {
    const rightTextEl = document.querySelector("#" + panelId + " .panel-right-text");
    if (!rightTextEl) {
      return;
    }
    rightTextEl.textContent = count + " " + LABELS.rowsOverThreshold;
  }

  function onMinSetsInput() {
    const minSampleInput = document.getElementById("min-sample-input");
    STATE.minSets = parseInt(minSampleInput.value, 10);
    document.getElementById("min-sample-value").textContent = String(STATE.minSets);
    renderAll();
  }

  document.getElementById("min-sample-input").addEventListener("input", onMinSetsInput);

  // =========================================================================================
  // === SIDEBAR FILTERS: BRAWLER CLASS TREE ===
  // === `renderBrawlerTree()` is a pure DOM-rebuild function called from renderAll() on every
  // === render, same convention as renderModeChips/renderPeriodChips below — no network requests.
  // === The tree is built from STATE.setRows filtered by mode+period ONLY (via the local
  // === `filterByModeAndPeriod` helper, a deliberate small duplication of applyFilters' period/mode
  // === logic) — never by STATE.filter itself, since that would collapse the tree to a single row.
  // === Selecting a class or brawler writes STATE.filter in the exact `{kind, value}` shape
  // === applyFilters/renderFilterBar already expect (Task 8's contract); the chevron only ever
  // === touches STATE.expandedClasses, never STATE.filter.
  // =========================================================================================

  function filterByModeAndPeriod(rows) {
    let filteredRows = rows;

    if (STATE.period !== "All time") {
      const daysBack = STATE.period === "Last 7 days" ? 7 : 30;
      const cutoffDate = new Date(Date.now() - daysBack * 24 * 60 * 60 * 1000);
      filteredRows = filteredRows.filter(function (row) {
        return new Date(row.ended_at) >= cutoffDate;
      });
    }

    if (STATE.mode !== "All modes") {
      filteredRows = filteredRows.filter(function (row) {
        return row.mode === STATE.mode;
      });
    }

    return filteredRows;
  }

  function buildBrawlerClassGroups() {
    const brawlerAggregates = aggregate(
      filterByModeAndPeriod(STATE.setRows),
      function (row) {
        return row.brawler_id;
      },
      function (row) {
        return row.brawler_name || String(row.brawler_id);
      }
    );

    const groupsByClass = new Map();
    brawlerAggregates.forEach(function (brawlerAggregate) {
      const className = BRAWLER_CLASSES[brawlerAggregate.key] || "Unclassified";
      if (!groupsByClass.has(className)) {
        groupsByClass.set(className, { sets: 0, wins: 0, losses: 0, brawlers: [] });
      }
      const classTotals = groupsByClass.get(className);
      classTotals.sets += brawlerAggregate.sets;
      classTotals.wins += brawlerAggregate.wins;
      classTotals.losses += brawlerAggregate.losses;
      classTotals.brawlers.push(brawlerAggregate);
    });

    const orderedGroups = [];
    BRAWLER_CLASS_ORDER.forEach(function (className) {
      const classTotals = groupsByClass.get(className);
      if (!classTotals || classTotals.sets === 0) {
        return;
      }

      const winrate =
        classTotals.wins + classTotals.losses === 0
          ? null
          : classTotals.wins / (classTotals.wins + classTotals.losses);

      const sortedBrawlers = classTotals.brawlers.slice().sort(function (brawlerA, brawlerB) {
        return brawlerB.sets - brawlerA.sets;
      });

      orderedGroups.push({
        className: className,
        sets: classTotals.sets,
        winrate: winrate,
        brawlers: sortedBrawlers,
      });
    });

    return orderedGroups;
  }

  function buildBrawlerRow(brawlerAggregate) {
    const isActive =
      STATE.filter.kind === "brawler" && STATE.filter.value === brawlerAggregate.key;

    const row = document.createElement("div");
    row.className = isActive ? "tree-brawler-row active" : "tree-brawler-row";
    row.addEventListener("click", function () {
      STATE.filter = isActive
        ? { kind: null, value: null }
        : { kind: "brawler", value: brawlerAggregate.key };
      renderAll();
    });

    const nameEl = document.createElement("span");
    nameEl.className = "tree-brawler-name";
    nameEl.textContent = brawlerAggregate.label;
    row.appendChild(nameEl);

    const setsEl = document.createElement("span");
    setsEl.className = "tree-brawler-sets";
    setsEl.textContent = brawlerAggregate.sets + "s";
    row.appendChild(setsEl);

    const winrateEl = document.createElement("span");
    winrateEl.className = "tree-brawler-wr";
    winrateEl.textContent = formatWinrate(brawlerAggregate.winrate);
    const tone = winrateTone(brawlerAggregate.winrate);
    if (tone) {
      winrateEl.style.color = tone;
    }
    row.appendChild(winrateEl);

    return row;
  }

  function buildClassRow(classGroup) {
    const isActive =
      STATE.filter.kind === "class" && STATE.filter.value === classGroup.className;
    const isExpanded = STATE.expandedClasses[classGroup.className] === true;

    const classRow = document.createElement("div");
    classRow.className = isActive ? "tree-class active" : "tree-class";

    const header = document.createElement("div");
    header.className = "tree-class-header";
    // Clicking anywhere in the header (chevron excluded, see below) is the "name/bar area" click
    // that sets/clears the class filter.
    header.addEventListener("click", function () {
      STATE.filter = isActive
        ? { kind: null, value: null }
        : { kind: "class", value: classGroup.className };
      renderAll();
    });

    const chevron = document.createElement("span");
    chevron.className = "tree-chevron";
    chevron.textContent = isExpanded ? "▾" : "▸";
    chevron.addEventListener("click", function (event) {
      // stopPropagation is required here: the chevron is a DOM descendant of `header`, so without
      // this a chevron click would also bubble up into header's own click handler above and
      // incorrectly toggle STATE.filter — the chevron must only ever touch STATE.expandedClasses.
      event.stopPropagation();
      STATE.expandedClasses[classGroup.className] = !isExpanded;
      renderBrawlerTree();
    });
    header.appendChild(chevron);

    const main = document.createElement("div");
    main.className = "tree-class-main";

    const nameEl = document.createElement("div");
    nameEl.className = "tree-class-name";
    nameEl.textContent = classGroup.className;
    main.appendChild(nameEl);

    const meta = document.createElement("div");
    meta.className = "tree-class-meta";

    const barTrack = document.createElement("div");
    barTrack.className = "tree-bar-track";
    const barFill = document.createElement("div");
    barFill.className = "tree-bar-fill";
    const winratePercent = classGroup.winrate === null ? 0 : classGroup.winrate * 100;
    barFill.style.width = winratePercent + "%";
    barFill.style.background = winrateTone(classGroup.winrate) || "var(--text-muted-4)";
    barTrack.appendChild(barFill);
    meta.appendChild(barTrack);

    const winrateEl = document.createElement("span");
    winrateEl.className = "tree-wr";
    winrateEl.textContent = formatWinrate(classGroup.winrate);
    const tone = winrateTone(classGroup.winrate);
    if (tone) {
      winrateEl.style.color = tone;
    }
    meta.appendChild(winrateEl);

    const setsEl = document.createElement("span");
    setsEl.className = "tree-sets";
    setsEl.textContent = classGroup.sets + "s";
    meta.appendChild(setsEl);

    main.appendChild(meta);
    header.appendChild(main);
    classRow.appendChild(header);

    if (isExpanded) {
      const children = document.createElement("div");
      children.className = "tree-children";
      classGroup.brawlers.forEach(function (brawlerAggregate) {
        children.appendChild(buildBrawlerRow(brawlerAggregate));
      });
      classRow.appendChild(children);
    }

    return classRow;
  }

    const headerContainer = document.getElementById("brawler-tree-header");
    const listContainer = document.getElementById("brawler-tree-list");
    clearElement(headerContainer);
    clearElement(listContainer);

    const title = document.createElement("span");

    title.textContent = LABELS.brawlerTreeTitle;

  // === `renderModeChips`/`renderPeriodChips`/`renderFilterBar` are all pure DOM-rebuild

    chipValues.forEach(function (modeValue) {
      const chip = document.createElement("span");

      chip.addEventListener("click", function () {

  async function loadPlayers() {
    const select = document.getElementById("player-select");
    const listStatus = document.getElementById("player-list-status");

    const { data, error } = await sb
      .from("players")
      .select("tag,name")
      .eq("is_tracked", true)
      .order("name");

    clearElement(select);

    if (error) {
      listStatus.style.display = "block";
      listStatus.className = "status error";
      listStatus.textContent = LABELS.errorLoadingPlayers + error.message;
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = LABELS.failedToLoadPlayers;
      select.appendChild(placeholder);
      return;
    }

    if (!data || data.length === 0) {
      listStatus.style.display = "block";
      listStatus.className = "status empty";
      listStatus.textContent = LABELS.noTrackedPlayers;
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = LABELS.noTrackedPlayersOption;
      select.appendChild(placeholder);
      return;
    }

    listStatus.style.display = "none";

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = LABELS.choosePlayer;
    select.appendChild(placeholder);

    data.forEach(function (player) {
      const option = document.createElement("option");
      option.value = player.tag;
      option.textContent = player.name || player.tag;
      select.appendChild(option);
    });
  }

  function onPlayerSelected() {
    const select = document.getElementById("player-select");
    const tag = select.value;

    if (!tag) {
      const emptyMessage = LABELS.selectPlayerToViewStats;
      setStatus(document.getElementById("map-content"), "empty", emptyMessage);
      setStatus(document.getElementById("brawler-content"), "empty", emptyMessage);
      setStatus(document.getElementById("teammate-content"), "empty", emptyMessage);
      setStatus(document.getElementById("recent-content"), "empty", emptyMessage);
      clearElement(document.getElementById("match-detail-content"));
      return;

    loadPlayerData(tag);

  // =========================================================================================
  // === BEST/WORST MAP CALLOUT CARDS ===
  // === `renderCallouts(mapRows)` takes the exact `mapRows` array renderAll() already builds for
  // === the map table (see the TEMPORARY bridge in the DATA LAYER section above) — it never
  // === recomputes the mode/map aggregation itself. Filters to `row.sets_played >= STATE.minSets`
  // === reading STATE live (so a future min-sets control immediately changes which rows
  // === qualify), then finds the max/min winrate row via a linear scan — the idiomatic pattern
  // === already used for win/loss/draw tallies elsewhere in this file. Rows with a null winrate
  // === (all draws, no decisive sets) are excluded from best/worst consideration entirely. Always
  // === renders both cards, even with zero qualifying rows or an empty mapRows array, showing "—"
  // === per the mockup's own empty-state behaviour rather than hiding the cards.
  // =========================================================================================

  function renderCallouts(mapRows) {
    const container = document.getElementById("map-callouts");
    clearElement(container);

    const qualifyingRows = mapRows.filter(function (row) {
      return (
        row.sets_played >= STATE.minSets && row.winrate !== null && row.winrate !== undefined
      );
    });

    let bestRow = null;
    let worstRow = null;
    qualifyingRows.forEach(function (row) {
      if (bestRow === null || row.winrate > bestRow.winrate) {
        bestRow = row;
      }
      if (worstRow === null || row.winrate < worstRow.winrate) {
        worstRow = row;
      }
    });

    const callouts = [
      { tag: LABELS.bestMap, tone: "var(--win)", row: bestRow },
      { tag: LABELS.worstMap, tone: "var(--loss)", row: worstRow },
    ];

    callouts.forEach(function (callout) {
      const row = callout.row;

      const card = document.createElement("div");
      card.className = "callout-card";
      card.style.borderLeftColor = callout.tone;

      const swatch = document.createElement("div");
      swatch.className = "callout-swatch";
      const iconUrl = row ? modeIconUrl(row.mode) : null;
      if (iconUrl) {
        const icon = document.createElement("img");
        icon.className = "callout-icon";
        icon.src = iconUrl;
        icon.alt = prettyMode(row.mode);
        icon.loading = "lazy";
        icon.onerror = function () {
          icon.onerror = null;
          icon.removeAttribute("src");
          icon.alt = "";
        };
        swatch.appendChild(icon);
      }
      card.appendChild(swatch);

      const info = document.createElement("div");
      info.className = "callout-info";

      const tagEl = document.createElement("div");
      tagEl.className = "callout-tag";
      tagEl.textContent = callout.tag;
      tagEl.style.color = callout.tone;
      info.appendChild(tagEl);

      const mapEl = document.createElement("div");
      mapEl.className = "callout-map";
      mapEl.textContent = row ? row.map : "—";
      info.appendChild(mapEl);

      const subEl = document.createElement("div");
      subEl.className = "callout-sub";
      subEl.textContent = row
        ? prettyMode(row.mode) + " · " + row.sets_played + " " + LABELS.setsSuffix
        : "0 " + LABELS.setsSuffix;
      info.appendChild(subEl);

      card.appendChild(info);

      const winrateEl = document.createElement("div");
      winrateEl.className = "callout-wr";
      winrateEl.textContent = row ? formatWinrate(row.winrate) : "—";
      winrateEl.style.color = callout.tone;
      card.appendChild(winrateEl);

      container.appendChild(card);
    });
  }

  // =========================================================================================
  // === TABLE ROW HELPERS (shared by the map/brawler/teammate table renderers below) ===
  // === `buildRowIconCell` builds the "32x32 placeholder + label (+ optional sub-label) + optional
  // === badges" first-column cell shared across all 3 tables; `buildWinrateCell` builds the
  // === "12px bar + 21px %" final-column cell. Both are pure DOM builders — no DOM lookups, no
  // === STATE reads — so each renderer decides its own THIN-badge threshold and passes it in.
  // =========================================================================================

  function buildRowIconCell(label, subLabel, isThin, extraBadgeEls, iconUrl) {
    const cell = document.createElement("td");

    const wrapper = document.createElement("div");
    wrapper.className = "table-row-cell";

    if (iconUrl) {
      const icon = document.createElement("img");
      icon.className = "table-row-icon";
      icon.src = iconUrl;
      icon.alt = label;
      icon.loading = "lazy";
      // A brawler/map shipped after the last asset export won't have artwork yet — fall back to
      // the plain placeholder swatch instead of showing a broken-image icon.
      icon.onerror = function () {
        icon.onerror = null;
        icon.removeAttribute("src");
        icon.alt = "";
      };
      wrapper.appendChild(icon);
    } else {
      const placeholder = document.createElement("div");
      placeholder.className = "table-icon-placeholder";
      wrapper.appendChild(placeholder);
    }

    const textStack = document.createElement("div");
    textStack.className = "table-row-text";

    const labelLine = document.createElement("div");
    labelLine.className = "table-row-label-line";

    const labelEl = document.createElement("span");
    labelEl.className = "table-row-label";
    labelEl.textContent = label;
    labelLine.appendChild(labelEl);

    (extraBadgeEls || []).forEach(function (badgeEl) {
      labelLine.appendChild(badgeEl);
    });

    if (isThin) {
      const thinBadge = document.createElement("span");
      thinBadge.className = "badge-thin";
      thinBadge.textContent = LABELS.thinBadge;
      thinBadge.title = LABELS.thinBadgeTooltip;
      labelLine.appendChild(thinBadge);
    }

    textStack.appendChild(labelLine);

    if (subLabel) {
      const subLabelEl = document.createElement("span");
      subLabelEl.className = "table-row-sublabel";
      subLabelEl.textContent = subLabel;
      textStack.appendChild(subLabelEl);
    }

    wrapper.appendChild(textStack);
    cell.appendChild(wrapper);

    return cell;
  }

  function buildWinrateCell(winrate) {
    const cell = document.createElement("td");
    const tone = winrateTone(winrate) || "var(--text-muted-4)";
    const barPercent = winrate === null || winrate === undefined ? 0 : winrate * 100;

    const barTrack = document.createElement("div");
    barTrack.className = "winrate-bar-track";
    const barFill = document.createElement("div");
    barFill.className = "winrate-bar-fill";
    barFill.style.width = barPercent + "%";
    barFill.style.background = tone;
    barTrack.appendChild(barFill);
    cell.appendChild(barTrack);

    // The percentage is a real, standalone text node (not embedded inside the bar) — required so
    // `sortTableByColumn`'s `cell.textContent` read still yields exactly the "NN.N%" string.
    const textEl = document.createElement("span");
    textEl.className = "winrate-bar-text";
    textEl.textContent = formatWinrate(winrate);
    textEl.style.color = tone;
    cell.appendChild(textEl);

    return cell;
  }

  // =========================================================================================
  // === TREND SPARKLINE (Task 15) ===
  // === `renderSparkline(rows)` takes one map/brawler/teammate group's own chronological set-rows
  // === (the same `group.rows` array `aggregate()` already produces, ascending by `ended_at`) and
  // === returns either `null` (fewer than 3 sets — not enough data for a meaningful trend, so the
  // === Trend <td> stays empty) or a small inline SVG plotting a ROLLING cumulative-from-the-start
  // === winrate across up to 8 chronological buckets. Never fabricates data — only real
  // === `result` values from `rows` are read. Built entirely with createElementNS.
  // =========================================================================================

  function renderSparkline(rows) {
    if (rows.length < 3) {
      return null;
    }

    const viewBoxWidth = 92;
    const viewBoxHeight = 26;
    const midpointY = viewBoxHeight / 2;

    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + viewBoxWidth + " " + viewBoxHeight);
    svg.classList.add("sparkline-svg");

    const referenceLine = document.createElementNS(SVG_NS, "line");
    referenceLine.setAttribute("x1", "0");
    referenceLine.setAttribute("y1", String(midpointY));
    referenceLine.setAttribute("x2", String(viewBoxWidth));
    referenceLine.setAttribute("y2", String(midpointY));
    referenceLine.style.stroke = "var(--divider)";
    referenceLine.setAttribute("stroke-width", "1");
    svg.appendChild(referenceLine);

    // Bucket the rows into up to 8 roughly-equal-sized contiguous chronological chunks. Each
    // bucket's end index marks how far into `rows` its ROLLING winrate looks back — bucket 0's
    // winrate covers rows[0..endIndex0], bucket 1's covers rows[0..endIndex1], and so on, always
    // starting from the very first row (cumulative-to-that-point, never a per-bucket-only stat).
    const bucketCount = Math.min(8, rows.length);
    const bucketEndIndexes = [];
    for (let bucketIndex = 0; bucketIndex < bucketCount; bucketIndex++) {
      const endIndex = Math.round(((bucketIndex + 1) * rows.length) / bucketCount) - 1;
      bucketEndIndexes.push(endIndex);
    }

    const xStep = viewBoxWidth / (bucketCount - 1);
    const bucketPoints = bucketEndIndexes.map(function (endIndex, bucketIndex) {
      let wins = 0;
      let losses = 0;
      for (let rowIndex = 0; rowIndex <= endIndex; rowIndex++) {
        if (rows[rowIndex].result === "win") {
          wins++;
        } else if (rows[rowIndex].result === "loss") {
          losses++;
        }
      }
      const rollingWinrate = wins + losses === 0 ? null : wins / (wins + losses);
      const y =
        rollingWinrate === null
          ? midpointY
          : viewBoxHeight - 4 - rollingWinrate * (viewBoxHeight - 8);
      return { x: bucketIndex * xStep, y: y, winrate: rollingWinrate };
    });

    const lastPoint = bucketPoints[bucketPoints.length - 1];
    const lineColor = winrateTone(lastPoint.winrate) || "var(--text-muted-4)";

    const polyline = document.createElementNS(SVG_NS, "polyline");
    polyline.setAttribute(
      "points",
      bucketPoints
        .map(function (point) {
          return point.x + "," + point.y;
        })
        .join(" ")
    );
    polyline.setAttribute("fill", "none");
    polyline.style.stroke = lineColor;
    polyline.setAttribute("stroke-width", "1.8");
    svg.appendChild(polyline);

    const terminalPoint = document.createElementNS(SVG_NS, "circle");
    terminalPoint.setAttribute("cx", String(lastPoint.x));
    terminalPoint.setAttribute("cy", String(lastPoint.y));
    terminalPoint.setAttribute("r", "2.4");
    terminalPoint.style.fill = lineColor;
    svg.appendChild(terminalPoint);

    return svg;
  }

  // =========================================================================================

  function renderMapTable(container, rows) {
    clearElement(container);

    const table = document.createElement("table");
    table.id = "map-table";

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");
    // Column order: Map (icon + name + mode sub-label), Sets, W, L, D, Trend, Winrate. Trend
    // (index 5) is a plain non-sortable header — Task 15 fills its per-row <td> later.
    const columnLabels = [
      LABELS.tableMap,
      LABELS.tableSets,
      LABELS.tableWins,
      LABELS.tableLosses,
      LABELS.tableDraws,
      LABELS.tableTrend,
      LABELS.tableWinrate,
    ];
    const trendColumnIndex = 5;
    columnLabels.forEach(function (label, index) {
      if (index === trendColumnIndex) {
        const th = document.createElement("th");
        th.textContent = label;
        headerRow.appendChild(th);
      } else {
        headerRow.appendChild(makeSortableHeader(table, index, label));
      }
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    rows.forEach(function (row) {
      const tr = document.createElement("tr");
      tr.setAttribute("data-sets", String(row.sets_played));
      const isThin = row.sets_played < STATE.minSets + 2;
      tr.appendChild(
        buildRowIconCell(row.map, prettyMode(row.mode), isThin, null, modeIconUrl(row.mode))
      );
      tr.appendChild(makeCell(String(row.sets_played)));
      tr.appendChild(makeCell(String(row.wins)));
      tr.appendChild(makeCell(String(row.losses)));
      tr.appendChild(makeCell(String(row.draws)));
      const trendCell = document.createElement("td");
      const sparkline = renderSparkline(row.rows || []);
      if (sparkline) {
        trendCell.appendChild(sparkline);
      }
      tr.appendChild(trendCell);
      tr.appendChild(buildWinrateCell(row.winrate));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    container.appendChild(table);
  }
