<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranked Stats</title>
<!--
  rankedstats/stats.html — standalone local ranked-stats viewer.

  This page is LOCAL-ONLY. It is meant to be opened directly from disk as a `file://` URL (or
  served by any static file server you happen to have handy) — it is deliberately NOT wired into
  the Jekyll site under `docs/`, has no Jekyll front matter, and does not load `docs/style.css`.
  All styling below is self-contained inline CSS so the page renders identically no matter how it
  is opened.

  It talks directly to Supabase's PostgREST API via the `@supabase/supabase-js` v2 UMD bundle
  loaded from the jsdelivr CDN below — no build step, no bundler, no npm install, no
  `package.json`. Every query in this file is a plain SELECT against one of the `v_player_*`
  views defined in `rankedstats/migrations/003_views.sql`; it never queries `ranked_sets`,
  `set_participants`, or `battles` directly, and it never writes/inserts/updates/deletes anything.

  The Supabase URL and key hardcoded below are a PUBLISHABLE (anon) key — a deliberately different,
  weaker credential than the elevated write-capable key used by the server-side ingest script — so
  it is safe to commit. Every table and view this page can see is governed by row-level security
  policies that only ever grant SELECT to the `anon`/`authenticated` roles (see 001_init.sql and
  003_views.sql), so this key cannot write anything even if asked to.
-->
<link rel="stylesheet" href="stats.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="brawler_classes.js"></script>
</head>
<body>

<!-- ===================== HERO ===================== -->
<!-- .hero-content holds 3 children, in order: .hero-rank-badge (the player's profile icon,
     #hero-player-icon), .hero-identity (name + subline row + the "Form" chip row, all stacked in
     one column), and .hero-kpis (5 KPI cards, right-aligned via margin-left: auto on .hero-kpis).
     .hero-subline-row holds the small rank-tier icon (#hero-rank-icon) immediately before the
     rank/tag text (#hero-subline) it illustrates. #hero-rank-chart (Task 15) is the FIRST child
     of .hero, absolutely positioned behind .hero-content — .hero already has position: relative
     to support that without further restructuring; .hero-content itself has position: relative
     and z-index: 1 so the foreground layers on top of the chart. -->
<header class="hero" id="hero">
  <div id="hero-rank-chart" class="hero-rank-chart"></div>
  <div class="hero-content">
    <div class="hero-rank-badge" id="hero-rank-badge">
      <img class="hero-player-icon" id="hero-player-icon" alt="" />
    </div>
    <div class="hero-identity">
      <h1 class="hero-player-name" id="hero-player-name">Velg en spiller</h1>
      <div class="hero-subline-row" id="hero-subline-row">
        <img class="hero-subline-rank-icon" id="hero-rank-icon" alt="" />
        <p class="hero-subline" id="hero-subline"></p>
      </div>
      <p class="hero-contact-hint" id="hero-contact-hint"></p>
      <div class="hero-form-row">
        <span class="hero-form-label"></span>
        <div class="hero-form" id="hero-form"></div>
      </div>
    </div>
    <div class="hero-kpis" id="hero-kpis"></div>
  </div>
</header>

<div class="layout">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="controls">
      <div class="control-group">
        <label for="player-select">Spiller</label>
        <select id="player-select">
          <option value="">Laster spillere...</option>
        </select>
      </div>
      <div class="control-group">
        <label for="min-sample-input">Minimum sett</label>

      </div>

      </div>
      <div class="control-group">

</div>

<!-- ===================== MATCH DETAIL MODAL (Task 14) ===================== -->
<!-- Static modal chrome, placed once as a direct child of <body>, initially hidden via the
     `.modal-overlay`'s base `display: none;` (toggled to `flex` by openMatchDetailModal/
     closeMatchDetailModal in the script below — see the MATCH DETAIL MODAL section). The
     `#match-detail-content` div nested inside `.modal-box` is the SAME div `loadMatchDetail`/
     `renderMatchDetail` have always rendered into — it moved here from its old inline home inside
     `#recent-section`, but its own render logic is otherwise unchanged. -->

<script>

  // =========================================================================================
  // === CONFIG ===
  // === Publishable key only (RLS/grants govern access, SELECT-only). Safe to commit.
  // =========================================================================================

  const SUPABASE_URL = "https://pojzifcfobmsnsvrnvob.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3WuJOVb5GuP4h6fCBGBV-Q_HjOjfH54";

  // Named `sb`, never `supabase` at top level — the UMD bundle above occupies the global
  // `window.supabase`, so shadowing that name with a top-level `const supabase = ...` would break it.
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // =========================================================================================
  // === LABELS ===
  // === Every user-facing string on this page, in Norwegian, in one flat object — per the
  // === rankedstats-redesign plan's RESOLVED "UI language" decision (Norwegian, matching the
  // === mockup's own confirmed labels and the public docs/ wiki's language). Change wording here,
  // === not inline, so a future language change is a one-object edit. Internal code (variable/
  // === function names, CSS classes/ids, comments) stays English — only strings actually rendered
  // === to the user live here. Some genuinely static HTML (plain <label> text, <h2> titles, the
  // === initial hero placeholder) is hardcoded as Norwegian directly in the markup below instead
  // === of referencing this object, because no JS render pass ever (re)writes that exact text at
  // === runtime — see the notepad entry for this task for the full list of which strings that
  // === applies to. Future tasks (8, 10, 13, 15) should add their own new keys to THIS object
  // === rather than hardcoding more strings — reserved terms already confirmed by the mockup but
  // === not yet needed by any landed code ("Nullstill", "TYNT", "Periode", "Vis alle brawlere",
  // === "rader skjult", "rader over grensen") are intentionally omitted until the task that needs
  // === them lands. Task 14 has already landed and added its own "recent matches / modal" keys
  // === below (including "Klikk for settdetaljer", no longer reserved/unused).
  // =========================================================================================

  const LABELS = {
    // --- status messages (setStatus() calls shared by the map/brawler/teammate/recent panels
    // --- and the match-detail modal) ---
    loading: "Laster...",
    errorPrefix: "Feil: ",
    noSetsRecorded: "Ingen rangerte sett registrert ennå.",
    selectPlayerToViewStats: "Velg en spiller for å se statistikk.",

    // --- hero ---
    selectPlayer: "Velg en spiller",
    form: "Form",
    setsPlayed: "Sett spilt",
    winrate: "Winrate",
    wins: "Seire",
    losses: "Tap",
    draws: "Uavgjort",

    // --- sidebar ---
    playerLabel: "Spiller",
    minSetsLabel: "Minimum sett",
    loadingPlayers: "Laster spillere...",
    errorLoadingPlayers: "Feil ved lasting av spillere: ",
    noTrackedPlayers: "Ingen sporede spillere funnet ennå.",
    failedToLoadPlayers: "(klarte ikke å laste spillere)",
    noTrackedPlayersOption: "(ingen sporede spillere)",
    choosePlayer: "- Felles leaderboard -",

    // --- section titles ---
    mapSectionTitle: "Map",
    brawlerSectionTitle: "Brawler",
    teammateSectionTitle: "Teammates",
    recentSectionTitle: "Siste sett",

    // --- best/worst map callouts ---
    bestMap: "Beste map",
    worstMap: "Dårligste map",
    setsSuffix: "sett",

    // --- table headers (map/brawler/teammate/recent tables) ---
    tableMode: "Mode",
    tableMap: "Map",
    tableSets: "Sett",
    tableWins: "Seire",
    tableLosses: "Tap",
    tableDraws: "Uavgjort",
    tableWinrate: "Winrate",
    tableBrawler: "Brawler",
    tableTeammate: "Teammate",
    tableTag: "Tag",
    tableSetsTogether: "Sett sammen",
    roster: "Liste",
    tableDate: "Dato",
    tableResult: "Resultat",
    tableTrend: "Trend",
    loadMore: "Last inn flere",

    // --- table rows / badges (Task 10) ---
    thinBadge: "TYNT",
    thinBadgeTooltip: "Lite datagrunnlag",
    rowsOverThreshold: "rader over grensen",

    // --- match-detail modal ---
    loadingMatchDetail: "Laster settdetaljer...",
    matchDetailNotFound: "Fant ikke settdetaljer.",
    started: "Startet: ",
    ended: "Avsluttet: ",
    gamesPlayed: "Runder spilt: ",
    team0Wins: "Lag 0 seire: ",
    team1Wins: "Lag 1 seire: ",
    winningTeam: "Vinnende lag: ",
    drawUnresolved: "— (uavgjort / uavklart)",
    teamPrefix: "Lag ",
    complete: "Fullført: ",
    yes: "ja",
    no: "nei",
    gamesHeading: "Runder",
    tablePlayer: "Spiller",
    tableBrawlerCol: "Brawler",
    tablePower: "Styrke",
    tableRank: "Rank",
    tableGameNumber: "#",
    tableBattleTime: "Kamptidspunkt",
    tableDuration: "Varighet (s)",
    tableWinningTeam: "Vinnende lag",
    tableStarPlayer: "Star player",
    draw: "uavgjort",

    // --- filters (mode/period chips, min-sets slider, active-filter bar) ---
    allModes: "Alle modes",
    modeGroupTitle: "Mode",
    periodGroupTitle: "Periode",
    allTime: "All time",
    last30Days: "Siste 30 dager",
    last7Days: "Siste 7 dager",
    thisSeason: "Denne sesongen",

    // --- hero rank delta (Task 15) — period-relative suffix appended after the +/- number, so
    // --- the delta reads e.g. "+263 elo denne sesongen" instead of a bare "+263" ---
    heroDeltaUnitElo: "elo",
    heroDeltaPeriodAllTime: "totalt",
    heroDeltaPeriodSeason: "denne sesongen",
    heroDeltaPeriodLast30: "siste 30 dager",
    heroDeltaPeriodLast7: "siste 7 dager",
    rowsHiddenSuffix: "rader skjult",
    activeFilterLabel: "Aktivt filter",
    clear: "Nullstill",

    // --- sidebar brawler class filter tree (Task 13) ---
    // --- LABELS.clear (above) is reused for the tree's own "✕ Nullstill" clear link, not
    // --- duplicated under a new key. ---
    brawlerTreeTitle: "Brawler",

    // --- sidebar rank-tier filter tree (Pro/Masters/Legendary/Mythic/Diamond only) ---
    rankTreeTitle: "Rank",

    // --- recent matches / modal (Task 14) ---
    clickForDetails: "Klikk for settdetaljer",
    draftLabel: "Draft",
    closeModal: "Lukk",
    resultWin: "Seier",
    resultLoss: "Tap",
    resultDraw: "Uavgjort",

    // --- leaderboard (no player selected) ---
    leaderboardSectionTitle: "Ledertavle",
    leaderboardRankColumn: "#",
    leaderboardPrevPage: "‹ Forrige",
    leaderboardNextPage: "Neste ›",
    leaderboardPageLabel: "Side",
    leaderboardPageOfLabel: "av",
    leaderboardExcludedSuffix: "spillere ekskludert (under minimum sett)",
    leaderboardHeroTitle: "Brawl Stars Norge ranked leaderboard",
    leaderboardHeroSubtitle: "Velg eller klikk på en spiller for å se spillerenes individuelle statistikk.",
    leaderboardHeroContactHint: "Ta kontakt med @Zimma2832 på Discord om du vil bli lagt til",
    leaderboardLogoAlt: "Brawl Stars Norge",

    // --- combined recent matches (no player selected) — pagination reuses the leaderboard's
    // --- own Prev/Next/Page/of labels above rather than duplicating them under new keys ---
    combinedRecentSectionTitle: "Siste kamper (alle spillere)",
  };

  // =========================================================================================
  // === DATA LAYER ===
  // === Single fetch per player selection: `loadPlayerData` issues exactly 3 PostgREST requests,
  // === one per row-level view added in 007_redesign_views.sql, and stores the raw, unaggregated
  // === rows in STATE. Every filter change (mode/period/min-sets/brawler/class) is handled
  // === entirely client-side by `applyFilters` + `aggregate`, then re-rendered by `renderAll` —
  // === no further network requests are ever issued after the initial 3.
  // =========================================================================================

  let STATE = {
    tag: null,
    setRows: [],
    mateRows: [],
    rankHistory: [],
    // Live, periodic (~30 min) snapshots of the player's Ranked season/rank/elo, straight
    // from the player-profile API endpoint — a continuous elo number, unlike rankHistory's
    // coarse 1-22 tier value derived per completed set. Preferred over rankHistory for the
    // hero badge/chart whenever at least 1 (badge) or 2 (chart) rows exist; renderHero/
    // renderEloChart fall back to rankHistory/renderRankChart otherwise (e.g. a player with
    // no snapshots yet).
    rankSnapshots: [],
    filter: { kind: null, value: null },
    // Independent of `filter` (brawler/class) — a single tier_name ("Pro"/"Masters"/"Legendary"/
    // "Mythic"/"Diamond") or null for no rank filter. Kept separate rather than folded into
    // `filter.kind` because the two are meant to combine (e.g. a brawler AND a rank at once),
    // not act as mutually-exclusive alternatives the way "brawler" vs "class" do.
    rankFilter: null,
    mode: "All modes",
    period: "This season",
    minSets: 3,
    collapsed: {},
    // Keyed by class name (a BRAWLER_CLASS_ORDER entry). `true` means that class's row in the
    // sidebar tree is currently expanded (child brawler rows visible); `false` or absent (the
    // default) means collapsed. Never read/written by applyFilters/aggregate — only by
    // renderBrawlerTree() in the SIDEBAR FILTERS section below.
    expandedClasses: {},

    // --- leaderboard (no player selected) --- bulk fetch across every tracked player, loaded
    // once at init; rosterByTag maps tag -> display name for the leaderboard's aggregate()
    // labelFn; rosterIconByTag maps tag -> profile icon id (null if unknown), read by
    // buildRowIconCell via profileIconUrl(); leaderboardPage is 1-indexed;
    // leaderboardFilterSignature/leaderboardExcludedCount are internal bookkeeping for
    // renderLeaderboard()/updateMinSetsHint().
    allSetRows: [],
    rosterByTag: new Map(),
    rosterIconByTag: new Map(),
    leaderboardPage: 1,
    leaderboardFilterSignature: null,
    leaderboardExcludedCount: 0,
    leaderboardLoadError: null,
    // column: one of "label"/"sets"/"wins"/"losses"/"draws"/"winrate", or null for the default
    // ranking (winrate desc, sets desc tiebreak) computeLeaderboardRows() already applies.
    leaderboardSort: { column: null, direction: null },

    // --- combined recent matches (no player selected) --- same STATE.allSetRows bulk fetch as
    // the leaderboard table, just flattened to individual sets instead of grouped per player;
    // combinedRecentPage is 1-indexed, combinedRecentFilterSignature is the same
    // "reset page to 1 when filters change" bookkeeping pattern as leaderboardFilterSignature.
    combinedRecentPage: 1,
    combinedRecentFilterSignature: null,
  };

  // === "This season" period cutoff — the current season is whichever ranked_season_id is the
  // === highest ever observed across the whole roster's SETS (STATE.allSetRows, from
  // === v_player_set_rows.ranked_season_id — stamped by ingest.py on every set going forward,
  // === backfilled for older ones by migrations/010_ranked_season_id.sql), and its start is the
  // === earliest started_at any tracked player has a set for in that season. This is
  // === necessarily a global (not per-player) boundary: a player who hasn't queued Ranked yet
  // === this season has no set row for it at all, so their own data alone can't date the
  // === season's start.
  // ===
  // === Deliberately NOT derived from player_rank_snapshots.fetched_at (the earlier approach):
  // === that table only records whatever season is CURRENT at each ~30-min poll, so its
  // === earliest row for the current season is just "whenever ingestion happened to first poll
  // === during it" — for a season that had already been running a while before snapshot
  // === collection started, that date is long after the season's real start, which under-counts
  // === "This season" results (a season underway when polling began looked like it had just
  // === started). ranked_season_id on the sets themselves has no such lag.
  // ===
  // === Returns null when no set has a season id yet (chip then behaves like "All time"). ===
  function currentSeasonStartDate() {
    let currentSeasonId = null;
    STATE.allSetRows.forEach(function (row) {
      if (row.ranked_season_id !== null && row.ranked_season_id !== undefined) {
        if (currentSeasonId === null || row.ranked_season_id > currentSeasonId) {
          currentSeasonId = row.ranked_season_id;
        }
      }
    });

    if (currentSeasonId === null) {
      return null;
    }

    let seasonStart = null;
    STATE.allSetRows.forEach(function (row) {
      if (row.ranked_season_id !== currentSeasonId) {
        return;
      }
      const startedAt = new Date(row.started_at);
      if (seasonStart === null || startedAt < seasonStart) {
        seasonStart = startedAt;
      }
    });

    return seasonStart;
  }

  // === Shared by applyFilters/filterRankHistoryByPeriod/filterRankSnapshotsByPeriod/
  // === filterByModeAndPeriod below — resolves STATE.period to a cutoff Date (rows older than
  // === this are dropped), or null for "All time"/an as-yet-undated "This season". ===
  function periodCutoffDate() {
    if (STATE.period === "All time") {
      return null;
    }
    if (STATE.period === "This season") {
      return currentSeasonStartDate();
    }
    const daysBack = STATE.period === "Last 7 days" ? 7 : 30;
    return new Date(Date.now() - daysBack * 24 * 60 * 60 * 1000);
  }

  async function loadPlayerData(tag) {
    const mapContainer = document.getElementById("map-content");
    const brawlerContainer = document.getElementById("brawler-content");
    const teammateContainer = document.getElementById("teammate-content");
    const recentContainer = document.getElementById("recent-content");
    const allContainers = [
      mapContainer,
      brawlerContainer,
      teammateContainer,
      recentContainer,
    ];

    renderSkeletonTable(
      mapContainer,
      [LABELS.tableMap, LABELS.tableSets, LABELS.tableWins, LABELS.tableLosses, LABELS.tableDraws, LABELS.tableTrend, LABELS.tableWinrate],
      0,
      6
    );
    renderSkeletonTable(
      brawlerContainer,
      [LABELS.tableBrawler, LABELS.tableSets, LABELS.tableWins, LABELS.tableLosses, LABELS.tableDraws, LABELS.tableTrend, LABELS.tableWinrate],
      0,
      6
    );
    renderSkeletonTable(
      teammateContainer,
      [LABELS.tableTeammate, LABELS.tableTag, LABELS.tableSetsTogether, LABELS.tableWins, LABELS.tableTrend, LABELS.tableWinrate],
      0,
      6
    );
    renderSkeletonRecentList(recentContainer, 6, false);
    clearElement(document.getElementById("match-detail-content"));

    const [setRowsResult, mateRowsResult, rankHistoryResult, rankSnapshotsResult] =
      await Promise.all([
        sb.from("v_player_set_rows").select("*").eq("player_tag", tag),
        sb.from("v_player_teammate_rows").select("*").eq("player_tag", tag),
        sb.from("v_player_rank_history").select("*").eq("player_tag", tag),
        sb.from("v_player_rank_snapshots").select("*").eq("player_tag", tag),
      ]);

    const firstError =
      setRowsResult.error ||
      mateRowsResult.error ||
      rankHistoryResult.error ||
      rankSnapshotsResult.error;
    if (firstError) {
      allContainers.forEach(function (container) {
        setStatus(container, "error", LABELS.errorPrefix + firstError.message);
      });
      return;
    }

    const setRows = setRowsResult.data || [];
    const mateRows = mateRowsResult.data || [];
    const rankHistory = rankHistoryResult.data || [];
    const rankSnapshots = rankSnapshotsResult.data || [];

    if (
      setRows.length === 0 &&
      mateRows.length === 0 &&
      rankHistory.length === 0 &&
      rankSnapshots.length === 0
    ) {
      allContainers.forEach(function (container) {
        setStatus(container, "empty", LABELS.noSetsRecorded);
      });
      return;
    }

    STATE.tag = tag;
    STATE.setRows = setRows;
    STATE.mateRows = mateRows;
    STATE.rankHistory = rankHistory;
    STATE.rankSnapshots = rankSnapshots;

    renderAll();
  }

  function applyFilters(rows) {
    let filteredRows = rows;

    const cutoffDate = periodCutoffDate();
    if (cutoffDate !== null) {
      filteredRows = filteredRows.filter(function (row) {
        return new Date(row.ended_at) >= cutoffDate;
      });
    }

    if (STATE.mode !== "All modes") {
      filteredRows = filteredRows.filter(function (row) {
        return row.mode === STATE.mode;
      });
    }

    if (STATE.filter.kind === "brawler") {
      filteredRows = filteredRows.filter(function (row) {
        return row.brawler_id === STATE.filter.value;
      });
    } else if (STATE.filter.kind === "class") {
      filteredRows = filteredRows.filter(function (row) {
        const brawlerClass = BRAWLER_CLASSES[row.brawler_id] || "Unclassified";
        return brawlerClass === STATE.filter.value;
      });
    }

    if (STATE.rankFilter !== null) {
      filteredRows = filteredRows.filter(function (row) {
        return row.tier_name === STATE.rankFilter;
      });
    }

    return filteredRows;
  }

  function aggregate(rows, keyFn, labelFn) {
    const groupsByKey = new Map();

    rows.forEach(function (row) {
      const key = keyFn(row);
      if (!groupsByKey.has(key)) {
        groupsByKey.set(key, []);
      }
      groupsByKey.get(key).push(row);
    });

    const aggregatedRows = [];

    groupsByKey.forEach(function (groupRows, key) {
      const sortedGroupRows = groupRows.slice().sort(function (rowA, rowB) {
        return new Date(rowA.ended_at) - new Date(rowB.ended_at);
      });

      let wins = 0;
      let losses = 0;
      let draws = 0;
      sortedGroupRows.forEach(function (row) {
        if (row.result === "win") {
          wins++;
        } else if (row.result === "loss") {
          losses++;
        } else if (row.result === "draw") {
          draws++;
        }
      });

      const winrate = wins + losses === 0 ? null : wins / (wins + losses);

      aggregatedRows.push({
        key: key,
        label: labelFn(sortedGroupRows[0]),
        sub: undefined,
        sets: sortedGroupRows.length,
        wins: wins,
        losses: losses,
        draws: draws,
        winrate: winrate,
        rows: sortedGroupRows,
      });
    });

    return aggregatedRows;
  }

  // === Leaderboard aggregation (no player selected) — reuses applyFilters/aggregate completely
  // === unmodified, grouping by player_tag instead of map/brawler/teammate. Groups below
  // === STATE.minSets are excluded from the ranked list entirely (not just badge-flagged), same
  // === "excluded from consideration" instinct as renderCallouts' best/worst-map gate. ===
  function computeLeaderboardRows() {
    const filteredRows = applyFilters(STATE.allSetRows);
    const playerGroups = aggregate(
      filteredRows,
      function (row) { return row.player_tag; },
      function (row) { return STATE.rosterByTag.get(row.player_tag) || row.player_tag; }
    );

    const qualifyingRows = playerGroups.filter(function (group) {
      return group.sets >= STATE.minSets;
    });
    const excludedCount = playerGroups.length - qualifyingRows.length;

    qualifyingRows.sort(function (rowA, rowB) {
      const winrateA = rowA.winrate === null ? -1 : rowA.winrate;
      const winrateB = rowB.winrate === null ? -1 : rowB.winrate;
      if (winrateB !== winrateA) {
        return winrateB - winrateA;
      }
      return rowB.sets - rowA.sets;
    });

    return { rankedRows: qualifyingRows, excludedCount: excludedCount };
  }

  // =========================================================================================
  // === Field-shaping bridge — Task 10 confirmed the map/brawler/teammate row shapes below are
  // === exactly what `renderMapTable`/`renderBrawlerTable`/`renderTeammateTable` need, so this
  // === mapping from aggregate() output stays (it is not dead code to remove); only the renderers
  // === themselves were rewritten to consume it differently. Task 14 still owns rewriting the
  // === recent-matches renderer and its own bridge block below.
  // =========================================================================================

  // === Resets the hero back to its initial "no player selected" placeholder state. Fixes a
  // === pre-existing bug where deselecting a player left the previous player's KPIs/form/chart
  // === stale on screen (renderAll() was never called on deselect before this dispatch branch). ===
  function renderHeroEmptyState() {
    document.getElementById("hero-player-name").textContent = LABELS.leaderboardHeroTitle;
    document.getElementById("hero-subline").textContent = LABELS.leaderboardHeroSubtitle;
    document.getElementById("hero-contact-hint").textContent = LABELS.leaderboardHeroContactHint;
    document.getElementById("hero-rank-badge").classList.add("hero-rank-badge--bare");
    const playerIcon = document.getElementById("hero-player-icon");
    playerIcon.src = "../images/bsnorge.jpg";
    playerIcon.alt = LABELS.leaderboardLogoAlt;
    const rankIcon = document.getElementById("hero-rank-icon");
    rankIcon.removeAttribute("src");
    rankIcon.alt = "";
    clearElement(document.getElementById("hero-rank-chart"));
    clearElement(document.getElementById("hero-kpis"));
    clearElement(document.getElementById("hero-form"));
  }

  // === Toggles between the leaderboard section (no player selected) and the 4 per-player
  // === sections + callouts. Called from renderAll() on every render. ===
  function setMainSectionsVisible(showLeaderboard) {
    document.getElementById("leaderboard-section").style.display = showLeaderboard ? "" : "none";
    document.getElementById("combined-recent-section").style.display = showLeaderboard ? "" : "none";
    ["map-callouts", "map-section", "brawler-section", "teammate-section", "recent-section"].forEach(
      function (id) {
        document.getElementById(id).style.display = showLeaderboard ? "none" : "";
      }
    );
    if (showLeaderboard) {
      clearElement(document.getElementById("map-callouts"));
    }
  }

  function renderAll() {
    renderBrawlerTree();
    renderRankTree();
    renderModeChips();
    renderPeriodChips();
    renderFilterBar();

    setMainSectionsVisible(STATE.tag === null);
    if (STATE.tag === null) {
      renderHeroEmptyState();
      renderLeaderboard();
      renderCombinedRecent();
      updateMinSetsHint();
      return;
    }

    renderHero(STATE.tag);

    const filteredSetRows = applyFilters(STATE.setRows);
    const filteredMateRows = applyFilters(STATE.mateRows);

    renderKpiCards(filteredSetRows);
    renderFormChips(filteredSetRows);

    // --- Map (aggregate() output shaped to what renderMapTable expects) ---
    const mapContainer = document.getElementById("map-content");
    if (filteredSetRows.length === 0) {
      setStatus(mapContainer, "empty", LABELS.noSetsRecorded);
      renderCallouts([]);
    } else {
      const mapGroups = aggregate(
        filteredSetRows,
        function (row) {
          return row.mode + "||" + row.map;
        },
        function (row) {
          return row.map;
        }
      );
      const mapRows = mapGroups.map(function (group) {
        return {
          mode: group.rows[0].mode,
          map: group.label,
          sets_played: group.sets,
          wins: group.wins,
          losses: group.losses,
          draws: group.draws,
          winrate: group.winrate,
          rows: group.rows,
        };
      });
      mapRows.sort(function (rowA, rowB) {
        return rowB.sets_played - rowA.sets_played;
      });
      renderCallouts(mapRows);
      renderMapTable(mapContainer, mapRows);
      applyMinSampleFilter();
    }

    // --- Brawler (aggregate() output shaped to what renderBrawlerTable expects) ---
    const brawlerContainer = document.getElementById("brawler-content");
    if (filteredSetRows.length === 0) {
      setStatus(brawlerContainer, "empty", LABELS.noSetsRecorded);
    } else {
      const brawlerGroups = aggregate(
        filteredSetRows,
        function (row) {
          return row.brawler_id;
        },
        function (row) {
          return row.brawler_name || String(row.brawler_id);
        }
      );
      const brawlerRows = brawlerGroups.map(function (group) {
        return {
          brawler_id: group.key,
          brawler_name: group.label,
          sets_played: group.sets,
          wins: group.wins,
          losses: group.losses,
          draws: group.draws,
          winrate: group.winrate,
          rows: group.rows,
        };
      });
      brawlerRows.sort(function (rowA, rowB) {
        return rowB.sets_played - rowA.sets_played;
      });
      renderBrawlerTable(brawlerContainer, brawlerRows);
      applyMinSampleFilter();
    }

    // --- Teammates (aggregate() output shaped to what renderTeammateTable expects, note the
    // --- `sets_together` field name is preserved exactly since renderTeammateTable reads it,
    // --- unlike every other section which uses `sets_played`) ---
    const teammateContainer = document.getElementById("teammate-content");
    if (filteredMateRows.length === 0) {
      setStatus(teammateContainer, "empty", LABELS.noSetsRecorded);
    } else {
      const teammateGroups = aggregate(
        filteredMateRows,
        function (row) {
          return row.teammate_tag;
        },
        function (row) {
          return row.teammate_name || row.teammate_tag;
        }
      );
      const teammateRows = teammateGroups.map(function (group) {
        return {
          teammate_tag: group.key,
          teammate_name: group.label,
          teammate_is_tracked: group.rows[0].teammate_is_tracked,
          sets_together: group.sets,
          wins: group.wins,
          winrate: group.winrate,
          rows: group.rows,
        };
      });
      teammateRows.sort(function (rowA, rowB) {
        return rowB.sets_together - rowA.sets_together;
      });
      renderTeammateTable(teammateContainer, teammateRows);
      applyMinSampleFilter();
    }

    // applyMinSampleFilter() (called up to 3x above) always finishes updating every table's
    // .filtered-out classes by this point regardless of which branches ran, so it is simplest and
    // safest to refresh all 3 panels' right-side counts here in one place rather than duplicating
    // this call inside each of the 3 branches above — countFilteredOutRows() returns 0 for a
    // table that doesn't exist yet (e.g. an empty-state branch ran instead), so a panel showing no
    // rows always reports "0 rader over grensen", never a stale count from a previous player.
    updatePanelRightText("map-panel", countFilteredOutRows("map-table"));
    updatePanelRightText("brawler-panel", countFilteredOutRows("brawler-table"));
    updatePanelRightText("teammate-panel", countFilteredOutRows("teammate-table"));

    // --- Recent (the raw set-row view already has every field renderRecentTable reads, so
    // --- filteredSetRows is passed through with no field mapping) ---
    const recentContainer = document.getElementById("recent-content");
    if (filteredSetRows.length === 0) {
      setStatus(recentContainer, "empty", LABELS.noSetsRecorded);
    } else {
      const recentRows = filteredSetRows
        .slice()
        .sort(function (rowA, rowB) {
          return new Date(rowB.ended_at) - new Date(rowA.ended_at);
        })
        .slice(0, 10);
      renderRecentTable(recentContainer, recentRows);
    }

    updateMinSetsHint();
  }

  // =========================================================================================
  // === HERO ===
  // === Reads STATE.rankSnapshots/STATE.rankHistory (already fetched by loadPlayerData) and the
  // === currently selected <option> in #player-select — issues no network requests of its own.
  // === Prefers the live rank/elo snapshots (renderEloChart, continuous elo, ~30-min cadence)
  // === over the coarse tier-per-completed-set history (renderRankChart) whenever this player has
  // === at least 1 snapshot; falls back to the history path exactly as before otherwise (e.g. a
  // === player with no snapshots yet). Appends a period-relative delta span to `#hero-subline`
  // === either way — elo delta when snapshots are used, tier-value delta in the fallback.
  // =========================================================================================

  function renderHero(tag) {
    const rankIconEl = document.getElementById("hero-rank-icon");
    const playerIconEl = document.getElementById("hero-player-icon");
    const playerNameEl = document.getElementById("hero-player-name");
    const sublineEl = document.getElementById("hero-subline");

    const playerSelect = document.getElementById("player-select");
    const selectedOption = playerSelect.options[playerSelect.selectedIndex];
    const displayName = (selectedOption && selectedOption.textContent) || tag;
    playerNameEl.textContent = displayName;

    document.getElementById("hero-rank-badge").classList.remove("hero-rank-badge--bare");
    document.getElementById("hero-contact-hint").textContent = "";

    // Same "try the CDN icon, fall back to the local placeholder on error" pattern as
    // buildRowIconCell's icon param (used for the leaderboard/teammate table row icons).
    const playerIconUrl = profileIconUrl(STATE.rosterIconByTag.get(tag));
    playerIconEl.src = playerIconUrl || PLAYER_ICON_FALLBACK_URL;
    playerIconEl.alt = displayName;
    let triedPlayerIconFallback = false;
    playerIconEl.onerror = function () {
      if (playerIconUrl && !triedPlayerIconFallback) {
        triedPlayerIconFallback = true;
        playerIconEl.src = PLAYER_ICON_FALLBACK_URL;
        return;
      }
      playerIconEl.onerror = null;
      playerIconEl.removeAttribute("src");
      playerIconEl.alt = "";
    };

    // Shared by both paths below — latestRow only needs rank_label/tier_name, which
    // v_player_rank_snapshots and v_player_rank_history both expose identically (same rank_tiers
    // join), so one badge renderer covers both.
    function applyRankBadge(latestRow, deltaText) {
      clearElement(sublineEl);
      sublineEl.appendChild(
        document.createTextNode((latestRow.rank_label || "—") + " · " + tag)
      );
      if (deltaText !== null) {
        const deltaEl = document.createElement("span");
        deltaEl.className = "hero-rank-delta";
        deltaEl.textContent = " " + deltaText;
        sublineEl.appendChild(deltaEl);
      }
      const iconUrl = tierIconUrl(latestRow.tier_name);
      if (iconUrl) {
        rankIconEl.src = iconUrl;
        rankIconEl.alt = latestRow.tier_name;
      } else {
        rankIconEl.removeAttribute("src");
        rankIconEl.alt = "";
      }
    }

    function formatDelta(delta) {
      return delta > 0 ? "+" + delta : delta < 0 ? String(delta) : "±0";
    }

    // Which period the delta was computed over — mirrors periodCutoffDate's own STATE.period
    // branching, so the suffix always names the window actually used as the delta baseline.
    function heroDeltaPeriodSuffix() {
      if (STATE.period === "This season") {
        return LABELS.heroDeltaPeriodSeason;
      }
      if (STATE.period === "Last 30 days") {
        return LABELS.heroDeltaPeriodLast30;
      }
      if (STATE.period === "Last 7 days") {
        return LABELS.heroDeltaPeriodLast7;
      }
      return LABELS.heroDeltaPeriodAllTime;
    }

    const sortedRankSnapshots = STATE.rankSnapshots.slice().sort(function (rowA, rowB) {
      return new Date(rowA.fetched_at) - new Date(rowB.fetched_at);
    });

    if (sortedRankSnapshots.length > 0) {
      renderEloChart(sortedRankSnapshots);

      const latestSnapshot = sortedRankSnapshots[sortedRankSnapshots.length - 1];

      // Delta baseline: the earliest snapshot within the CURRENT period window only (never
      // mode-filtered — snapshot rows have no `mode` field, same reasoning as
      // filterRankHistoryByPeriod below).
      const periodRankSnapshots = filterRankSnapshotsByPeriod(STATE.rankSnapshots);
      const sortedPeriodRankSnapshots = periodRankSnapshots.slice().sort(function (rowA, rowB) {
        return new Date(rowA.fetched_at) - new Date(rowB.fetched_at);
      });
      const baselineSnapshot =
        sortedPeriodRankSnapshots.length > 0 ? sortedPeriodRankSnapshots[0] : null;

      let deltaText = null;
      if (
        baselineSnapshot &&
        latestSnapshot.ranked_elo !== null &&
        baselineSnapshot.ranked_elo !== null
      ) {
        deltaText =
          formatDelta(latestSnapshot.ranked_elo - baselineSnapshot.ranked_elo) +
          " " +
          LABELS.heroDeltaUnitElo +
          " " +
          heroDeltaPeriodSuffix();
      }

      applyRankBadge(latestSnapshot, deltaText);
      return;
    }

    // --- fallback: no rank snapshots exist yet for this player (pre-deployment history, or
    // --- profile fetches have been failing) — today's exact tier-history behavior ---
    renderRankChart(STATE.rankHistory);

    const sortedRankHistory = STATE.rankHistory.slice().sort(function (rowA, rowB) {
      return new Date(rowA.ended_at) - new Date(rowB.ended_at);
    });
    const latestRank =
      sortedRankHistory.length > 0 ? sortedRankHistory[sortedRankHistory.length - 1] : null;

    if (!latestRank) {
      sublineEl.textContent = "— · " + tag;
      rankIconEl.removeAttribute("src");
      return;
    }

    // Rank-delta baseline: the earliest rank-history row within the CURRENT period window only
    // (never mode-filtered — rank-history rows have no `mode` field, so `filterByModeAndPeriod`/
    // `applyFilters` cannot be reused here; see `filterRankHistoryByPeriod` below).
    const periodRankHistory = filterRankHistoryByPeriod(STATE.rankHistory);
    const sortedPeriodRankHistory = periodRankHistory.slice().sort(function (rowA, rowB) {
      return new Date(rowA.ended_at) - new Date(rowB.ended_at);
    });
    const baselineRank = sortedPeriodRankHistory.length > 0 ? sortedPeriodRankHistory[0] : null;

    const deltaText = baselineRank
      ? formatDelta(latestRank.rank_value - baselineRank.rank_value) + " " + heroDeltaPeriodSuffix()
      : null;
    applyRankBadge(latestRank, deltaText);
  }

  // === Period-only filter for rank-history rows (Task 15) — byte-for-byte the same cutoff-date
  // === math as `applyFilters`/`filterByModeAndPeriod`'s own period block, but deliberately
  // === self-contained: `v_player_rank_history` rows have no `mode` column, so reusing either of
  // === those 2 functions directly would either silently do nothing extra (harmless but
  // === misleading) or, worse, incorrectly zero out every row the moment a mode filter is active
  // === (since `row.mode === STATE.mode` would never match an undefined `row.mode`). ===
  function filterRankHistoryByPeriod(rows) {
    const cutoffDate = periodCutoffDate();
    if (cutoffDate === null) {
      return rows;
    }
    return rows.filter(function (row) {
      return new Date(row.ended_at) >= cutoffDate;
    });
  }

  // === Same period-only cutoff-date filter as filterRankHistoryByPeriod above, over
  // === v_player_rank_snapshots rows instead (fetched_at, not ended_at). ===
  function filterRankSnapshotsByPeriod(rows) {
    const cutoffDate = periodCutoffDate();
    if (cutoffDate === null) {
      return rows;
    }
    return rows.filter(function (row) {
      return new Date(row.fetched_at) >= cutoffDate;
    });
  }

  // =========================================================================================
  // === RANK-TIER CHART (Task 15) — FALLBACK ===
  // === `renderRankChart(history)` draws a translucent rank-tier line chart into
  // === #hero-rank-chart, absolutely positioned behind .hero-content by CSS. Y-axis labels are
  // === drawn only from tier_values/rank_labels actually observed in this player's own
  // === `history` — never a fabricated 1-22 full-range label, and never an "Elo"/points value.
  // === Built entirely with createElementNS — no raw markup injection anywhere.
  // === renderHero() only calls this when the player has no rank snapshots yet (see
  // === renderEloChart below, the preferred source once snapshots exist).
  // =========================================================================================

  const SVG_NS = "http://www.w3.org/2000/svg";

  function renderRankChart(history) {
    const container = document.getElementById("hero-rank-chart");
    clearElement(container);

    const sortedHistory = history.slice().sort(function (rowA, rowB) {
      return new Date(rowA.ended_at) - new Date(rowB.ended_at);
    });

    // A single point (or no points at all) cannot draw a meaningful line — render nothing rather
    // than a misleading flat/empty chart, and never throw.
    if (sortedHistory.length < 2) {
      return;
    }

    const viewBoxWidth = 640;
    const viewBoxHeight = 170;

    let minRank = sortedHistory[0].rank_value;
    let maxRank = sortedHistory[0].rank_value;
    sortedHistory.forEach(function (row) {
      if (row.rank_value < minRank) {
        minRank = row.rank_value;
      }
      if (row.rank_value > maxRank) {
        maxRank = row.rank_value;
      }
    });
    // A perfectly flat history (every row the same tier) would otherwise divide by zero below —
    // widen the observed range by 1 tier on each side just for the y-axis math, not for the
    // labels (labels are still matched against the real, unwidened rank_value of each row).
    const rankRange = maxRank === minRank ? 1 : maxRank - minRank;
    const rankRangeMin = maxRank === minRank ? minRank - 0.5 : minRank;

    function rankValueToY(rankValue) {
      return viewBoxHeight - ((rankValue - rankRangeMin) / rankRange) * viewBoxHeight;
    }

    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + viewBoxWidth + " " + viewBoxHeight);

    // --- 4 evenly-spaced gridlines, each labelled with the closest real observation's tier label
    // --- (within 2 tier-values) or, failing that, the plain rounded numeric value. ---
    const gridlineCount = 4;
    for (let gridlineIndex = 0; gridlineIndex < gridlineCount; gridlineIndex++) {
      const gridRankValue = minRank + (rankRange * gridlineIndex) / (gridlineCount - 1);
      const gridY = rankValueToY(gridRankValue);

      const gridline = document.createElementNS(SVG_NS, "line");
      gridline.setAttribute("x1", "0");
      gridline.setAttribute("y1", String(gridY));
      gridline.setAttribute("x2", String(viewBoxWidth));
      gridline.setAttribute("y2", String(gridY));
      gridline.style.stroke = "var(--divider)";
      gridline.setAttribute("stroke-width", "1");
      svg.appendChild(gridline);

      let closestRow = sortedHistory[0];
      let closestDistance = Math.abs(closestRow.rank_value - gridRankValue);
      sortedHistory.forEach(function (row) {
        const distance = Math.abs(row.rank_value - gridRankValue);
        if (distance < closestDistance) {
          closestRow = row;
          closestDistance = distance;
        }
      });
      const gridLabelText =
        closestDistance <= 2 && closestRow.rank_label
          ? closestRow.rank_label
          : String(Math.round(gridRankValue));

      const gridLabel = document.createElementNS(SVG_NS, "text");
      gridLabel.setAttribute("x", "4");
      gridLabel.setAttribute("y", String(gridY - 4));
      gridLabel.setAttribute("font-size", "10");
      gridLabel.style.fill = "var(--text-muted-2)";
      gridLabel.textContent = gridLabelText;
      svg.appendChild(gridLabel);
    }

    // --- gold area fill + line + terminal point, one point per history row, evenly spaced by
    // --- index order across the viewBox's width. ---
    const xStep = viewBoxWidth / (sortedHistory.length - 1);
    const linePoints = sortedHistory.map(function (row, index) {
      return index * xStep + "," + rankValueToY(row.rank_value);
    });

    const area = document.createElementNS(SVG_NS, "polygon");
    area.setAttribute(
      "points",
      "0," + viewBoxHeight + " " + linePoints.join(" ") + " " + viewBoxWidth + "," + viewBoxHeight
    );
    area.style.fill = "rgba(255,210,61,.13)";
    svg.appendChild(area);

    const line = document.createElementNS(SVG_NS, "polyline");
    line.setAttribute("points", linePoints.join(" "));
    line.setAttribute("fill", "none");
    line.style.stroke = "var(--accent-gold)";
    line.setAttribute("stroke-width", "2.4");
    line.setAttribute("stroke-linejoin", "round");
    svg.appendChild(line);

    const lastRow = sortedHistory[sortedHistory.length - 1];
    const terminalPoint = document.createElementNS(SVG_NS, "circle");
    terminalPoint.setAttribute("cx", String((sortedHistory.length - 1) * xStep));
    terminalPoint.setAttribute("cy", String(rankValueToY(lastRow.rank_value)));
    terminalPoint.setAttribute("r", "4");
    terminalPoint.style.fill = "var(--accent-gold)";
    svg.appendChild(terminalPoint);

    container.appendChild(svg);
  }

  // =========================================================================================
  // === ELO CHART (preferred over the rank-tier chart above once a player has snapshots) ===
  // === `renderEloChart(snapshots)` is renderRankChart's twin, plotting continuous `ranked_elo`
  // === over `fetched_at` instead of the coarse 1-22 `rank_value` over `ended_at` — elo has no
  // === lookup table, so gridlines are always the plain rounded elo number, never a tier label.
  // === Same viewBox/visual language (gold line+area+terminal point) so it reads as the same
  // === component, not a new design. `snapshots` is assumed already sorted by fetched_at
  // === ascending (renderHero sorts once and reuses that order for both the chart and the badge).
  // =========================================================================================

  function renderEloChart(snapshots) {
    const container = document.getElementById("hero-rank-chart");
    clearElement(container);

    // A single point (or no points at all) cannot draw a meaningful line — render nothing rather
    // than a misleading flat/empty chart, and never throw.
    if (snapshots.length < 2) {
      return;
    }

    const viewBoxWidth = 640;
    const viewBoxHeight = 170;

    let minElo = snapshots[0].ranked_elo;
    let maxElo = snapshots[0].ranked_elo;
    snapshots.forEach(function (row) {
      if (row.ranked_elo < minElo) {
        minElo = row.ranked_elo;
      }
      if (row.ranked_elo > maxElo) {
        maxElo = row.ranked_elo;
      }
    });
    // A perfectly flat history (elo unchanged across every snapshot) would otherwise divide by
    // zero below — widen the observed range for the y-axis math only, same trick as
    // renderRankChart's rankRange/rankRangeMin.
    const eloRange = maxElo === minElo ? 1 : maxElo - minElo;
    const eloRangeMin = maxElo === minElo ? minElo - 0.5 : minElo;

    function eloValueToY(eloValue) {
      return viewBoxHeight - ((eloValue - eloRangeMin) / eloRange) * viewBoxHeight;
    }

    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + viewBoxWidth + " " + viewBoxHeight);

    // --- 4 evenly-spaced gridlines, each labelled with the plain rounded elo value at that
    // --- height — no label-snapping to a nearby observation, unlike the tier chart, since elo
    // --- is continuous and any rounded number on the axis is already meaningful. ---
    const gridlineCount = 4;
    for (let gridlineIndex = 0; gridlineIndex < gridlineCount; gridlineIndex++) {
      const gridEloValue = minElo + (eloRange * gridlineIndex) / (gridlineCount - 1);
      const gridY = eloValueToY(gridEloValue);

      const gridline = document.createElementNS(SVG_NS, "line");
      gridline.setAttribute("x1", "0");
      gridline.setAttribute("y1", String(gridY));
      gridline.setAttribute("x2", String(viewBoxWidth));
      gridline.setAttribute("y2", String(gridY));
      gridline.style.stroke = "var(--divider)";
      gridline.setAttribute("stroke-width", "1");
      svg.appendChild(gridline);

      const gridLabel = document.createElementNS(SVG_NS, "text");
      gridLabel.setAttribute("x", "4");
      gridLabel.setAttribute("y", String(gridY - 4));
      gridLabel.setAttribute("font-size", "10");
      gridLabel.style.fill = "var(--text-muted-2)";
      gridLabel.textContent = String(Math.round(gridEloValue));
      svg.appendChild(gridLabel);
    }

    // --- gold area fill + line + terminal point, one point per snapshot, evenly spaced by index
    // --- order across the viewBox's width. ---
    const xStep = viewBoxWidth / (snapshots.length - 1);
    const linePoints = snapshots.map(function (row, index) {
      return index * xStep + "," + eloValueToY(row.ranked_elo);
    });

    const area = document.createElementNS(SVG_NS, "polygon");
    area.setAttribute(
      "points",
      "0," + viewBoxHeight + " " + linePoints.join(" ") + " " + viewBoxWidth + "," + viewBoxHeight
    );
    area.style.fill = "rgba(255,210,61,.13)";
    svg.appendChild(area);

    const line = document.createElementNS(SVG_NS, "polyline");
    line.setAttribute("points", linePoints.join(" "));
    line.setAttribute("fill", "none");
    line.style.stroke = "var(--accent-gold)";
    line.setAttribute("stroke-width", "2.4");
    line.setAttribute("stroke-linejoin", "round");
    svg.appendChild(line);

    const lastRow = snapshots[snapshots.length - 1];
    const terminalPoint = document.createElementNS(SVG_NS, "circle");
    terminalPoint.setAttribute("cx", String((snapshots.length - 1) * xStep));
    terminalPoint.setAttribute("cy", String(eloValueToY(lastRow.ranked_elo)));
    terminalPoint.setAttribute("r", "4");
    terminalPoint.style.fill = "var(--accent-gold)";
    svg.appendChild(terminalPoint);

    container.appendChild(svg);
  }

  // =========================================================================================
  // === HERO KPI CARDS + FORM CHIPS ===
  // === `renderKpiCards`/`renderFormChips` both take the same filtered set-rows array
  // === `renderAll()` already computed via `applyFilters(STATE.setRows)` — neither function
  // === re-filters or re-fetches anything. Both render into containers Task 6 wired directly into
  // === `.hero-content` (`#hero-kpis`, `#hero-form`); the old Overall-section summary display
  // === these replace is gone entirely.
  // =========================================================================================

  function winrateTone(winrate) {
    if (winrate === null || winrate === undefined) {
      return null;
    }
    if (winrate >= 0.6) {
      return "var(--win)";
    }
    if (winrate >= 0.45) {
      return "var(--accent-gold)";
    }
    return "var(--loss)";
  }

  function renderKpiCards(rows) {
    const container = document.getElementById("hero-kpis");
    clearElement(container);

    let wins = 0;
    let losses = 0;
    let draws = 0;
    rows.forEach(function (row) {
      if (row.result === "win") {
        wins++;
      } else if (row.result === "loss") {
        losses++;
      } else if (row.result === "draw") {
        draws++;
      }
    });
    const winrate = wins + losses === 0 ? null : wins / (wins + losses);

    const cards = [
      { label: LABELS.setsPlayed, value: String(rows.length), color: null },
      { label: LABELS.winrate, value: formatWinrate(winrate), color: winrateTone(winrate) },
      { label: LABELS.wins, value: String(wins), color: "var(--win)" },
      { label: LABELS.losses, value: String(losses), color: "var(--loss)" },
      { label: LABELS.draws, value: String(draws), color: "var(--draw)" },
    ];

    cards.forEach(function (card) {
      const cardEl = document.createElement("div");
      cardEl.className = "hero-kpi-card";

      const labelEl = document.createElement("div");
      labelEl.className = "hero-kpi-label";
      labelEl.textContent = card.label;

      const valueEl = document.createElement("div");
      valueEl.className = "hero-kpi-value";
      valueEl.textContent = card.value;
      if (card.color) {
        valueEl.style.color = card.color;
      }

      cardEl.appendChild(labelEl);
      cardEl.appendChild(valueEl);
      container.appendChild(cardEl);
    });
  }

  function renderFormChips(rows) {
    const container = document.getElementById("hero-form");
    clearElement(container);

    const sortedRows = rows.slice().sort(function (rowA, rowB) {
      return new Date(rowB.ended_at) - new Date(rowA.ended_at);
    });
    const recentRows = sortedRows.slice(0, 10).reverse();

    recentRows.forEach(function (row) {
      const chip = document.createElement("span");
      chip.className = "hero-form-chip";

      if (row.result === "win") {
        chip.textContent = "W";
        chip.style.background = "var(--win)";
      } else if (row.result === "loss") {
        chip.textContent = "L";
        chip.style.background = "var(--loss)";
      } else {
        chip.textContent = "D";
        chip.style.background = "var(--text-muted-4)";
      }

      container.appendChild(chip);
    });
  }

  // =========================================================================================
  // === DOM HELPERS ===
  // =========================================================================================

  function clearElement(element) {
    while (element.firstChild) {
      element.removeChild(element.firstChild);
    }
  }

  function setStatus(container, statusClass, message) {
    clearElement(container);
    const paragraph = document.createElement("p");
    paragraph.className = "status " + statusClass;
    paragraph.textContent = message;
    container.appendChild(paragraph);
  }

  // =========================================================================================
  // === SKELETON LOADERS ===
  // === Shimmering placeholders shown in place of setStatus(..., "loading", ...) while a
  // === section's data is in flight. Each builder mirrors the exact markup its section's real
  // === renderer produces (buildRowIconCell's icon+text anatomy for the map/brawler/teammate/
  // === leaderboard tables, .recent-row's grid for the recent-matches lists) so nothing reflows
  // === once the real content replaces it — only .skeleton-bar/.skeleton-shimmer fillers stand in
  // === for real text/icons. Purely decorative: none of this reads or writes STATE.
  // =========================================================================================

  // Cycled by a per-cell seed so neighbouring bars don't all render the exact same width —
  // cosmetic variation only, no meaning attached to any particular width.
  const SKELETON_WIDTHS = ["skeleton-w-45", "skeleton-w-60", "skeleton-w-75", "skeleton-w-85"];

  function skeletonWidthClass(seed) {
    return SKELETON_WIDTHS[seed % SKELETON_WIDTHS.length];
  }

  // Same DOM shape as buildRowIconCell's icon column (.table-row-cell > placeholder +
  // .table-row-text), so a skeleton row lines up pixel-for-pixel with the real row that replaces
  // it.
  function buildSkeletonIconCell(seed) {
    const cell = document.createElement("td");
    const wrapper = document.createElement("div");
    wrapper.className = "table-row-cell";

    const iconPlaceholder = document.createElement("div");
    iconPlaceholder.className = "table-icon-placeholder skeleton-shimmer";
    wrapper.appendChild(iconPlaceholder);

    const textStack = document.createElement("div");
    textStack.className = "table-row-text";
    const labelBar = document.createElement("div");
    labelBar.className = "skeleton-bar skeleton-bar--label skeleton-shimmer " + skeletonWidthClass(seed);
    textStack.appendChild(labelBar);
    wrapper.appendChild(textStack);

    cell.appendChild(wrapper);
    return cell;
  }

  function buildSkeletonCell(seed) {
    const cell = document.createElement("td");
    const bar = document.createElement("div");
    bar.className = "skeleton-bar skeleton-shimmer " + skeletonWidthClass(seed);
    cell.appendChild(bar);
    return cell;
  }

  // === Renders a skeleton <table> with the section's REAL header (so headers never "pop in"
  // === once loading finishes) plus `rowCount` shimmering rows. `iconColumnIndex` is the 0-based
  // === column that gets the icon+label treatment; every other column gets a plain bar. Used by
  // === the map/brawler/teammate tables (loadPlayerData) and the leaderboard (loadLeaderboardData).
  function renderSkeletonTable(container, headerLabels, iconColumnIndex, rowCount) {
    clearElement(container);

    const table = document.createElement("table");
    table.className = "skeleton-table";

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");
    headerLabels.forEach(function (label) {
      const th = document.createElement("th");
      th.textContent = label;
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    for (let rowIndex = 0; rowIndex < rowCount; rowIndex++) {
      const tr = document.createElement("tr");
      headerLabels.forEach(function (label, columnIndex) {
        tr.appendChild(
          columnIndex === iconColumnIndex
            ? buildSkeletonIconCell(rowIndex + columnIndex)
            : buildSkeletonCell(rowIndex + columnIndex)
        );
      });
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);

    container.appendChild(table);
  }

  // === Renders `rowCount` shimmering `.recent-row`s — the same grid layout buildRecentRow's real
  // === rows use (`isCombined` adds the extra leading player-identity column) — in place of the
  // === recent-matches list while it loads.
  function renderSkeletonRecentList(container, rowCount, isCombined) {
    clearElement(container);

    const list = document.createElement("div");
    list.className = "recent-list";

    for (let rowIndex = 0; rowIndex < rowCount; rowIndex++) {
      const row = document.createElement("div");
      row.className = isCombined ? "recent-row recent-row--combined" : "recent-row";
      row.style.borderLeftColor = "var(--panel-border)";

      if (isCombined) {
        const playerCell = document.createElement("div");
        playerCell.className = "recent-player-cell";
        const playerIconPlaceholder = document.createElement("div");
        playerIconPlaceholder.className = "recent-player-placeholder skeleton-shimmer";
        playerCell.appendChild(playerIconPlaceholder);
        const playerBar = document.createElement("div");
        playerBar.className = "skeleton-bar skeleton-shimmer " + skeletonWidthClass(rowIndex);
        playerCell.appendChild(playerBar);
        row.appendChild(playerCell);
      }

      const dateBar = document.createElement("div");
      dateBar.className = "skeleton-bar skeleton-shimmer " + skeletonWidthClass(rowIndex + 1);
      row.appendChild(dateBar);

      const mapCell = document.createElement("div");
      mapCell.className = "recent-map-cell";
      const mapIconPlaceholder = document.createElement("div");
      mapIconPlaceholder.className = "recent-map-placeholder skeleton-shimmer";
      mapCell.appendChild(mapIconPlaceholder);
      const mapTextBar = document.createElement("div");
      mapTextBar.className = "skeleton-bar skeleton-shimmer " + skeletonWidthClass(rowIndex + 2);
      mapCell.appendChild(mapTextBar);
      row.appendChild(mapCell);

      const brawlerCell = document.createElement("div");
      brawlerCell.className = "recent-brawler-cell";
      const brawlerIconPlaceholder = document.createElement("div");
      brawlerIconPlaceholder.className = "recent-brawler-placeholder skeleton-shimmer";
      brawlerCell.appendChild(brawlerIconPlaceholder);
      const brawlerTextBar = document.createElement("div");
      brawlerTextBar.className = "skeleton-bar skeleton-shimmer " + skeletonWidthClass(rowIndex + 3);
      brawlerCell.appendChild(brawlerTextBar);
      row.appendChild(brawlerCell);

      const rankCell = document.createElement("div");
      rankCell.className = "recent-rank-cell";
      const rankIconPlaceholder = document.createElement("div");
      rankIconPlaceholder.className = "recent-rank-placeholder skeleton-shimmer";
      rankCell.appendChild(rankIconPlaceholder);
      const rankTextBar = document.createElement("div");
      rankTextBar.className = "skeleton-bar skeleton-shimmer " + skeletonWidthClass(rowIndex + 4);
      rankCell.appendChild(rankTextBar);
      row.appendChild(rankCell);

      const resultCell = document.createElement("div");
      resultCell.className = "recent-result-cell";
      const resultBar = document.createElement("div");
      resultBar.className = "skeleton-bar skeleton-shimmer " + skeletonWidthClass(rowIndex + 5);
      resultCell.appendChild(resultBar);
      row.appendChild(resultCell);

      row.appendChild(document.createElement("div"));

      list.appendChild(row);
    }

    container.appendChild(list);
  }

  // === Generic fallback for sections with no dedicated table/list shape to mirror (currently
  // === just the match-detail modal) — a handful of shimmering lines of varying width.
  function renderSkeletonLines(container, lineCount) {
    clearElement(container);

    const wrapper = document.createElement("div");
    wrapper.className = "skeleton-lines";

    for (let lineIndex = 0; lineIndex < lineCount; lineIndex++) {
      const bar = document.createElement("div");
      bar.className = "skeleton-bar skeleton-bar--label skeleton-shimmer " + skeletonWidthClass(lineIndex);
      bar.style.marginBottom = "10px";
      wrapper.appendChild(bar);
    }

    container.appendChild(wrapper);
  }

  function formatWinrate(winrate) {
    if (winrate === null || winrate === undefined) {
      return "—";
    }
    return (winrate * 100).toFixed(1) + "%";
  }

  function makeCell(text) {
    const cell = document.createElement("td");
    cell.textContent = text;
    return cell;
  }

  // =========================================================================================
  // === MODE / TIER HELPERS ===
  // === Pure, dependency-free display formatters. `prettyMode` degrades gracefully for any
  // === unseen camelCase mode string (new modes ship regularly, so no closed lookup list here).
  // === `tierIconUrl` takes `tier_name` as an already-structured input (never parses
  // === `rank_label`) — that column comes straight from rank_tiers via the views in
  // === 007_redesign_views.sql.
  // =========================================================================================

  function prettyMode(mode) {
    if (!mode) {
      return "";
    }
    const spaced = mode.replace(/([a-z0-9])([A-Z])/g, "$1 $2");
    return spaced.charAt(0).toUpperCase() + spaced.slice(1);
  }

  // =========================================================================================
  // === ICON LOOKUPS (map/brawler tables) ===
  // === `modeIconUrl` maps a raw ranked mode string (e.g. "gemGrab") to its game-mode icon in
  // === images/gamemodes/ — only the 6 ranked-eligible modes have artwork, so anything else falls
  // === back to null (caller keeps the placeholder). `brawlerIconUrl` derives a brawler's portrait
  // === path in images/brawlers/Assets2026-08-25/ from `brawler_name` by lowercasing/hyphenating —
  // === this generalizes to new brawlers automatically, with a small override table for the 3 names
  // === whose punctuation doesn't hyphenate cleanly (and 1 filename that doesn't follow the
  // === `<slug>_portrait.png` convention).
  // =========================================================================================

  // === `profileIconUrl` turns a player's `icon_id` (fetched server-side from the live API's
  // === player-profile endpoint, stored in `players.icon_id`) into an image URL on Brawlify's
  // === public CDN, which mirrors every Supercell profile icon by id — this project never
  // === downloads or bundles the icon images themselves. `PLAYER_ICON_FALLBACK_URL` is shown
  // === instead of the blank swatch whenever the id is unknown or the CDN image fails to load.
  // =========================================================================================

  const PLAYER_ICON_FALLBACK_URL = "../images/rankedstats/fallback.png";

  function profileIconUrl(iconId) {
    return iconId ? "https://cdn.brawlify.com/profile-icons/regular/" + iconId + ".png" : null;
  }

  const MODE_ICON_FILENAMES = {
    bounty: "bounty_icon.png",
    brawlBall: "brawl_ball_icon.png",
    gemGrab: "gem_grab_icon.png",
    heist: "heist_icon.png",
    hotZone: "hot_zone_icon.png",
    knockout: "knock_out_icon.png",
  };

  function modeIconUrl(mode) {
    const filename = MODE_ICON_FILENAMES[mode];
    return filename ? "images/gamemodes/" + filename : null;
  }

  const BRAWLER_ICON_SLUG_OVERRIDES = {
    "R-T": "rt",
    "STARR NOVA": "starr_nova",
    "LARRY & LAWRIE": "larry&lawrie",
  };

  const BRAWLER_ICON_FILENAME_OVERRIDES = {
    SPROUT: "sprout_portrait_new.png",
  };

  function brawlerIconUrl(brawlerName) {
    if (!brawlerName) {
      return null;
    }
    const upperName = brawlerName.toUpperCase();
    const overrideFilename = BRAWLER_ICON_FILENAME_OVERRIDES[upperName];
    if (overrideFilename) {
      return "images/brawlers/Assets2026-08-25/" + overrideFilename;
    }
    const slug =
      BRAWLER_ICON_SLUG_OVERRIDES[upperName] ||
      upperName
        .toLowerCase()
        .replace(/\./g, "")
        .replace(/[^a-z0-9&]+/g, "-")
        .replace(/^-+|-+$/g, "");
    return "images/brawlers/Assets2026-08-25/" + slug + "_portrait.png";
  }

  function tierIconUrl(tier_name) {
    if (!tier_name) {
      return null;
    }
    return "images/ranks/icon_rank_sticker_" + tier_name.toLowerCase() + ".png";
  }

  // =========================================================================================
  // === MAP IMAGES (BrawlAPI) ===
  // === Real map artwork has no local asset bundle (unlike the brawler/mode/rank icons above),
  // === so this fetches it from BrawlAPI's public maps list — the actively maintained
  // === continuation of the Brawlify project already used for profile icons elsewhere on this
  // === page (`cdn.brawlify.com`, same CDN the `imageUrl` field below points at). One request,
  // === cached in the resolved index for the rest of the page's lifetime. Keyed by
  // === "<api game mode name>||<map name>" (both lowercased) since a handful of map NAMES repeat
  // === across different modes (e.g. "Deathcap Trap" exists in both Bounty and Gem Grab) with
  // === different artwork per mode. Where a mode+map has multiple list entries (older, reskinned,
  // === or disabled versions), the newest non-disabled entry (highest id) wins.
  // =========================================================================================

  const MODE_API_NAMES = {
    bounty: "Bounty",
    brawlBall: "Brawl Ball",
    gemGrab: "Gem Grab",
    heist: "Heist",
    hotZone: "Hot Zone",
    knockout: "Knockout",
  };

  let mapImageIndexPromise = null;

  function loadMapImageIndex() {
    if (mapImageIndexPromise) {
      return mapImageIndexPromise;
    }
    mapImageIndexPromise = fetch("https://api.brawlapi.com/v1/maps")
      .then(function (response) {
        return response.json();
      })
      .then(function (data) {
        const index = new Map();
        (data.list || []).forEach(function (mapEntry) {
          const modeName = mapEntry.gameMode && mapEntry.gameMode.name;
          if (!modeName || !mapEntry.name) {
            return;
          }
          const key = modeName.toLowerCase() + "||" + mapEntry.name.toLowerCase();
          const existing = index.get(key);
          const isBetter =
            !existing ||
            (existing.disabled && !mapEntry.disabled) ||
            (existing.disabled === mapEntry.disabled && mapEntry.id > existing.id);
          if (isBetter) {
            index.set(key, mapEntry);
          }
        });
        return index;
      })
      .catch(function () {
        return new Map();
      });
    return mapImageIndexPromise;
  }

  // Sets `targetEl`'s CSS background-image once the real map artwork resolves; leaves whatever
  // background `.rm-map` already has (the neutral placeholder swatch) untouched if the map is
  // unknown or the request fails — same "never show a broken image" instinct as every other icon
  // lookup on this page.
  function setMapVisualImage(targetEl, mode, map) {
    if (!mode || !map) {
      return;
    }
    const apiModeName = MODE_API_NAMES[mode];
    if (!apiModeName) {
      return;
    }
    loadMapImageIndex().then(function (index) {
      const entry = index.get(apiModeName.toLowerCase() + "||" + map.toLowerCase());
      if (entry && entry.imageUrl) {
        targetEl.style.backgroundImage = "url(" + entry.imageUrl + ")";
      }
    });
  }

  // =========================================================================================
  // === COLLAPSIBLE PANEL ===
  // === `makeCollapsiblePanel({id, title, tint, rightText, bodyEl})` builds a reusable
  // === `<section class="panel">` (header + body) that Tasks 10/14 wrap the map/brawler/teammate/
  // === recent sections in. Collapse/expand state lives in `STATE.collapsed[id]` (global STATE
  // === from the DATA LAYER section above) so a later `renderAll()` re-render can call this again
  // === without resetting a panel the user had collapsed. `STATE.collapsed[id] === true` means the
  // === panel is currently collapsed (body hidden); `false` or absent (the default) means expanded.
  // === Toggling is a pure class/attribute flip — `options.bodyEl`'s inner DOM is never touched,
  // === so sort state on `<th data-order>` elsewhere in the app survives a collapse/expand cycle.
  // =========================================================================================

  function makeCollapsiblePanel(options) {
    const panelId = options.id;

    if (STATE.collapsed[panelId] === undefined) {
      STATE.collapsed[panelId] = false;
    }

    const panel = document.createElement("section");
    panel.className = "panel";
    panel.id = panelId;

    const header = document.createElement("div");
    header.className = "panel-header";
    header.setAttribute("role", "button");
    header.setAttribute("tabindex", "0");
    header.style.background = "linear-gradient(100deg, " + options.tint + ", var(--panel) 70%)";

    const chevron = document.createElement("span");
    chevron.className = "panel-chevron";

    const title = document.createElement("div");
    title.className = "panel-title";
    title.textContent = options.title;

    const rightText = document.createElement("span");
    rightText.className = "panel-right-text";
    rightText.textContent = options.rightText;

    header.appendChild(chevron);
    header.appendChild(title);
    header.appendChild(rightText);

    const body = document.createElement("div");
    body.className = "panel-body";
    body.appendChild(options.bodyEl);

    panel.appendChild(header);
    panel.appendChild(body);

    function updatePanelState() {
      const isCollapsed = STATE.collapsed[panelId] === true;
      chevron.textContent = isCollapsed ? "▸" : "▾";
      header.setAttribute("aria-expanded", String(!isCollapsed));
      panel.classList.toggle("panel-collapsed", isCollapsed);
    }

    function togglePanel() {
      STATE.collapsed[panelId] = STATE.collapsed[panelId] === true ? false : true;
      updatePanelState();
    }

    function handleHeaderClick() {
      togglePanel();
    }

    function handleHeaderKeydown(event) {
      if (event.key !== "Enter" && event.key !== " ") {
        return;
      }
      event.preventDefault();
      togglePanel();
    }

    header.addEventListener("click", handleHeaderClick);
    header.addEventListener("keydown", handleHeaderKeydown);

    updatePanelState();

    return panel;
  }

  // =========================================================================================
  // === SORT HELPER ===
  // === Mirrors the click-to-sort pattern from docs/script.js:3-21 (toggle asc/desc via a
  // === data-order attribute on the clicked header cell, parseFloat compare when both cells in
  // === the column are numeric, otherwise localeCompare) — generalized here to take an arbitrary
  // === table element and column index instead of a single hardcoded table id.
  // =========================================================================================

  function sortTableByColumn(table, columnIndex) {
    const headerRow = table.tHead.rows[0];
    const headerCell = headerRow.cells[columnIndex];
    const isAscending = headerCell.getAttribute("data-order") === "asc";
    const rows = Array.from(table.tBodies[0].rows);

    rows.sort(function (rowA, rowB) {
      const textA = rowA.cells[columnIndex].textContent.trim();
      const textB = rowB.cells[columnIndex].textContent.trim();
      const numA = parseFloat(textA.replace(/[%\s]/g, ""));
      const numB = parseFloat(textB.replace(/[%\s]/g, ""));
      if (!isNaN(numA) && !isNaN(numB)) {
        return isAscending ? numA - numB : numB - numA;
      }
      return isAscending ? textA.localeCompare(textB) : textB.localeCompare(textA);
    });

    rows.forEach(function (row) {
      table.tBodies[0].appendChild(row);
    });

    for (let i = 0; i < headerRow.cells.length; i++) {
      if (i !== columnIndex) {
        headerRow.cells[i].removeAttribute("data-order");
      }
    }
    headerCell.setAttribute("data-order", isAscending ? "desc" : "asc");
  }

  function makeSortableHeader(table, columnIndex, label) {
    const th = document.createElement("th");
    th.textContent = label;
    th.addEventListener("click", function () {
      sortTableByColumn(table, columnIndex);
    });
    return th;
  }

  // =========================================================================================
  // === MIN-SAMPLE FILTER ===
  // === Client-side only: every filterable row carries a data-sets attribute with the row's
  // === sample size, set once at render time. Changing the threshold input just toggles the
  // === "filtered-out" class on already-rendered rows — no re-query.
  // =========================================================================================

  function applyMinSampleFilter() {
    const minSampleInput = document.getElementById("min-sample-input");
    const threshold = parseInt(minSampleInput.value, 10) || 0;
    const filterableTableIds = ["map-table", "brawler-table", "teammate-table"];

    filterableTableIds.forEach(function (tableId) {
      const table = document.getElementById(tableId);
      if (!table || !table.tBodies[0]) {
        return;
      }
      const rows = Array.from(table.tBodies[0].rows);
      rows.forEach(function (row) {
        const rowSampleSize = parseInt(row.getAttribute("data-sets"), 10) || 0;
        if (rowSampleSize < threshold) {
          row.classList.add("filtered-out");
        } else {
          row.classList.remove("filtered-out");
        }
      });
    });
  }

  function updateMinSetsHint() {
    if (STATE.tag === null) {
      const hintEl = document.getElementById("min-sample-hint");
      hintEl.textContent = STATE.leaderboardExcludedCount + " " + LABELS.leaderboardExcludedSuffix;
      return;
    }

    const filterableTableIds = ["map-table", "brawler-table", "teammate-table"];
    let hiddenCount = 0;

    filterableTableIds.forEach(function (tableId) {
      const table = document.getElementById(tableId);
      if (!table || !table.tBodies[0]) {
        return;
      }
      hiddenCount += table.querySelectorAll("tr.filtered-out").length;
    });

    const hintEl = document.getElementById("min-sample-hint");
    hintEl.textContent = hiddenCount + " " + LABELS.rowsHiddenSuffix;
  }

  // === Task 10: per-panel "N rader over grensen" counts (the collapsible panels' own right-side
  // === text, distinct from the slider's single combined `#min-sample-hint`, above). Both read the
  // === same `.filtered-out` classes `applyMinSampleFilter()` already maintains — neither of these
  // === 2 helpers ever toggles that class itself. ===

  function countFilteredOutRows(tableId) {
    return document.querySelectorAll("#" + tableId + " tbody tr.filtered-out").length;
  }

  function updatePanelRightText(panelId, count) {
    const rightTextEl = document.querySelector("#" + panelId + " .panel-right-text");
    if (!rightTextEl) {
      return;
    }
    rightTextEl.textContent = count + " " + LABELS.rowsOverThreshold;
  }

  function onMinSetsInput() {
    const minSampleInput = document.getElementById("min-sample-input");
    STATE.minSets = parseInt(minSampleInput.value, 10);
    document.getElementById("min-sample-value").textContent = String(STATE.minSets);
    renderAll();
  }

  document.getElementById("min-sample-input").addEventListener("input", onMinSetsInput);

  // =========================================================================================
  // === SIDEBAR FILTERS: BRAWLER CLASS TREE ===
  // === `renderBrawlerTree()` is a pure DOM-rebuild function called from renderAll() on every
  // === render, same convention as renderModeChips/renderPeriodChips below — no network requests.
  // === The tree is built from STATE.setRows filtered by mode+period+rank (via the local
  // === `filterByModeAndPeriod` helper, a deliberate small duplication of applyFilters' period/mode
  // === logic) — never by STATE.filter itself, since that would collapse the tree to a single row.
  // === Selecting a class or brawler writes STATE.filter in the exact `{kind, value}` shape
  // === applyFilters/renderFilterBar already expect (Task 8's contract); the chevron only ever
  // === touches STATE.expandedClasses, never STATE.filter.
  // =========================================================================================

  function filterByModeAndPeriod(rows) {
    let filteredRows = rows;

    const cutoffDate = periodCutoffDate();
    if (cutoffDate !== null) {
      filteredRows = filteredRows.filter(function (row) {
        return new Date(row.ended_at) >= cutoffDate;
      });
    }

    if (STATE.mode !== "All modes") {
      filteredRows = filteredRows.filter(function (row) {
        return row.mode === STATE.mode;
      });
    }

    if (STATE.rankFilter !== null) {
      filteredRows = filteredRows.filter(function (row) {
        return row.tier_name === STATE.rankFilter;
      });
    }

    return filteredRows;
  }

  // === Same mode+period base as `filterByModeAndPeriod` (duplicated rather than reused, since
  // === that helper also applies STATE.rankFilter — deliberately excluded here), plus the active
  // === brawler/class filter — used only to build the RANK tree below, so that tree reflects any
