<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranked Stats</title>
<!--
  rankedstats/stats.html — standalone local ranked-stats viewer.

  This page is LOCAL-ONLY. It is meant to be opened directly from disk as a `file://` URL (or
  served by any static file server you happen to have handy) — it is deliberately NOT wired into
  the Jekyll site under `docs/`, has no Jekyll front matter, and does not load `docs/style.css`.
  All styling below is self-contained inline CSS so the page renders identically no matter how it
  is opened.

  It talks directly to Supabase's PostgREST API via the `@supabase/supabase-js` v2 UMD bundle
  loaded from the jsdelivr CDN below — no build step, no bundler, no npm install, no
  `package.json`. Every query in this file is a plain SELECT against one of the `v_player_*`
  views defined in `rankedstats/migrations/003_views.sql`; it never queries `ranked_sets`,
  `set_participants`, or `battles` directly, and it never writes/inserts/updates/deletes anything.

  The Supabase URL and key hardcoded below are a PUBLISHABLE (anon) key — a deliberately different,
  weaker credential than the elevated write-capable key used by the server-side ingest script — so
  it is safe to commit. Every table and view this page can see is governed by row-level security
  policies that only ever grant SELECT to the `anon`/`authenticated` roles (see 001_init.sql and
  003_views.sql), so this key cannot write anything even if asked to.
-->
<link rel="stylesheet" href="stats.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="brawler_classes.js"></script>
</head>
<body>

<!-- ===================== HERO ===================== -->
<!-- .hero-content holds 3 children, in order: .hero-rank-badge (the player's profile icon,
     #hero-player-icon), .hero-identity (name + subline row + the "Form" chip row, all stacked in
     one column), and .hero-kpis (5 KPI cards, right-aligned via margin-left: auto on .hero-kpis).
     .hero-subline-row holds the small rank-tier icon (#hero-rank-icon) immediately before the
     rank/tag text (#hero-subline) it illustrates. #hero-rank-chart (Task 15) is the FIRST child
     of .hero, absolutely positioned behind .hero-content — .hero already has position: relative
     to support that without further restructuring; .hero-content itself has position: relative
     and z-index: 1 so the foreground layers on top of the chart. -->
<header class="hero" id="hero">
  <div id="hero-rank-chart" class="hero-rank-chart"></div>
  <div class="hero-content">
    <div class="hero-rank-badge" id="hero-rank-badge">
      <img class="hero-player-icon" id="hero-player-icon" alt="" />
    </div>
    <div class="hero-identity">
      <h1 class="hero-player-name" id="hero-player-name">Velg en spiller</h1>
      <div class="hero-subline-row" id="hero-subline-row">
        <img class="hero-subline-rank-icon" id="hero-rank-icon" alt="" />
        <p class="hero-subline" id="hero-subline"></p>
      </div>
      <p class="hero-contact-hint" id="hero-contact-hint"></p>
      <div class="hero-form-row">
        <span class="hero-form-label"></span>
        <div class="hero-form" id="hero-form"></div>
      </div>
    </div>
    <div class="hero-kpis" id="hero-kpis"></div>
    <!-- Leaderboard/Kart view switcher — only relevant with no player selected (STATE.tag ===
         null); renderHeroEmptyState() (stats-state.js) shows it and toggles the "active" class per
         STATE.browseView, renderHero() (stats-hero.js) hides it once a player is picked. Sits in
         the same right-aligned hero-kpis slot (both are the last child of .hero-content), since
         the two are never shown at the same time. -->
    <div class="hero-view-switcher" id="hero-view-switcher">
      <button type="button" class="hero-view-btn" id="view-btn-leaderboard" title="Leaderboard">
        <img src="images/misc/leaderboard.png" alt="">
        <span class="hero-view-btn-label">Leaderboard</span>
      </button>
      <button type="button" class="hero-view-btn" id="view-btn-maps" title="Statistikk">
        <img src="images/misc/ranked.png" alt="">
        <span class="hero-view-btn-label">Statistikk</span>
      </button>
    </div>
  </div>
</header>

<div class="layout">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="sidebar">
    <div class="controls">
      <div class="control-group">
        <label for="player-select">Spiller</label>
        <select id="player-select">
          <option value="">Laster spillere...</option>
        </select>
      </div>
      <div class="control-group">
        <label for="min-sample-input">Minimum sett</label>
        <div class="min-sets-row">
          <input type="range" id="min-sample-input" min="1" max="15" value="3">
          <span id="min-sample-value">3</span>
        </div>
        <span id="min-sample-hint" class="min-sets-hint"></span>
      </div>
      <div class="control-group">
        <span class="control-group-title">Periode</span>
        <div class="chip-row" id="period-chips"></div>
      </div>
      <div class="control-group">
        <div class="tree-header" id="rank-tree-header"></div>
        <div class="tree-list" id="rank-tree-list"></div>
      </div>
      <!-- Both groups below are hidden (via updateFilterVisibilityForView(),
           stats-sidebar-filters.js) whenever STATE.tag === null && STATE.browseView === "maps" —
           the Kart page keeps the min-sets/period/rank filters but drops mode and brawler per the
           design brief. -->
      <div class="control-group" id="mode-filter-group">
        <span class="control-group-title">Mode</span>
        <div class="chip-row" id="mode-chips"></div>
      </div>
      <div class="control-group" id="brawler-filter-group">
        <div class="tree-header" id="brawler-tree-header"></div>
        <div class="tree-list" id="brawler-tree-list"></div>
      </div>
    </div>

    <p id="player-list-status" class="status" style="display: none;"></p>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <main class="main" id="main-content">

    <!-- ===================== ACTIVE FILTER BAR ===================== -->
    <div class="filter-bar" id="filter-bar"></div>

    <!-- ===================== SECTION: LEADERBOARD (no player selected) ===================== -->
    <section class="stats-section" id="leaderboard-section" style="display: none;">
      <div id="leaderboard-content">
        <p class="status loading">Laster...</p>
      </div>
    </section>

    <!-- ===================== SECTION: MAP STATS, ALLE SPILLERE (Statistikk/Kart view) ===================== -->
    <!-- Same renderMapTable(...) builder the per-player Map section uses (Section 2 below), just
         fed rows aggregated across every tracked player (computeGlobalMapRows, stats-state.js)
         instead of the one selected player's own rows — clicking a row expands an inline brawler
         breakdown right below it instead of opening the per-player table's modal (buildMapRow/
         toggleExpandRow, stats-tables.js). -->
    <section class="stats-section" id="global-map-section" style="display: none;">
      <div id="global-map-content">
        <p class="status loading">Laster...</p>
      </div>
    </section>

    <!-- ===================== SECTION: BRAWLER STATS, ALLE SPILLERE (Statistikk/Kart view) ===================== -->
    <!-- Same "click a row, get an inline breakdown right below it" pattern as the Map section just
         above (computeGlobalBrawlerRows/renderGlobalBrawlerListTable), except a brawler row
         expands into that brawler's own matchup breakdown — which OTHER brawlers it has faced on
         the opposing team, and its winrate against each (buildBrawlerExpandOpponentRows, stats-
         tables.js) — instead of a map's brawler-pick breakdown. -->
    <section class="stats-section" id="global-brawler-section" style="display: none;">
      <div id="global-brawler-content">
        <p class="status loading">Laster...</p>
      </div>
    </section>

    <!-- ===================== SECTION: COMBINED RECENT MATCHES (no player selected) ===================== -->
    <section class="stats-section" id="combined-recent-section" style="display: none;">
      <div id="combined-recent-content">
        <p class="status loading">Laster...</p>
      </div>
    </section>

    <!-- ===================== BEST/WORST MAP CALLOUTS ===================== -->
    <div class="callouts" id="map-callouts"></div>

    <!-- ===================== SECTION 2: BY MAP ===================== -->
    <section class="stats-section" id="map-section">
      <h2>Map</h2>
      <div id="map-content">
        <p class="status empty">Velg en spiller for å se statistikk.</p>
      </div>
    </section>

    <!-- ===================== SECTION 3: BY BRAWLER ===================== -->
    <section class="stats-section" id="brawler-section">
      <h2>Brawler</h2>
      <div id="brawler-content">
        <p class="status empty">Velg en spiller for å se statistikk.</p>
      </div>
    </section>

    <!-- ===================== SECTION 4: TEAMMATES ===================== -->
    <section class="stats-section" id="teammate-section">
      <h2>Teammates</h2>
      <div id="teammate-content">
        <p class="status empty">Velg en spiller for å se statistikk.</p>
      </div>
    </section>

    <!-- ===================== SECTION 5: RECENT MATCHES ===================== -->
    <section class="stats-section" id="recent-section">
      <h2>Siste sett</h2>
      <div id="recent-content">
        <p class="status empty">Velg en spiller for å se statistikk.</p>
      </div>
    </section>

  </main>

</div>

<!-- ===================== MATCH DETAIL MODAL (Task 14) ===================== -->
<!-- Static modal chrome, placed once as a direct child of <body>, initially hidden via the
     `.modal-overlay`'s base `display: none;` (toggled to `flex` by openMatchDetailModal/
     closeMatchDetailModal in the script below — see the MATCH DETAIL MODAL section). The
     `#match-detail-content` div nested inside `.modal-box` is the SAME div `loadMatchDetail`/
     `renderMatchDetail` have always rendered into — it moved here from its old inline home inside
     `#recent-section`, but its own render logic is otherwise unchanged. -->
<div class="modal-overlay" id="match-detail-overlay">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="match-detail-title">
    <div class="modal-header">
      <div class="modal-header-info">
        <div class="modal-thumb-placeholder" id="match-detail-thumb"></div>
        <h3 id="match-detail-title"></h3>
      </div>
      <button type="button" id="match-detail-close" aria-label="Lukk">✕</button>
    </div>
    <div id="match-detail-content"></div>
  </div>
</div>

<script src="stats-config.js"></script>
<script src="stats-state.js"></script>
<script src="stats-hero.js"></script>
<script src="stats-dom-utils.js"></script>
<script src="stats-panels.js"></script>
<script src="stats-sidebar-filters.js"></script>
<script src="stats-leaderboard.js"></script>
<script src="stats-tables.js"></script>
<script src="stats-recent-matches.js"></script>
<script src="stats-init.js"></script>

</body>
</html>
