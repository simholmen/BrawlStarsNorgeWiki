  // === brawler/class already selected but never collapses to a single row from its own rank
  // === selection. ===
  function filterByModePeriodAndBrawler(rows) {
    let filteredRows = rows;

    const cutoffDate = periodCutoffDate();
    if (cutoffDate !== null) {
      filteredRows = filteredRows.filter(function (row) {
        return new Date(row.ended_at) >= cutoffDate;
      });
    }

    if (STATE.mode !== "All modes") {
      filteredRows = filteredRows.filter(function (row) {
        return row.mode === STATE.mode;
      });
    }

    if (STATE.filter.kind === "brawler") {
      filteredRows = filteredRows.filter(function (row) {
        return row.brawler_id === STATE.filter.value;
      });
    } else if (STATE.filter.kind === "class") {
      filteredRows = filteredRows.filter(function (row) {
        const brawlerClass = BRAWLER_CLASSES[row.brawler_id] || "Unclassified";
        return brawlerClass === STATE.filter.value;
      });
    }

    return filteredRows;
  }

  function currentTreeRows() {
    return STATE.tag === null ? STATE.allSetRows : STATE.setRows;
  }

  function buildBrawlerClassGroups() {
    const brawlerAggregates = aggregate(
      filterByModeAndPeriod(currentTreeRows()),
      function (row) {
        return row.brawler_id;
      },
      function (row) {
        return row.brawler_name || String(row.brawler_id);
      }
    );

    const groupsByClass = new Map();
    brawlerAggregates.forEach(function (brawlerAggregate) {
      const className = BRAWLER_CLASSES[brawlerAggregate.key] || "Unclassified";
      if (!groupsByClass.has(className)) {
        groupsByClass.set(className, { sets: 0, wins: 0, losses: 0, brawlers: [] });
      }
      const classTotals = groupsByClass.get(className);
      classTotals.sets += brawlerAggregate.sets;
      classTotals.wins += brawlerAggregate.wins;
      classTotals.losses += brawlerAggregate.losses;
      classTotals.brawlers.push(brawlerAggregate);
    });

    const orderedGroups = [];
    BRAWLER_CLASS_ORDER.forEach(function (className) {
      const classTotals = groupsByClass.get(className);
      if (!classTotals || classTotals.sets === 0) {
        return;
      }

      const winrate =
        classTotals.wins + classTotals.losses === 0
          ? null
          : classTotals.wins / (classTotals.wins + classTotals.losses);

      const sortedBrawlers = classTotals.brawlers.slice().sort(function (brawlerA, brawlerB) {
        return brawlerB.sets - brawlerA.sets;
      });

      orderedGroups.push({
        className: className,
        sets: classTotals.sets,
        winrate: winrate,
        brawlers: sortedBrawlers,
      });
    });

    return orderedGroups;
  }

  function buildBrawlerRow(brawlerAggregate) {
    const isActive =
      STATE.filter.kind === "brawler" && STATE.filter.value === brawlerAggregate.key;

    const row = document.createElement("div");
    row.className = isActive ? "tree-brawler-row active" : "tree-brawler-row";
    row.addEventListener("click", function () {
      STATE.filter = isActive
        ? { kind: null, value: null }
        : { kind: "brawler", value: brawlerAggregate.key };
      renderAll();
    });

    const nameEl = document.createElement("span");
    nameEl.className = "tree-brawler-name";
    nameEl.textContent = brawlerAggregate.label;
    row.appendChild(nameEl);

    const setsEl = document.createElement("span");
    setsEl.className = "tree-brawler-sets";
    setsEl.textContent = brawlerAggregate.sets + "s";
    row.appendChild(setsEl);

    const winrateEl = document.createElement("span");
    winrateEl.className = "tree-brawler-wr";
    winrateEl.textContent = formatWinrate(brawlerAggregate.winrate);
    const tone = winrateTone(brawlerAggregate.winrate);
    if (tone) {
      winrateEl.style.color = tone;
    }
    row.appendChild(winrateEl);

    return row;
  }

  function buildClassRow(classGroup) {
    const isActive =
      STATE.filter.kind === "class" && STATE.filter.value === classGroup.className;
    const isExpanded = STATE.expandedClasses[classGroup.className] === true;

    const classRow = document.createElement("div");
    classRow.className = isActive ? "tree-class active" : "tree-class";

    const header = document.createElement("div");
    header.className = "tree-class-header";
    // Clicking anywhere in the header (chevron excluded, see below) is the "name/bar area" click
    // that sets/clears the class filter.
    header.addEventListener("click", function () {
      STATE.filter = isActive
        ? { kind: null, value: null }
        : { kind: "class", value: classGroup.className };
      renderAll();
    });

    const chevron = document.createElement("span");
    chevron.className = "tree-chevron";
    chevron.textContent = isExpanded ? "▾" : "▸";
    chevron.addEventListener("click", function (event) {
      // stopPropagation is required here: the chevron is a DOM descendant of `header`, so without
      // this a chevron click would also bubble up into header's own click handler above and
      // incorrectly toggle STATE.filter — the chevron must only ever touch STATE.expandedClasses.
      event.stopPropagation();
      STATE.expandedClasses[classGroup.className] = !isExpanded;
      renderBrawlerTree();
    });
    header.appendChild(chevron);

    const main = document.createElement("div");
    main.className = "tree-class-main";

    const nameEl = document.createElement("div");
    nameEl.className = "tree-class-name";
    nameEl.textContent = classGroup.className;
    main.appendChild(nameEl);

    const meta = document.createElement("div");
    meta.className = "tree-class-meta";

    const barTrack = document.createElement("div");
    barTrack.className = "tree-bar-track";
    const barFill = document.createElement("div");
    barFill.className = "tree-bar-fill";
    const winratePercent = classGroup.winrate === null ? 0 : classGroup.winrate * 100;
    barFill.style.width = winratePercent + "%";
    barFill.style.background = winrateTone(classGroup.winrate) || "var(--text-muted-4)";
    barTrack.appendChild(barFill);
    meta.appendChild(barTrack);

    const winrateEl = document.createElement("span");
    winrateEl.className = "tree-wr";
    winrateEl.textContent = formatWinrate(classGroup.winrate);
    const tone = winrateTone(classGroup.winrate);
    if (tone) {
      winrateEl.style.color = tone;
    }
    meta.appendChild(winrateEl);

    const setsEl = document.createElement("span");
    setsEl.className = "tree-sets";
    setsEl.textContent = classGroup.sets + "s";
    meta.appendChild(setsEl);

    main.appendChild(meta);
    header.appendChild(main);
    classRow.appendChild(header);

    if (isExpanded) {
      const children = document.createElement("div");
      children.className = "tree-children";
      classGroup.brawlers.forEach(function (brawlerAggregate) {
        children.appendChild(buildBrawlerRow(brawlerAggregate));
      });
      classRow.appendChild(children);
    }

    return classRow;
  }

  function renderBrawlerTree() {
    const headerContainer = document.getElementById("brawler-tree-header");
    const listContainer = document.getElementById("brawler-tree-list");
    clearElement(headerContainer);
    clearElement(listContainer);

    const title = document.createElement("span");
    title.className = "control-group-title";
    title.textContent = LABELS.brawlerTreeTitle;
    headerContainer.appendChild(title);

    if (STATE.filter.kind !== null) {
      const clearLink = document.createElement("span");
      clearLink.className = "tree-clear";
      clearLink.textContent = "✕ " + LABELS.clear;
      clearLink.addEventListener("click", function () {
        STATE.filter = { kind: null, value: null };
        renderAll();
      });
      headerContainer.appendChild(clearLink);
    }

    const classGroups = buildBrawlerClassGroups();
    classGroups.forEach(function (classGroup) {
      listContainer.appendChild(buildClassRow(classGroup));
    });
  }

  // =========================================================================================
  // === SIDEBAR FILTERS: RANK TIER TREE ===
  // === Same shape/convention as the brawler tree above (flat rows, no nesting — there's no
  // === "class" grouping level for ranks), scoped to only the 5 tiers worth filtering on
  // === (Pro/Masters/Legendary/Mythic/Diamond, highest first) — Gold/Silver/Bronze are excluded
  // === per user request, since nobody filters ranked stats down to those. Built from
  // === `filterByModePeriodAndBrawler`, so it reflects mode/period/brawler selections but never
  // === collapses to a single row from its own STATE.rankFilter selection. Selecting a row writes
  // === STATE.rankFilter directly (a bare tier_name or null) — kept separate from STATE.filter so
  // === a rank and a brawler/class can be active at the same time (see STATE.rankFilter's own
  // === comment for why).
  // =========================================================================================

  const RANK_FILTER_ORDER = ["Pro", "Masters", "Legendary", "Mythic", "Diamond"];

  function buildRankGroups() {
    const rankAggregates = aggregate(
      filterByModePeriodAndBrawler(currentTreeRows()),
      function (row) {
        return row.tier_name;
      },
      function (row) {
        return row.tier_name;
      }
    );

    const aggregatesByTier = new Map();
    rankAggregates.forEach(function (rankAggregate) {
      aggregatesByTier.set(rankAggregate.key, rankAggregate);
    });

    const orderedGroups = [];
    RANK_FILTER_ORDER.forEach(function (tierName) {
      const rankAggregate = aggregatesByTier.get(tierName);
      if (!rankAggregate || rankAggregate.sets === 0) {
        return;
      }
      orderedGroups.push(rankAggregate);
    });

    return orderedGroups;
  }

  function buildRankRow(rankAggregate) {
    const isActive = STATE.rankFilter === rankAggregate.key;

    const row = document.createElement("div");
    row.className = isActive ? "tree-rank-row active" : "tree-rank-row";
    row.addEventListener("click", function () {
      STATE.rankFilter = isActive ? null : rankAggregate.key;
      renderAll();
    });

    const iconUrl = tierIconUrl(rankAggregate.key);
    if (iconUrl) {
      const icon = document.createElement("img");
      icon.className = "tree-rank-icon";
      icon.src = iconUrl;
      icon.alt = rankAggregate.label;
      icon.loading = "lazy";
      row.appendChild(icon);
    }

    const nameEl = document.createElement("span");
    nameEl.className = "tree-rank-name";
    nameEl.textContent = rankAggregate.label;
    row.appendChild(nameEl);

    const setsEl = document.createElement("span");
    setsEl.className = "tree-rank-sets";
    setsEl.textContent = rankAggregate.sets + "s";
    row.appendChild(setsEl);

    const winrateEl = document.createElement("span");
    winrateEl.className = "tree-rank-wr";
    winrateEl.textContent = formatWinrate(rankAggregate.winrate);
    const tone = winrateTone(rankAggregate.winrate);
    if (tone) {
      winrateEl.style.color = tone;
    }
    row.appendChild(winrateEl);

    return row;
  }

  function renderRankTree() {
    const headerContainer = document.getElementById("rank-tree-header");
    const listContainer = document.getElementById("rank-tree-list");
    clearElement(headerContainer);
    clearElement(listContainer);

    const title = document.createElement("span");
    title.className = "control-group-title";
    title.textContent = LABELS.rankTreeTitle;
    headerContainer.appendChild(title);

    if (STATE.rankFilter !== null) {
      const clearLink = document.createElement("span");
      clearLink.className = "tree-clear";
      clearLink.textContent = "✕ " + LABELS.clear;
      clearLink.addEventListener("click", function () {
        STATE.rankFilter = null;
        renderAll();
      });
      headerContainer.appendChild(clearLink);
    }

    const rankGroups = buildRankGroups();
    rankGroups.forEach(function (rankAggregate) {
      listContainer.appendChild(buildRankRow(rankAggregate));
    });
  }

  // =========================================================================================
  // === SIDEBAR FILTERS: MODE / PERIOD CHIPS + ACTIVE-FILTER BAR ===
  // === `renderModeChips`/`renderPeriodChips`/`renderFilterBar` are all pure DOM-rebuild
  // === functions called from renderAll() on every render — no network requests, no cached
  // === chip lists. Mode chips are derived LIVE from STATE.setRows every call (cheap at this data
  // === volume); period chips are a fixed 3-entry list. Every click only mutates STATE and calls
  // === renderAll() again, same convention as the rest of the app.
  // =========================================================================================

  function renderModeChips() {
    const container = document.getElementById("mode-chips");
    clearElement(container);

    const distinctModes = new Set();
    currentTreeRows().forEach(function (row) {
      distinctModes.add(row.mode);
    });

    const chipValues = ["All modes"].concat(Array.from(distinctModes));

    chipValues.forEach(function (modeValue) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = modeValue === "All modes" ? LABELS.allModes : prettyMode(modeValue);
      if (STATE.mode === modeValue) {
        chip.classList.add("active");
      }
      chip.addEventListener("click", function () {
        STATE.mode = modeValue;
        renderAll();
      });
      container.appendChild(chip);
    });
  }

  function renderPeriodChips() {
    const container = document.getElementById("period-chips");
    clearElement(container);

    const periods = [
      { value: "This season", label: LABELS.thisSeason },
      { value: "Last 30 days", label: LABELS.last30Days },
      { value: "Last 7 days", label: LABELS.last7Days },
      { value: "All time", label: LABELS.allTime },
    ];

    periods.forEach(function (period) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = period.label;
      if (STATE.period === period.value) {
        chip.classList.add("active");
      }
      chip.addEventListener("click", function () {
        STATE.period = period.value;
        renderAll();
      });
      container.appendChild(chip);
    });
  }

  function renderFilterBar() {
    const container = document.getElementById("filter-bar");
    clearElement(container);

    const label = document.createElement("span");
    label.className = "filter-bar-label";
    label.textContent = LABELS.activeFilterLabel;
    container.appendChild(label);

    const modeText = STATE.mode === "All modes" ? LABELS.allModes : prettyMode(STATE.mode);
    const periodText =
      STATE.period === "All time"
        ? LABELS.allTime
        : STATE.period === "This season"
        ? LABELS.thisSeason
        : STATE.period === "Last 7 days"
        ? LABELS.last7Days
        : LABELS.last30Days;

    const summary = document.createElement("span");
    summary.className = "filter-bar-summary";
    summary.textContent =
      "· " +
      modeText +
      " · " +
      periodText +
      (STATE.rankFilter !== null ? " · " + STATE.rankFilter : "") +
      " · min " +
      STATE.minSets +
      " " +
      LABELS.tableSets;
    container.appendChild(summary);

    if (STATE.filter.kind !== null || STATE.rankFilter !== null) {
      const clearButton = document.createElement("span");
      clearButton.className = "filter-bar-clear";
      clearButton.textContent = LABELS.clear;
      clearButton.addEventListener("click", function () {
        STATE.filter = { kind: null, value: null };
        STATE.rankFilter = null;
        renderAll();
      });
      container.appendChild(clearButton);
    }
  }

  // =========================================================================================
  // === PLAYER PICKER ===
  // =========================================================================================

  async function loadPlayers() {
    const select = document.getElementById("player-select");
    const listStatus = document.getElementById("player-list-status");

    const { data, error } = await sb
      .from("players")
      .select("tag,name,icon_id")
      .eq("is_tracked", true)
      .order("name");

    clearElement(select);

    if (error) {
      listStatus.style.display = "block";
      listStatus.className = "status error";
      listStatus.textContent = LABELS.errorLoadingPlayers + error.message;
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = LABELS.failedToLoadPlayers;
      select.appendChild(placeholder);
      return [];
    }

    if (!data || data.length === 0) {
      listStatus.style.display = "block";
      listStatus.className = "status empty";
      listStatus.textContent = LABELS.noTrackedPlayers;
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = LABELS.noTrackedPlayersOption;
      select.appendChild(placeholder);
      return [];
    }

    listStatus.style.display = "none";

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = LABELS.choosePlayer;
    select.appendChild(placeholder);

    data.forEach(function (player) {
      const option = document.createElement("option");
      option.value = player.tag;
      option.textContent = player.name || player.tag;
      select.appendChild(option);
    });

    return data;
  }

  // === Bulk fetch across every tracked player for the leaderboard (no player selected) view.
  // === Called once at init, after loadPlayers() resolves the roster it depends on. ===
  async function loadLeaderboardData(trackedPlayers) {
    STATE.rosterByTag = new Map(
      trackedPlayers.map(function (p) { return [p.tag, p.name || p.tag]; })
    );
    STATE.rosterIconByTag = new Map(
      trackedPlayers.map(function (p) { return [p.tag, p.icon_id || null]; })
    );

    const trackedTags = trackedPlayers.map(function (p) { return p.tag; });
    if (trackedTags.length === 0) {
      STATE.allSetRows = [];
      renderAll();
      return;
    }

    const setRowsResult = await sb
      .from("v_player_set_rows")
      .select("*")
      .in("player_tag", trackedTags);

    if (setRowsResult.error) {
      STATE.allSetRows = [];
      STATE.leaderboardLoadError = setRowsResult.error.message;
      renderAll();
      return;
    }

    STATE.allSetRows = setRowsResult.data || [];
    STATE.leaderboardLoadError = null;
    renderAll();
  }

  // === URL state (?player=TAG) — keeps the selected player reflected in the address bar so a
  // === refresh restores the same player, and the back button returns to the previous selection
  // === (or the Felles leaderboard, once there's nothing left to go back to). `suppressUrlPush`
  // === is set around the two callers that must NOT add a new history entry: the initial-load
  // === restore (we're already "at" this URL, pushing again would create a phantom duplicate) and
  // === the popstate handler itself (reacting to a navigation the user already made, pushing again
  // === would fight the back button instead of following it). ===
  let suppressUrlPush = false;

  function playerTagFromUrl() {
    return new URLSearchParams(window.location.search).get("player") || "";
  }

  function updateUrlForPlayer(tag) {
    const url = new URL(window.location.href);
    if (tag) {
      url.searchParams.set("player", tag);
    } else {
      url.searchParams.delete("player");
    }
    history.pushState({ tag: tag || null }, "", url);
  }

  function onPlayerSelected() {
    const select = document.getElementById("player-select");
    const tag = select.value;

    clearElement(document.getElementById("match-detail-content"));

    if (!suppressUrlPush) {
      updateUrlForPlayer(tag);
    }

    if (!tag) {
      STATE.tag = null;
      STATE.setRows = [];
      STATE.mateRows = [];
      STATE.rankHistory = [];
      renderAll();
      return;
    }

    loadPlayerData(tag);
  }

  document.getElementById("player-select").addEventListener("change", onPlayerSelected);

  // === Programmatic equivalent of a user picking `tag` from #player-select — used by the
  // === leaderboard's clickable rows so clicking a player is indistinguishable from selecting
  // === them in the sidebar (same load, same rendered page). ===
  function selectPlayer(tag) {
    document.getElementById("player-select").value = tag;
    onPlayerSelected();
  }

  // === Back/forward navigation — restore whichever player (or none, i.e. Felles) the URL now
  // === names, without pushing a further history entry of our own. ===
  window.addEventListener("popstate", function () {
    suppressUrlPush = true;
    selectPlayer(playerTagFromUrl());
    suppressUrlPush = false;
  });

  // =========================================================================================
  // === LEADERBOARD (no player selected) ===
  // === Renders a ranked list of every tracked player by overall winrate, re-scoped by the same
  // === sidebar tree/mode/period/min-sets controls as player mode (see currentTreeRows() above and
  // === computeLeaderboardRows() in the DATA LAYER section). Pagination is a real prev/next pager
  // === over a fixed page size — NOT the teammate panel's cumulative "load more" pattern — since
  // === the leaderboard is always fully re-ranked, and only the current page's rows are ever
  // === materialized in the DOM. Column sort (STATE.leaderboardSort, applied by
  // === sortLeaderboardRows()) therefore re-sorts the FULL rankedRows array before pagination
  // === slices it, not just the current page's DOM rows — otherwise sorting would silently ignore
  // === every other page's rows and rank numbers ("#") would stop matching the sort order.
  // =========================================================================================

  const LEADERBOARD_PAGE_SIZE = 50;

  function sortLeaderboardRows(rankedRows) {
    const column = STATE.leaderboardSort.column;
    if (!column) {
      return;
    }
    const multiplier = STATE.leaderboardSort.direction === "asc" ? 1 : -1;
    rankedRows.sort(function (rowA, rowB) {
      if (column === "label") {
        return multiplier * rowA.label.localeCompare(rowB.label);
      }
      const valueA = column === "winrate" && rowA.winrate === null ? -1 : rowA[column];
      const valueB = column === "winrate" && rowB.winrate === null ? -1 : rowB[column];
      return multiplier * (valueA - valueB);
    });
  }

  function handleLeaderboardSort(column) {
    if (STATE.leaderboardSort.column === column) {
      STATE.leaderboardSort.direction = STATE.leaderboardSort.direction === "asc" ? "desc" : "asc";
    } else {
      STATE.leaderboardSort.column = column;
      STATE.leaderboardSort.direction = "desc";
    }
    STATE.leaderboardPage = 1;
    renderLeaderboard();
  }

  function buildLeaderboardPagination(totalRows, totalPages) {
    const wrapper = document.createElement("div");
    wrapper.className = "leaderboard-pagination";

    const prevButton = document.createElement("button");
    prevButton.type = "button";
    prevButton.className = "load-more-button";
    prevButton.textContent = LABELS.leaderboardPrevPage;
    prevButton.disabled = STATE.leaderboardPage === 1;
    prevButton.addEventListener("click", function () {
      STATE.leaderboardPage = Math.max(1, STATE.leaderboardPage - 1);
      renderLeaderboard();
    });
    wrapper.appendChild(prevButton);

    const pageInfo = document.createElement("span");
    pageInfo.className = "leaderboard-page-info";
    pageInfo.textContent =
      LABELS.leaderboardPageLabel + " " + STATE.leaderboardPage + " " +
      LABELS.leaderboardPageOfLabel + " " + totalPages;
    wrapper.appendChild(pageInfo);

    const nextButton = document.createElement("button");
    nextButton.type = "button";
    nextButton.className = "load-more-button";
    nextButton.textContent = LABELS.leaderboardNextPage;
    nextButton.disabled = STATE.leaderboardPage === totalPages;
    nextButton.addEventListener("click", function () {
      STATE.leaderboardPage = Math.min(totalPages, STATE.leaderboardPage + 1);
      renderLeaderboard();
    });
    wrapper.appendChild(nextButton);

    return wrapper;
  }

  function renderLeaderboard() {
    const container = document.getElementById("leaderboard-content");

    const filterSignature =
      STATE.mode + "||" + STATE.period + "||" + STATE.minSets + "||" +
      STATE.filter.kind + "||" + STATE.filter.value;
    if (filterSignature !== STATE.leaderboardFilterSignature) {
      STATE.leaderboardPage = 1;
      STATE.leaderboardFilterSignature = filterSignature;
    }

    if (STATE.leaderboardLoadError) {
      STATE.leaderboardExcludedCount = 0;
      setStatus(container, "error", LABELS.errorPrefix + STATE.leaderboardLoadError);
      return;
    }

    const { rankedRows, excludedCount } = computeLeaderboardRows();
    STATE.leaderboardExcludedCount = excludedCount;
    sortLeaderboardRows(rankedRows);

    if (rankedRows.length === 0) {
      setStatus(
        container,
        "empty",
        excludedCount > 0
          ? excludedCount + " " + LABELS.leaderboardExcludedSuffix
          : LABELS.noSetsRecorded
      );
      return;
    }

    const totalPages = Math.ceil(rankedRows.length / LEADERBOARD_PAGE_SIZE);
    STATE.leaderboardPage = Math.min(Math.max(1, STATE.leaderboardPage), totalPages);

    clearElement(container);

    const table = document.createElement("table");
    table.id = "leaderboard-table";

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");
    // Column order: #, Player, Sets, W, L, D, Trend, Winrate. Rank and Trend have no `column`
    // entry — rank is a derived position, and Trend has no single-cell value to compare. Unlike
    // the map/brawler/teammate tables (makeSortableHeader, which just reorders the already-
    // rendered <tr>s), the leaderboard is paginated, so a header click has to re-sort the FULL
    // ranked list (via STATE.leaderboardSort) and re-render, not just the current page's rows.
    const columns = [
      { label: LABELS.leaderboardRankColumn, column: null },
      { label: LABELS.playerLabel, column: "label" },
      { label: LABELS.tableSets, column: "sets" },
      { label: LABELS.tableWins, column: "wins" },
      { label: LABELS.tableLosses, column: "losses" },
      { label: LABELS.tableDraws, column: "draws" },
      { label: LABELS.tableTrend, column: null },
      { label: LABELS.tableWinrate, column: "winrate" },
    ];
    columns.forEach(function (col) {
      const th = document.createElement("th");
      th.textContent = col.label;
      if (col.column) {
        if (STATE.leaderboardSort.column === col.column) {
          th.setAttribute("data-order", STATE.leaderboardSort.direction);
        }
        th.addEventListener("click", function () {
          handleLeaderboardSort(col.column);
        });
      }
      headerRow.appendChild(th);
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    const startIndex = (STATE.leaderboardPage - 1) * LEADERBOARD_PAGE_SIZE;
    const pageRows = rankedRows.slice(startIndex, startIndex + LEADERBOARD_PAGE_SIZE);

    pageRows.forEach(function (group, indexOnPage) {
      const tr = document.createElement("tr");
      tr.className = "leaderboard-row";
      tr.addEventListener("click", function () {
        selectPlayer(group.rows[0].player_tag);
      });
      tr.appendChild(makeCell(String(startIndex + indexOnPage + 1)));
      const playerIconId = STATE.rosterIconByTag.get(group.rows[0].player_tag);
      // group.rows is sorted ascending by ended_at (aggregate()'s own contract), so the last
      // entry is this player's most recent set within the active filters — its tier_name is
      // the closest available proxy for "current rank" without a separate rank-snapshot fetch.
      const currentTierName = group.rows[group.rows.length - 1].tier_name;
      const rankIconUrl = tierIconUrl(currentTierName);
      let currentRankBadge = null;
      if (rankIconUrl) {
        currentRankBadge = document.createElement("img");
        currentRankBadge.className = "leaderboard-rank-icon";
        currentRankBadge.src = rankIconUrl;
        currentRankBadge.alt = currentTierName;
        currentRankBadge.title = currentTierName;
        currentRankBadge.loading = "lazy";
      }
      tr.appendChild(
        buildRowIconCell(
          group.label,
          group.rows[0].player_tag,
          false,
          currentRankBadge ? [currentRankBadge] : null,
          profileIconUrl(playerIconId),
          PLAYER_ICON_FALLBACK_URL
        )
      );
      tr.appendChild(makeCell(String(group.sets)));
      tr.appendChild(makeCell(String(group.wins)));
      tr.appendChild(makeCell(String(group.losses)));
      tr.appendChild(makeCell(String(group.draws)));
      const trendCell = document.createElement("td");
      const sparkline = renderSparkline(group.rows);
      if (sparkline) {
        trendCell.appendChild(sparkline);
      }
      tr.appendChild(trendCell);
      tr.appendChild(buildWinrateCell(group.winrate));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    container.appendChild(table);
    container.appendChild(buildLeaderboardPagination(rankedRows.length, totalPages));
  }

  // =========================================================================================
  // === COMBINED RECENT MATCHES (no player selected) ===
  // === Same STATE.allSetRows bulk fetch the leaderboard table ranks (see loadLeaderboardData),
  // === just flattened to individual sets instead of grouped per player, newest first, paginated
  // === COMBINED_RECENT_PAGE_SIZE at a time. Respects the same mode/period/brawler-or-class
  // === filters as the rest of the sidebar (applyFilters) but ignores STATE.minSets — that
  // === threshold only makes sense for a per-player aggregate, not a raw list of sets. Reuses
  // === buildRecentRow's per-set row (map/brawler/rank/result cells, click-to-open match modal)
  // === via buildCombinedRecentRow, which just prepends a player identity cell so it's clear
  // === whose set each row is. Pagination reuses the leaderboard's own prev/next pager pattern
  // === (buildLeaderboardPagination) against STATE.combinedRecentPage instead of leaderboardPage.
  // =========================================================================================

  const COMBINED_RECENT_PAGE_SIZE = 10;

  function buildCombinedRecentRow(row) {
    const rowEl = buildRecentRow(row);
    rowEl.classList.add("recent-row--combined");

    const playerCell = document.createElement("div");
    playerCell.className = "recent-player-cell";
    const iconUrl = profileIconUrl(STATE.rosterIconByTag.get(row.player_tag));
    if (iconUrl) {
      const icon = document.createElement("img");
      icon.className = "recent-player-icon";
      icon.src = iconUrl;
      icon.alt = "";
      icon.loading = "lazy";
      icon.onerror = function () {
        icon.onerror = null;
        icon.className = "recent-player-placeholder";
        icon.removeAttribute("src");
      };
      playerCell.appendChild(icon);
    } else {
      const placeholder = document.createElement("div");
      placeholder.className = "recent-player-placeholder";
      playerCell.appendChild(placeholder);
    }
    const nameEl = document.createElement("span");
    nameEl.className = "recent-player-name";
    nameEl.textContent = STATE.rosterByTag.get(row.player_tag) || row.player_tag;
    playerCell.appendChild(nameEl);

    rowEl.insertBefore(playerCell, rowEl.firstChild);
    return rowEl;
  }

  function buildCombinedRecentPagination(totalPages) {
    const wrapper = document.createElement("div");
    wrapper.className = "leaderboard-pagination";

    const prevButton = document.createElement("button");
    prevButton.type = "button";
    prevButton.className = "load-more-button";
    prevButton.textContent = LABELS.leaderboardPrevPage;
    prevButton.disabled = STATE.combinedRecentPage === 1;
    prevButton.addEventListener("click", function () {
      STATE.combinedRecentPage = Math.max(1, STATE.combinedRecentPage - 1);
      renderCombinedRecent();
    });
    wrapper.appendChild(prevButton);

    const pageInfo = document.createElement("span");
    pageInfo.className = "leaderboard-page-info";
    pageInfo.textContent =
      LABELS.leaderboardPageLabel + " " + STATE.combinedRecentPage + " " +
      LABELS.leaderboardPageOfLabel + " " + totalPages;
    wrapper.appendChild(pageInfo);

    const nextButton = document.createElement("button");
    nextButton.type = "button";
    nextButton.className = "load-more-button";
    nextButton.textContent = LABELS.leaderboardNextPage;
    nextButton.disabled = STATE.combinedRecentPage === totalPages;
    nextButton.addEventListener("click", function () {
      STATE.combinedRecentPage = Math.min(totalPages, STATE.combinedRecentPage + 1);
      renderCombinedRecent();
    });
    wrapper.appendChild(nextButton);

    return wrapper;
  }

  function renderCombinedRecent() {
    const container = document.getElementById("combined-recent-content");

    const filterSignature =
      STATE.mode + "||" + STATE.period + "||" + STATE.filter.kind + "||" + STATE.filter.value;
    if (filterSignature !== STATE.combinedRecentFilterSignature) {
      STATE.combinedRecentPage = 1;
      STATE.combinedRecentFilterSignature = filterSignature;
    }

    if (STATE.leaderboardLoadError) {
      setStatus(container, "error", LABELS.errorPrefix + STATE.leaderboardLoadError);
      return;
    }

    const rows = applyFilters(STATE.allSetRows)
      .slice()
      .sort(function (rowA, rowB) {
        return new Date(rowB.ended_at) - new Date(rowA.ended_at);
      });

    if (rows.length === 0) {
      setStatus(container, "empty", LABELS.noSetsRecorded);
      return;
    }

    const totalPages = Math.ceil(rows.length / COMBINED_RECENT_PAGE_SIZE);
    STATE.combinedRecentPage = Math.min(Math.max(1, STATE.combinedRecentPage), totalPages);

    clearElement(container);

    const startIndex = (STATE.combinedRecentPage - 1) * COMBINED_RECENT_PAGE_SIZE;
    const pageRows = rows.slice(startIndex, startIndex + COMBINED_RECENT_PAGE_SIZE);

    const list = document.createElement("div");
    list.className = "recent-list";
    pageRows.forEach(function (row) {
      list.appendChild(buildCombinedRecentRow(row));
    });
    container.appendChild(list);

    container.appendChild(buildCombinedRecentPagination(totalPages));
  }

  // =========================================================================================
  // === BEST/WORST MAP CALLOUT CARDS ===
  // === `renderCallouts(mapRows)` takes the exact `mapRows` array renderAll() already builds for
  // === the map table (see the TEMPORARY bridge in the DATA LAYER section above) — it never
  // === recomputes the mode/map aggregation itself. Filters to `row.sets_played >= STATE.minSets`
  // === reading STATE live (so a future min-sets control immediately changes which rows
  // === qualify), then finds the max/min winrate row via a linear scan — the idiomatic pattern
  // === already used for win/loss/draw tallies elsewhere in this file. Rows with a null winrate
  // === (all draws, no decisive sets) are excluded from best/worst consideration entirely. Always
  // === renders both cards, even with zero qualifying rows or an empty mapRows array, showing "—"
  // === per the mockup's own empty-state behaviour rather than hiding the cards.
  // =========================================================================================

  function renderCallouts(mapRows) {
    const container = document.getElementById("map-callouts");
    clearElement(container);

    const qualifyingRows = mapRows.filter(function (row) {
      return (
        row.sets_played >= STATE.minSets && row.winrate !== null && row.winrate !== undefined
      );
    });

    let bestRow = null;
    let worstRow = null;
    qualifyingRows.forEach(function (row) {
      if (bestRow === null || row.winrate > bestRow.winrate) {
        bestRow = row;
      }
      if (worstRow === null || row.winrate < worstRow.winrate) {
        worstRow = row;
      }
    });

    const callouts = [
      { tag: LABELS.bestMap, tone: "var(--win)", row: bestRow },
      { tag: LABELS.worstMap, tone: "var(--loss)", row: worstRow },
    ];

    callouts.forEach(function (callout) {
      const row = callout.row;

      const card = document.createElement("div");
      card.className = "callout-card";
      card.style.borderLeftColor = callout.tone;

      const swatch = document.createElement("div");
      swatch.className = "callout-swatch";
      const iconUrl = row ? modeIconUrl(row.mode) : null;
      if (iconUrl) {
        const icon = document.createElement("img");
        icon.className = "callout-icon";
        icon.src = iconUrl;
        icon.alt = prettyMode(row.mode);
        icon.loading = "lazy";
        icon.onerror = function () {
          icon.onerror = null;
          icon.removeAttribute("src");
          icon.alt = "";
        };
        swatch.appendChild(icon);
      }
      card.appendChild(swatch);

      const info = document.createElement("div");
      info.className = "callout-info";

      const tagEl = document.createElement("div");
      tagEl.className = "callout-tag";
      tagEl.textContent = callout.tag;
      tagEl.style.color = callout.tone;
      info.appendChild(tagEl);

      const mapEl = document.createElement("div");
      mapEl.className = "callout-map";
      mapEl.textContent = row ? row.map : "—";
      info.appendChild(mapEl);

      const subEl = document.createElement("div");
      subEl.className = "callout-sub";
      subEl.textContent = row
        ? prettyMode(row.mode) + " · " + row.sets_played + " " + LABELS.setsSuffix
        : "0 " + LABELS.setsSuffix;
      info.appendChild(subEl);

      card.appendChild(info);

      const winrateEl = document.createElement("div");
      winrateEl.className = "callout-wr";
      winrateEl.textContent = row ? formatWinrate(row.winrate) : "—";
      winrateEl.style.color = callout.tone;
      card.appendChild(winrateEl);

      container.appendChild(card);
    });
  }

  // =========================================================================================
  // === TABLE ROW HELPERS (shared by the map/brawler/teammate table renderers below) ===
  // === `buildRowIconCell` builds the "32x32 placeholder + label (+ optional sub-label) + optional
  // === badges" first-column cell shared across all 3 tables; `buildWinrateCell` builds the
  // === "12px bar + 21px %" final-column cell. Both are pure DOM builders — no DOM lookups, no
  // === STATE reads — so each renderer decides its own THIN-badge threshold and passes it in.
  // =========================================================================================

  function buildRowIconCell(label, subLabel, isThin, extraBadgeEls, iconUrl, fallbackUrl) {
    const cell = document.createElement("td");

    const wrapper = document.createElement("div");
    wrapper.className = "table-row-cell";

    if (iconUrl || fallbackUrl) {
      const icon = document.createElement("img");
      icon.className = "table-row-icon";
      icon.src = iconUrl || fallbackUrl;
      icon.alt = label;
      icon.loading = "lazy";
      // A brawler/map shipped after the last asset export won't have artwork yet (no
      // fallbackUrl passed) — fall back to the plain placeholder swatch instead of showing a
      // broken-image icon. Callers that do pass fallbackUrl (player profile icons) get one
      // retry against it before giving up the same way.
      let triedFallback = false;
      icon.onerror = function () {
        if (fallbackUrl && !triedFallback) {
          triedFallback = true;
          icon.src = fallbackUrl;
          return;
        }
        icon.onerror = null;
        icon.removeAttribute("src");
        icon.alt = "";
      };
      wrapper.appendChild(icon);
    } else {
      const placeholder = document.createElement("div");
      placeholder.className = "table-icon-placeholder";
      wrapper.appendChild(placeholder);
    }

    const textStack = document.createElement("div");
    textStack.className = "table-row-text";

    const labelLine = document.createElement("div");
    labelLine.className = "table-row-label-line";

    const labelEl = document.createElement("span");
    labelEl.className = "table-row-label";
    labelEl.textContent = label;
    labelLine.appendChild(labelEl);

    (extraBadgeEls || []).forEach(function (badgeEl) {
      labelLine.appendChild(badgeEl);
    });

    if (isThin) {
      const thinBadge = document.createElement("span");
      thinBadge.className = "badge-thin";
      thinBadge.textContent = LABELS.thinBadge;
      thinBadge.title = LABELS.thinBadgeTooltip;
      labelLine.appendChild(thinBadge);
    }

    textStack.appendChild(labelLine);

    if (subLabel) {
      const subLabelEl = document.createElement("span");
      subLabelEl.className = "table-row-sublabel";
      subLabelEl.textContent = subLabel;
      textStack.appendChild(subLabelEl);
    }

    wrapper.appendChild(textStack);
    cell.appendChild(wrapper);

    return cell;
  }

  function buildWinrateCell(winrate) {
    const cell = document.createElement("td");
    const tone = winrateTone(winrate) || "var(--text-muted-4)";
    const barPercent = winrate === null || winrate === undefined ? 0 : winrate * 100;

    const barTrack = document.createElement("div");
    barTrack.className = "winrate-bar-track";
    const barFill = document.createElement("div");
    barFill.className = "winrate-bar-fill";
    barFill.style.width = barPercent + "%";
    barFill.style.background = tone;
    barTrack.appendChild(barFill);
    cell.appendChild(barTrack);

    // The percentage is a real, standalone text node (not embedded inside the bar) — required so
    // `sortTableByColumn`'s `cell.textContent` read still yields exactly the "NN.N%" string.
    const textEl = document.createElement("span");
    textEl.className = "winrate-bar-text";
    textEl.textContent = formatWinrate(winrate);
    textEl.style.color = tone;
    cell.appendChild(textEl);

    return cell;
  }

  // =========================================================================================
  // === TREND SPARKLINE (Task 15) ===
  // === `renderSparkline(rows)` takes one map/brawler/teammate group's own chronological set-rows
  // === (the same `group.rows` array `aggregate()` already produces, ascending by `ended_at`) and
  // === returns either `null` (fewer than 3 sets — not enough data for a meaningful trend, so the
  // === Trend <td> stays empty) or a small inline SVG plotting a ROLLING cumulative-from-the-start
  // === winrate across up to 8 chronological buckets. Never fabricates data — only real
  // === `result` values from `rows` are read. Built entirely with createElementNS.
  // =========================================================================================

  function renderSparkline(rows) {
    if (rows.length < 3) {
      return null;
    }

    const viewBoxWidth = 92;
    const viewBoxHeight = 26;
    const midpointY = viewBoxHeight / 2;

    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + viewBoxWidth + " " + viewBoxHeight);
    svg.classList.add("sparkline-svg");

    const referenceLine = document.createElementNS(SVG_NS, "line");
    referenceLine.setAttribute("x1", "0");
    referenceLine.setAttribute("y1", String(midpointY));
    referenceLine.setAttribute("x2", String(viewBoxWidth));
    referenceLine.setAttribute("y2", String(midpointY));
    referenceLine.style.stroke = "var(--divider)";
    referenceLine.setAttribute("stroke-width", "1");
    svg.appendChild(referenceLine);

    // Bucket the rows into up to 8 roughly-equal-sized contiguous chronological chunks. Each
    // bucket's end index marks how far into `rows` its ROLLING winrate looks back — bucket 0's
    // winrate covers rows[0..endIndex0], bucket 1's covers rows[0..endIndex1], and so on, always
    // starting from the very first row (cumulative-to-that-point, never a per-bucket-only stat).
    const bucketCount = Math.min(8, rows.length);
    const bucketEndIndexes = [];
    for (let bucketIndex = 0; bucketIndex < bucketCount; bucketIndex++) {
      const endIndex = Math.round(((bucketIndex + 1) * rows.length) / bucketCount) - 1;
      bucketEndIndexes.push(endIndex);
    }

    const xStep = viewBoxWidth / (bucketCount - 1);
    const bucketPoints = bucketEndIndexes.map(function (endIndex, bucketIndex) {
      let wins = 0;
      let losses = 0;
      for (let rowIndex = 0; rowIndex <= endIndex; rowIndex++) {
        if (rows[rowIndex].result === "win") {
          wins++;
        } else if (rows[rowIndex].result === "loss") {
          losses++;
        }
      }
      const rollingWinrate = wins + losses === 0 ? null : wins / (wins + losses);
      const y =
        rollingWinrate === null
          ? midpointY
          : viewBoxHeight - 4 - rollingWinrate * (viewBoxHeight - 8);
      return { x: bucketIndex * xStep, y: y, winrate: rollingWinrate };
    });

    const lastPoint = bucketPoints[bucketPoints.length - 1];
    const lineColor = winrateTone(lastPoint.winrate) || "var(--text-muted-4)";

    const polyline = document.createElementNS(SVG_NS, "polyline");
    polyline.setAttribute(
      "points",
      bucketPoints
        .map(function (point) {
          return point.x + "," + point.y;
        })
        .join(" ")
    );
    polyline.setAttribute("fill", "none");
    polyline.style.stroke = lineColor;
    polyline.setAttribute("stroke-width", "1.8");
    svg.appendChild(polyline);

    const terminalPoint = document.createElementNS(SVG_NS, "circle");
    terminalPoint.setAttribute("cx", String(lastPoint.x));
    terminalPoint.setAttribute("cy", String(lastPoint.y));
    terminalPoint.setAttribute("r", "2.4");
    terminalPoint.style.fill = lineColor;
    svg.appendChild(terminalPoint);

    return svg;
  }

  // =========================================================================================
  // === SECTION 2: BY MAP ===
  // =========================================================================================

  function renderMapTable(container, rows) {
    clearElement(container);

    const table = document.createElement("table");
    table.id = "map-table";

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");
    // Column order: Map (icon + name + mode sub-label), Sets, W, L, D, Trend, Winrate. Trend
    // (index 5) is a plain non-sortable header — Task 15 fills its per-row <td> later.
    const columnLabels = [
      LABELS.tableMap,
      LABELS.tableSets,
      LABELS.tableWins,
      LABELS.tableLosses,
      LABELS.tableDraws,
      LABELS.tableTrend,
      LABELS.tableWinrate,
    ];
    const trendColumnIndex = 5;
    columnLabels.forEach(function (label, index) {
      if (index === trendColumnIndex) {
        const th = document.createElement("th");
        th.textContent = label;
        headerRow.appendChild(th);
      } else {
        headerRow.appendChild(makeSortableHeader(table, index, label));
      }
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    rows.forEach(function (row) {
      const tr = document.createElement("tr");
      tr.setAttribute("data-sets", String(row.sets_played));
      const isThin = row.sets_played < STATE.minSets + 2;
      tr.appendChild(
        buildRowIconCell(row.map, prettyMode(row.mode), isThin, null, modeIconUrl(row.mode))
      );
      tr.appendChild(makeCell(String(row.sets_played)));
      tr.appendChild(makeCell(String(row.wins)));
      tr.appendChild(makeCell(String(row.losses)));
      tr.appendChild(makeCell(String(row.draws)));
      const trendCell = document.createElement("td");
      const sparkline = renderSparkline(row.rows || []);
      if (sparkline) {
        trendCell.appendChild(sparkline);
      }
      tr.appendChild(trendCell);
      tr.appendChild(buildWinrateCell(row.winrate));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    container.appendChild(table);
  }

  // =========================================================================================
  // === SECTION 3: BY BRAWLER ===
  // =========================================================================================

  function renderBrawlerTable(container, rows) {
    clearElement(container);

    const table = document.createElement("table");
    table.id = "brawler-table";

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");
    // Column order: Brawler (icon + name, no sub-label), Sets, W, L, D, Trend, Winrate. Trend
    // (index 5) is a plain non-sortable header — Task 15 fills its per-row <td> later.
    const columnLabels = [
      LABELS.tableBrawler,
      LABELS.tableSets,
      LABELS.tableWins,
      LABELS.tableLosses,
      LABELS.tableDraws,
      LABELS.tableTrend,
      LABELS.tableWinrate,
    ];
    const trendColumnIndex = 5;
    columnLabels.forEach(function (label, index) {
      if (index === trendColumnIndex) {
        const th = document.createElement("th");
        th.textContent = label;
        headerRow.appendChild(th);
      } else {
        headerRow.appendChild(makeSortableHeader(table, index, label));
      }
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    rows.forEach(function (row) {
      const tr = document.createElement("tr");
      tr.setAttribute("data-sets", String(row.sets_played));
      const isThin = row.sets_played < STATE.minSets + 2;
      tr.appendChild(
        buildRowIconCell(
          row.brawler_name || String(row.brawler_id),
          null,
          isThin,
          null,
          brawlerIconUrl(row.brawler_name)
        )
      );
      tr.appendChild(makeCell(String(row.sets_played)));
      tr.appendChild(makeCell(String(row.wins)));
      tr.appendChild(makeCell(String(row.losses)));
      tr.appendChild(makeCell(String(row.draws)));
      const trendCell = document.createElement("td");

    // Column order: Teammate (icon + name, no sub-label), Tag, Sets together, W, Trend, Winrate.
    // Trend (index 4) is a plain non-sortable header — Task 15 fills its per-row <td> later.
    const columnLabels = [

      LABELS.tableWins,
      LABELS.tableTrend,
      LABELS.tableWinrate,

      rows.slice(renderedCount, renderedCount + TEAMMATE_PAGE_SIZE).forEach(function (row) {
        tbody.appendChild(buildTeammateRow(row));
      });
      renderedCount = Math.min(renderedCount + TEAMMATE_PAGE_SIZE, rows.length);
      updateLoadMoreVisibility();
      // Newly appended rows need the same min-sets filtering/counts already applied to the rows
      // loaded before them — applyMinSampleFilter()/friends only touch rows present in the DOM.
      applyMinSampleFilter();
      updateMinSetsHint();
      updatePanelRightText("teammate-panel", countFilteredOutRows("teammate-table"));

    loadNextPage();

    draw: { border: "var(--draw)", badgeBg: "var(--chip-bg-neutral)", label: LABELS.resultDraw },

  function resultTone(result) {
    return RESULT_TONES[result] || RESULT_TONES.draw;

  async function loadMatchDetail(setId) {
    const container = document.getElementById("match-detail-content");
    renderSkeletonLines(container, 5);

    const { data, error } = await sb
      .from("v_set_detail")
      .select("*")
      .eq("set_id", setId);

    if (error) {
      setStatus(container, "error", LABELS.errorPrefix + error.message);
      return;
    }

    if (!data || data.length === 0) {
      setStatus(container, "empty", LABELS.matchDetailNotFound);
      return;
    }

    // Fills the modal header's static #match-detail-title (outside `container`, so untouched by
    // renderMatchDetail itself) once the set's mode/map are known — added here rather than inside
    // renderMatchDetail so that function's own DOM-building body stays byte-for-byte identical to
    // its pre-Task-14 form aside from the CSS class additions documented in the notepad.
    document.getElementById("match-detail-title").textContent = data[0].mode + " — " + data[0].map;
    setMatchDetailThumb(data[0].mode);

    renderMatchDetail(container, data[0]);
  }

  function setMatchDetailThumb(mode) {
    const thumbEl = document.getElementById("match-detail-thumb");
    thumbEl.style.backgroundImage = "";
    const iconUrl = modeIconUrl(mode);
    if (!iconUrl) {
      return;
    }
    // Probe the icon before committing to it, so a mode without shipped artwork keeps the
    // plain placeholder swatch instead of showing a broken image — same fallback pattern as
    // buildRowIconCell/the recent-list mode icon.
    const probe = new Image();
    probe.onload = function () {
      thumbEl.style.backgroundImage = "url(" + iconUrl + ")";
    };
    probe.src = iconUrl;
  }

  // === Icon-forward match detail body (replaces the old text summary list + 2 team tables +
  // === rounds table). Uses the SAME icon lookups as the rest of the page (brawlerIconUrl/
  // === modeIconUrl/tierIconUrl) so a player's brawler portrait, the mode glyph, and rank-tier
  // === colour are all real assets, not placeholders — the vertical map image comes from
  // === BrawlAPI (see setMapVisualImage), degrading to a plain swatch if the lookup fails.

  const TIER_COLOR_VARS = {
    Bronze: "--tier-bronze",
    Silver: "--tier-silver",
    Gold: "--tier-gold",
    Diamond: "--tier-diamond",
    Mythic: "--tier-mythic",
    Legendary: "--tier-legendary",
    Masters: "--tier-masters",
    Pro: "--tier-pro",
  };

  function tierColorValue(tierName) {
    return "var(" + (TIER_COLOR_VARS[tierName] || "--tier-default") + ")";
  }

  function initialsFor(name) {
    if (!name) {
      return "?";
    }
    return name
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map(function (word) {
        return word.charAt(0).toUpperCase();
      })
      .join("");
  }

  function buildIconSvg(paths, options) {
    const svg = document.createElementNS(SVG_NS, "svg");
    const size = (options && options.size) || 14;
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("width", String(size));
    svg.setAttribute("height", String(size));
    svg.style.flex = "none";
    if (options && options.fillOnly) {
      svg.setAttribute("fill", "currentColor");
      svg.setAttribute("stroke", "none");
    } else {
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "1.8");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
    }
    paths.forEach(function (d) {
      const path = document.createElementNS(SVG_NS, "path");
      path.setAttribute("d", d);
      svg.appendChild(path);
    });
    return svg;
  }

  function outcomeIconSvg(outcome) {
    if (outcome === "win") {
      return buildIconSvg(["M20 6L9 17l-5-5"], { size: 15 });
    }
    if (outcome === "loss") {
      return buildIconSvg(["M6 6l12 12M18 6L6 18"], { size: 15 });
    }
    return buildIconSvg(["M5 12h14"], { size: 15 });
  }

  // Builds a circular avatar: brawler portrait on top of an initials swatch, same "try the real
  // asset, fall back to a plain swatch" convention as buildRowIconCell/profileIconUrl elsewhere
  // on this page — never a broken image if the portrait 404s.
  function buildAvatarEl(participant, size) {
    const avatar = document.createElement("div");
    avatar.className = "rm-avatar";
    avatar.style.width = size + "px";
    avatar.style.height = size + "px";
    avatar.style.fontSize = Math.round(size * 0.34) + "px";
    avatar.textContent = initialsFor(participant.player_name || participant.player_tag);
    avatar.title =
      (participant.player_name || participant.player_tag) + " — " + participant.brawler_name;

    const iconUrl = brawlerIconUrl(participant.brawler_name);
    if (iconUrl) {
      const img = document.createElement("img");
      img.src = iconUrl;
      img.alt = "";
      img.onerror = function () {
        img.remove();
      };
      avatar.appendChild(img);
    }
    return avatar;
  }

  // Small rank-tier badge shown next to each player's name in the face-off — same tierIconUrl
  // asset and "real icon first, colour-only dot as a last resort" convention as the recent-list's
  // rank cell (see buildRow's rankCell), just without its text label (no room for one in this
  // narrow, mirrored 2-column layout — `title` still carries the exact rank label on hover).
  function buildRankBadge(rankLabel) {
    const badge = document.createElement("span");
    badge.className = "rm-rank-badge";
    badge.title = rankLabel || "";

    const tierName = (rankLabel || "").split(" ")[0];
    const iconUrl = tierIconUrl(tierName);
    if (iconUrl) {
      const img = document.createElement("img");
      img.src = iconUrl;
      img.alt = rankLabel || "";
      img.onerror = function () {
        img.remove();
        badge.classList.add("rm-rank-badge--dot");
        badge.style.background = tierColorValue(tierName);
      };
      badge.appendChild(img);
    } else {
      badge.classList.add("rm-rank-badge--dot");
      badge.style.background = tierColorValue(tierName);
    }
    return badge;
  }

  function buildTeamSide(teamParticipants, alignRight) {
    const side = document.createElement("div");
    side.className = alignRight ? "rm-side rm-side--right" : "rm-side";
    teamParticipants.forEach(function (participant) {
      const row = document.createElement("div");

      row.appendChild(buildAvatarEl(participant, 34));

      row.appendChild(name);

      row.appendChild(buildRankBadge(participant.rank_label));

      side.appendChild(row);
    });
    return side;

  function mostFrequentStarPlayerTag(games) {
    const counts = new Map();
    games.forEach(function (game) {
      if (!game.star_player_tag) {
        return;
      }
      counts.set(game.star_player_tag, (counts.get(game.star_player_tag) || 0) + 1);
    });
    let bestTag = null;
    let bestCount = 0;
    counts.forEach(function (count, tag) {
      if (count > bestCount) {
        bestCount = count;
        bestTag = tag;
      }
    });
    return bestTag;
  }

        if (
          game.winning_team_index !== null &&
          game.winning_team_index !== undefined &&
          viewerTeamIndex !== null
        ) {
          outcome = game.winning_team_index === viewerTeamIndex ? "win" : "loss";
        }
        chip.className = "rm-round rm-round--" + outcome;
        chip.title = LABELS.tableGameNumber + game.game_number;
        chip.appendChild(outcomeIconSvg(outcome));
        roundsRow.appendChild(chip);
      });
      container.appendChild(roundsRow);
    }
  }

  // =========================================================================================
  // === MATCH DETAIL MODAL (open/close + focus management) ===
  // === Adds what the mockup itself never had: ESC-to-close, backdrop-click-to-close, and focus
  // === restoration to the row that opened the modal. `matchDetailTriggerEl` is a real
  // === module-level variable (not a DOM attribute) so `closeMatchDetailModal` can move focus back
  // === even after `renderRecentTable` has rebuilt the recent list (e.g. after a re-render) —
  // === it re-checks the element is still attached to the document before focusing it.
  // =========================================================================================

  let matchDetailTriggerEl = null;

  function isMatchDetailModalOpen() {
    return document.getElementById("match-detail-overlay").classList.contains("open");
  }

  function openMatchDetailModal(triggerElement) {
    matchDetailTriggerEl = triggerElement;
    document.getElementById("match-detail-overlay").classList.add("open");
    document.getElementById("match-detail-close").focus();
  }

  function closeMatchDetailModal() {
    document.getElementById("match-detail-overlay").classList.remove("open");
    clearElement(document.getElementById("match-detail-content"));
    document.getElementById("match-detail-title").textContent = "";
    document.getElementById("match-detail-thumb").style.backgroundImage = "";

    if (matchDetailTriggerEl && document.body.contains(matchDetailTriggerEl)) {
      matchDetailTriggerEl.focus();
    }
    matchDetailTriggerEl = null;
  }

  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") {
      return;
    }
    if (!isMatchDetailModalOpen()) {
      return;
    }
    closeMatchDetailModal();
  });

  document.getElementById("match-detail-overlay").addEventListener("click", function (event) {
    const overlayEl = document.getElementById("match-detail-overlay");
    if (event.target !== overlayEl) {
      return;
    }
    closeMatchDetailModal();
  });

  document.getElementById("match-detail-close").addEventListener("click", function () {
    closeMatchDetailModal();
  });

  // =========================================================================================
  // === INIT ===
  // =========================================================================================

  // Wrap the map/brawler/teammate sections in the Task 9 collapsible-panel component, ONCE at
  // page load — never rebuilt on a later renderAll(). Each panel reuses the existing
  // #map-content/#brawler-content/#teammate-content div in-place as its bodyEl, so renderAll()'s
  // own `document.getElementById("map-content")` etc. calls (which run on every render) keep
  // working completely unmodified — they just now target a div nested one level deeper, inside
  // the panel's `.panel-body` wrapper. The old static `<h2>` per-section title is dropped from
  // the DOM here (`clearElement` below removes it) since the panel header renders the title
  // itself.
  const mapPanel = makeCollapsiblePanel({
    id: "map-panel",
    title: LABELS.mapSectionTitle,
    tint: "var(--tint-map)",
    rightText: "0 " + LABELS.rowsOverThreshold,
    bodyEl: document.getElementById("map-content"),
  });
  clearElement(document.getElementById("map-section"));
  document.getElementById("map-section").appendChild(mapPanel);

  const brawlerPanel = makeCollapsiblePanel({
    id: "brawler-panel",
    title: LABELS.brawlerSectionTitle,
    tint: "var(--tint-brawler)",
    rightText: "0 " + LABELS.rowsOverThreshold,
    bodyEl: document.getElementById("brawler-content"),
  });
  clearElement(document.getElementById("brawler-section"));
  document.getElementById("brawler-section").appendChild(brawlerPanel);

  const teammatePanel = makeCollapsiblePanel({
    id: "teammate-panel",
    title: LABELS.teammateSectionTitle,
    tint: "var(--tint-mates)",
    rightText: "0 " + LABELS.rowsOverThreshold,
    bodyEl: document.getElementById("teammate-content"),
  });
  clearElement(document.getElementById("teammate-section"));
  document.getElementById("teammate-section").appendChild(teammatePanel);

  // Task 14: same pattern as the 3 panels above, wrapping #recent-section's existing
  // #recent-content div. Unlike the other 3 panels, the recent list has no min-sets "rows over
  // threshold" concept, so rightText starts (and stays) empty — nothing ever writes to
  // `#recent-panel .panel-right-text` afterwards.
  const recentPanel = makeCollapsiblePanel({
    id: "recent-panel",
    title: LABELS.recentSectionTitle,
    tint: "var(--tint-recent)",
    rightText: "",
    bodyEl: document.getElementById("recent-content"),
  });
  clearElement(document.getElementById("recent-section"));
  document.getElementById("recent-section").appendChild(recentPanel);

  // Leaderboard panel (no player selected) — same wrap-in-place pattern as the 4 above, reusing
  // --tint-map since it is never shown simultaneously with the map panel.
  const leaderboardPanel = makeCollapsiblePanel({
    id: "leaderboard-panel",
    title: LABELS.leaderboardSectionTitle,
    tint: "var(--tint-map)",
    rightText: "",
    bodyEl: document.getElementById("leaderboard-content"),
  });
  clearElement(document.getElementById("leaderboard-section"));
  document.getElementById("leaderboard-section").appendChild(leaderboardPanel);

  // Combined recent matches panel (no player selected) — same wrap-in-place pattern as the
  // leaderboard panel above, reusing --tint-recent since it is never shown simultaneously with
  // the per-player recent panel.
  const combinedRecentPanel = makeCollapsiblePanel({
    id: "combined-recent-panel",
    title: LABELS.combinedRecentSectionTitle,
    tint: "var(--tint-recent)",
    rightText: "",
    bodyEl: document.getElementById("combined-recent-content"),
  });
  clearElement(document.getElementById("combined-recent-section"));
  document.getElementById("combined-recent-section").appendChild(combinedRecentPanel);

  // Both sections start `display: none` in the static markup (there's nothing to show until the
  // roster + bulk set-row fetch below resolves) — show them now with skeleton content instead of
  // leaving the page blank for that fetch's duration. loadLeaderboardData's eventual renderAll()
  // replaces both containers' contents and re-derives visibility itself, so this is only ever the
  // pre-first-render state.
  document.getElementById("leaderboard-section").style.display = "";
  document.getElementById("combined-recent-section").style.display = "";
  renderSkeletonTable(
    document.getElementById("leaderboard-content"),
    [LABELS.leaderboardRankColumn, LABELS.playerLabel, LABELS.tableSets, LABELS.tableWins, LABELS.tableLosses, LABELS.tableDraws, LABELS.tableTrend, LABELS.tableWinrate],
    1,
    8
  );
  renderSkeletonRecentList(document.getElementById("combined-recent-content"), 6, true);

  loadPlayers().then(function (trackedPlayers) {
    loadLeaderboardData(trackedPlayers);

    // Restore the player named by ?player=TAG (e.g. after a refresh) without pushing a new
    // history entry — we're already "at" this URL, not navigating to it.
    const initialTag = playerTagFromUrl();
    if (initialTag) {
      suppressUrlPush = true;
      selectPlayer(initialTag);
      suppressUrlPush = false;
    }
  });

</script>

</body>
</html>
