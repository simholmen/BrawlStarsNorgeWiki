  const TEAMMATE_PAGE_SIZE = 10;

  function buildTeammateRow(row) {
    const tr = document.createElement("tr");
    tr.setAttribute("data-sets", String(row.sets_together));
    const isThin = row.sets_together < STATE.minSets + 2;

    // ROSTER badge logic preserved exactly (same condition/className/LABELS key as before this
    // task) — only its DOM attachment point changed, from a plain name <td> to this shared
    // icon-cell's label line, since every row now needs the same placeholder+label treatment.
    const extraBadgeEls = [];
    if (row.teammate_is_tracked) {
      const rosterBadge = document.createElement("span");
      rosterBadge.className = "badge-tracked";
      rosterBadge.textContent = LABELS.roster;
      extraBadgeEls.push(rosterBadge);
    }

    tr.appendChild(
      buildRowIconCell(row.teammate_name || row.teammate_tag, null, isThin, extraBadgeEls)
    );
    tr.appendChild(makeCell(row.teammate_tag));
    tr.appendChild(makeCell(String(row.sets_together)));
    tr.appendChild(makeCell(String(row.wins)));
    const trendCell = document.createElement("td");
    const sparkline = renderSparkline(row.rows || []);
    if (sparkline) {
      trendCell.appendChild(sparkline);
    }
    tr.appendChild(trendCell);
    tr.appendChild(buildWinrateCell(row.winrate));
    return tr;
  }

  function renderTeammateTable(container, rows) {
    clearElement(container);

    const table = document.createElement("table");
    table.id = "teammate-table";

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");
    // Column order: Teammate (icon + name, no sub-label), Tag, Sets together, W, Trend, Winrate.
    // Trend (index 4) is a plain non-sortable header — Task 15 fills its per-row <td> later.
    const columnLabels = [
      LABELS.tableTeammate,
      LABELS.tableTag,
      LABELS.tableSetsTogether,
      LABELS.tableWins,
      LABELS.tableTrend,
      LABELS.tableWinrate,
    ];
    const trendColumnIndex = 4;
    columnLabels.forEach(function (label, index) {
      if (index === trendColumnIndex) {
        const th = document.createElement("th");
        th.textContent = label;
        headerRow.appendChild(th);
      } else {
        headerRow.appendChild(makeSortableHeader(table, index, label));
      }
    });
    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    table.appendChild(tbody);
    container.appendChild(table);

    // --- pagination: only the first TEAMMATE_PAGE_SIZE rows render up front; the rest load in
    // --- chunks of the same size via the "load more" button appended below the table. ---
    let renderedCount = 0;

    const loadMoreButton = document.createElement("button");
    loadMoreButton.type = "button";
    loadMoreButton.className = "load-more-button";
    loadMoreButton.textContent = LABELS.loadMore;

    function updateLoadMoreVisibility() {
      loadMoreButton.style.display = renderedCount < rows.length ? "" : "none";
    }

    function loadNextPage() {
      rows.slice(renderedCount, renderedCount + TEAMMATE_PAGE_SIZE).forEach(function (row) {
        tbody.appendChild(buildTeammateRow(row));
      });
      renderedCount = Math.min(renderedCount + TEAMMATE_PAGE_SIZE, rows.length);
      updateLoadMoreVisibility();
      // Newly appended rows need the same min-sets filtering/counts already applied to the rows
      // loaded before them — applyMinSampleFilter()/friends only touch rows present in the DOM.
      applyMinSampleFilter();
      updateMinSetsHint();
      updatePanelRightText("teammate-panel", countFilteredOutRows("teammate-table"));
    }

    loadMoreButton.addEventListener("click", loadNextPage);

    loadNextPage();
    container.appendChild(loadMoreButton);
  }

  // =========================================================================================
  // === SECTION 5: RECENT MATCHES ===
  // =========================================================================================

  function formatDateTime(isoString) {
    if (!isoString) {
      return "—";
    }
    return new Date(isoString).toLocaleString();
  }

  // === Result → tone lookup (border-left colour, badge background/text colour, badge label) —
  // === shared by every recent row so the win/loss/draw mapping lives in exactly one place.
  const RESULT_TONES = {
    win: { border: "var(--win)", badgeBg: "var(--chip-bg-win)", label: LABELS.resultWin },
    loss: { border: "var(--loss)", badgeBg: "var(--chip-bg-loss)", label: LABELS.resultLoss },
    draw: { border: "var(--draw)", badgeBg: "var(--chip-bg-neutral)", label: LABELS.resultDraw },
  };

  function resultTone(result) {
    return RESULT_TONES[result] || RESULT_TONES.draw;
  }

  function openRowMatchDetail(rowEl, setId) {
    openMatchDetailModal(rowEl);
    loadMatchDetail(setId);
  }

  function buildRecentRow(row) {
    const tone = resultTone(row.result);

    const rowEl = document.createElement("div");
    rowEl.className = "recent-row";
    rowEl.setAttribute("role", "button");
    rowEl.setAttribute("tabindex", "0");
    rowEl.title = LABELS.clickForDetails;
    rowEl.setAttribute("aria-label", LABELS.clickForDetails);
    rowEl.style.borderLeftColor = tone.border;

    const dateEl = document.createElement("div");
    dateEl.className = "recent-date";
    dateEl.textContent = formatDateTime(row.ended_at);
    rowEl.appendChild(dateEl);

    const mapCell = document.createElement("div");
    mapCell.className = "recent-map-cell";
    const modeIcon = modeIconUrl(row.mode);
    if (modeIcon) {
      const mapIcon = document.createElement("img");
      mapIcon.className = "recent-map-icon";
      mapIcon.src = modeIcon;
      mapIcon.alt = prettyMode(row.mode);
      mapIcon.loading = "lazy";
      // A mode without shipped artwork (or a bad path) falls back to the plain placeholder
      // swatch instead of showing a broken-image icon — same pattern as buildRowIconCell.
      mapIcon.onerror = function () {
        mapIcon.onerror = null;
        mapIcon.className = "recent-map-placeholder";
        mapIcon.removeAttribute("src");
        mapIcon.alt = "";
      };
      mapCell.appendChild(mapIcon);
    } else {
      const mapPlaceholder = document.createElement("div");
      mapPlaceholder.className = "recent-map-placeholder";
      mapCell.appendChild(mapPlaceholder);
    }
    const mapText = document.createElement("div");
    const mapNameEl = document.createElement("div");
    mapNameEl.className = "recent-map-name";
    mapNameEl.textContent = row.map;
    mapText.appendChild(mapNameEl);
    const mapModeEl = document.createElement("div");
    mapModeEl.className = "recent-map-mode";
    mapModeEl.textContent = prettyMode(row.mode);
    mapText.appendChild(mapModeEl);
    mapCell.appendChild(mapText);
    rowEl.appendChild(mapCell);

    const brawlerCell = document.createElement("div");
    brawlerCell.className = "recent-brawler-cell";
    const brawlerIcon = brawlerIconUrl(row.brawler_name);
    if (brawlerIcon) {
      const brawlerImg = document.createElement("img");
      brawlerImg.className = "recent-brawler-icon";
      brawlerImg.src = brawlerIcon;
      brawlerImg.alt = row.brawler_name || "";
      brawlerImg.loading = "lazy";
      // A brawler without shipped artwork (or a bad path) falls back to the plain placeholder
      // swatch instead of showing a broken-image icon — same pattern as the map icon above.
      brawlerImg.onerror = function () {
        brawlerImg.onerror = null;
        brawlerImg.className = "recent-brawler-placeholder";
        brawlerImg.removeAttribute("src");
        brawlerImg.alt = "";
      };
      brawlerCell.appendChild(brawlerImg);
    } else {
      const brawlerPlaceholder = document.createElement("div");
      brawlerPlaceholder.className = "recent-brawler-placeholder";
      brawlerCell.appendChild(brawlerPlaceholder);
    }
    const brawlerNameEl = document.createElement("span");
    brawlerNameEl.className = "recent-brawler-name";
    brawlerNameEl.textContent = row.brawler_name;
    brawlerCell.appendChild(brawlerNameEl);
    rowEl.appendChild(brawlerCell);

    const resultCell = document.createElement("div");
    resultCell.className = "recent-result-cell";
    const resultBadge = document.createElement("span");
    resultBadge.className = "recent-result-badge";
    resultBadge.textContent = tone.label;
    resultBadge.style.background = tone.badgeBg;
    resultBadge.style.color = tone.border;
    resultCell.appendChild(resultBadge);
    const scoreEl = document.createElement("span");
    scoreEl.className = "recent-score";
    scoreEl.textContent = row.team0_wins + "–" + row.team1_wins;
    resultCell.appendChild(scoreEl);
    rowEl.appendChild(resultCell);

    const chevronEl = document.createElement("div");
    chevronEl.className = "recent-chevron";
    chevronEl.textContent = "›";
    rowEl.appendChild(chevronEl);

    rowEl.addEventListener("click", function () {
      openRowMatchDetail(rowEl, row.set_id);
    });
    rowEl.addEventListener("keydown", function (event) {
      if (event.key !== "Enter" && event.key !== " ") {
        return;
      }
      event.preventDefault();
      openRowMatchDetail(rowEl, row.set_id);
    });

    return rowEl;
  }

  function renderRecentTable(container, rows) {
    clearElement(container);

    const list = document.createElement("div");
    list.className = "recent-list";

    rows.forEach(function (row) {
      list.appendChild(buildRecentRow(row));
    });

    container.appendChild(list);
  }

  async function loadMatchDetail(setId) {
    const container = document.getElementById("match-detail-content");
    setStatus(container, "loading", LABELS.loadingMatchDetail);

    const { data, error } = await sb
      .from("v_set_detail")
      .select("*")
      .eq("set_id", setId);

    if (error) {
      setStatus(container, "error", LABELS.errorPrefix + error.message);
      return;
    }

    if (!data || data.length === 0) {
      setStatus(container, "empty", LABELS.matchDetailNotFound);
      return;
    }

    // Fills the modal header's static #match-detail-title (outside `container`, so untouched by
    // renderMatchDetail itself) once the set's mode/map are known — added here rather than inside
    // renderMatchDetail so that function's own DOM-building body stays byte-for-byte identical to
    // its pre-Task-14 form aside from the CSS class additions documented in the notepad.
    document.getElementById("match-detail-title").textContent = data[0].mode + " — " + data[0].map;
    setMatchDetailThumb(data[0].mode);

    renderMatchDetail(container, data[0]);
  }

  function setMatchDetailThumb(mode) {
    const thumbEl = document.getElementById("match-detail-thumb");
    thumbEl.style.backgroundImage = "";
    const iconUrl = modeIconUrl(mode);
    if (!iconUrl) {
      return;
    }
    // Probe the icon before committing to it, so a mode without shipped artwork keeps the
    // plain placeholder swatch instead of showing a broken image — same fallback pattern as
    // buildRowIconCell/the recent-list mode icon.
    const probe = new Image();
    probe.onload = function () {
      thumbEl.style.backgroundImage = "url(" + iconUrl + ")";
    };
    probe.src = iconUrl;
  }

  function renderMatchDetail(container, set) {
    clearElement(container);

    const heading = document.createElement("h3");
    heading.className = "modal-detail-heading";
    heading.textContent = set.mode + " — " + set.map;
    container.appendChild(heading);

    const summaryList = document.createElement("ul");
    summaryList.className = "modal-summary-list";
    const summaryItems = [
      LABELS.started + formatDateTime(set.started_at),
      LABELS.ended + formatDateTime(set.ended_at),
      LABELS.gamesPlayed + set.games_played,
      LABELS.team0Wins + set.team0_wins,
      LABELS.team1Wins + set.team1_wins,
      LABELS.winningTeam +
        (set.winning_team_index === null || set.winning_team_index === undefined
          ? LABELS.drawUnresolved
          : LABELS.teamPrefix + set.winning_team_index),
      LABELS.complete + (set.is_complete ? LABELS.yes : LABELS.no),
    ];
    summaryItems.forEach(function (text) {
      const li = document.createElement("li");
      li.textContent = text;
      summaryList.appendChild(li);
    });
    container.appendChild(summaryList);

    const participants = set.participants || [];
    [0, 1].forEach(function (teamIndex) {
      const teamHeading = document.createElement("h4");
      teamHeading.className = "modal-team-heading";
      teamHeading.textContent = LABELS.teamPrefix + teamIndex;
      container.appendChild(teamHeading);

      const teamTable = document.createElement("table");
      teamTable.className = "modal-team-table";
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");
      [
        LABELS.tablePlayer,
        LABELS.tableTag,
        LABELS.tableBrawlerCol,
        LABELS.tablePower,
        LABELS.tableRank,
      ].forEach(function (label) {
        const th = document.createElement("th");
        th.textContent = label;
        headerRow.appendChild(th);
      });
      thead.appendChild(headerRow);
      teamTable.appendChild(thead);

      const tbody = document.createElement("tbody");
      participants
        .filter(function (participant) {
          return participant.team_index === teamIndex;
        })
        .forEach(function (participant) {
          const tr = document.createElement("tr");
          tr.appendChild(makeCell(participant.player_name || participant.player_tag));
          tr.appendChild(makeCell(participant.player_tag));
          tr.appendChild(makeCell(participant.brawler_name));
          tr.appendChild(makeCell(String(participant.brawler_power)));
          tr.appendChild(makeCell(participant.rank_label || String(participant.rank_value)));
          tbody.appendChild(tr);
        });
      teamTable.appendChild(tbody);

      container.appendChild(teamTable);
    });

    const gamesHeading = document.createElement("h4");
    gamesHeading.className = "modal-rounds-heading";
    gamesHeading.textContent = LABELS.gamesHeading;
    container.appendChild(gamesHeading);

    const gamesTable = document.createElement("table");
    gamesTable.className = "modal-rounds-table";
    const gamesThead = document.createElement("thead");
    const gamesHeaderRow = document.createElement("tr");
    [
      LABELS.tableGameNumber,
      LABELS.tableBattleTime,
      LABELS.tableDuration,
      LABELS.tableWinningTeam,
      LABELS.tableStarPlayer,
    ].forEach(function (label) {
      const th = document.createElement("th");
      th.textContent = label;
      gamesHeaderRow.appendChild(th);
    });
    gamesThead.appendChild(gamesHeaderRow);
    gamesTable.appendChild(gamesThead);

    const gamesTbody = document.createElement("tbody");
    const games = set.games || [];
    games.forEach(function (game) {
      const tr = document.createElement("tr");
      tr.appendChild(makeCell(String(game.game_number)));
      tr.appendChild(makeCell(formatDateTime(game.battle_time)));
      tr.appendChild(makeCell(String(game.duration)));
      tr.appendChild(
        makeCell(
          game.winning_team_index === null || game.winning_team_index === undefined
            ? LABELS.draw
            : LABELS.teamPrefix + game.winning_team_index
        )
      );
      tr.appendChild(makeCell(game.star_player_tag || "—"));
      gamesTbody.appendChild(tr);
    });
    gamesTable.appendChild(gamesTbody);

    container.appendChild(gamesTable);
  }

  // =========================================================================================
  // === MATCH DETAIL MODAL (open/close + focus management) ===
  // === Adds what the mockup itself never had: ESC-to-close, backdrop-click-to-close, and focus
  // === restoration to the row that opened the modal. `matchDetailTriggerEl` is a real
  // === module-level variable (not a DOM attribute) so `closeMatchDetailModal` can move focus back
  // === even after `renderRecentTable` has rebuilt the recent list (e.g. after a re-render) —
  // === it re-checks the element is still attached to the document before focusing it.
  // =========================================================================================

  let matchDetailTriggerEl = null;

  function isMatchDetailModalOpen() {
    return document.getElementById("match-detail-overlay").classList.contains("open");
  }

  function openMatchDetailModal(triggerElement) {
    matchDetailTriggerEl = triggerElement;
    document.getElementById("match-detail-overlay").classList.add("open");
    document.getElementById("match-detail-close").focus();
  }

  function closeMatchDetailModal() {
    document.getElementById("match-detail-overlay").classList.remove("open");
    clearElement(document.getElementById("match-detail-content"));
    document.getElementById("match-detail-title").textContent = "";
    document.getElementById("match-detail-thumb").style.backgroundImage = "";

    if (matchDetailTriggerEl && document.body.contains(matchDetailTriggerEl)) {
      matchDetailTriggerEl.focus();
    }
    matchDetailTriggerEl = null;
  }

  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") {
      return;
    }
    if (!isMatchDetailModalOpen()) {
      return;
    }
    closeMatchDetailModal();
  });

  document.getElementById("match-detail-overlay").addEventListener("click", function (event) {
    const overlayEl = document.getElementById("match-detail-overlay");
    if (event.target !== overlayEl) {
      return;
    }
    closeMatchDetailModal();
  });

  document.getElementById("match-detail-close").addEventListener("click", function () {
    closeMatchDetailModal();
  });

  // =========================================================================================
  // === INIT ===
  // =========================================================================================

  // Wrap the map/brawler/teammate sections in the Task 9 collapsible-panel component, ONCE at
  // page load — never rebuilt on a later renderAll(). Each panel reuses the existing
  // #map-content/#brawler-content/#teammate-content div in-place as its bodyEl, so renderAll()'s
  // own `document.getElementById("map-content")` etc. calls (which run on every render) keep
  // working completely unmodified — they just now target a div nested one level deeper, inside
  // the panel's `.panel-body` wrapper. The old static `<h2>` per-section title is dropped from
  // the DOM here (`clearElement` below removes it) since the panel header renders the title
  // itself.
  const mapPanel = makeCollapsiblePanel({
    id: "map-panel",
    title: LABELS.mapSectionTitle,
    tint: "var(--tint-map)",
    rightText: "0 " + LABELS.rowsOverThreshold,
    bodyEl: document.getElementById("map-content"),
  });
  clearElement(document.getElementById("map-section"));
  document.getElementById("map-section").appendChild(mapPanel);

  const brawlerPanel = makeCollapsiblePanel({
    id: "brawler-panel",
    title: LABELS.brawlerSectionTitle,
    tint: "var(--tint-brawler)",
    rightText: "0 " + LABELS.rowsOverThreshold,
    bodyEl: document.getElementById("brawler-content"),
  });
  clearElement(document.getElementById("brawler-section"));
  document.getElementById("brawler-section").appendChild(brawlerPanel);

  const teammatePanel = makeCollapsiblePanel({
    id: "teammate-panel",
    title: LABELS.teammateSectionTitle,
    tint: "var(--tint-mates)",
    rightText: "0 " + LABELS.rowsOverThreshold,
    bodyEl: document.getElementById("teammate-content"),
  });
  clearElement(document.getElementById("teammate-section"));
  document.getElementById("teammate-section").appendChild(teammatePanel);

  // Task 14: same pattern as the 3 panels above, wrapping #recent-section's existing
  // #recent-content div. Unlike the other 3 panels, the recent list has no min-sets "rows over
  // threshold" concept, so rightText starts (and stays) empty — nothing ever writes to
  // `#recent-panel .panel-right-text` afterwards.
  const recentPanel = makeCollapsiblePanel({
    id: "recent-panel",
    title: LABELS.recentSectionTitle,
    tint: "var(--tint-recent)",
    rightText: "",
    bodyEl: document.getElementById("recent-content"),
  });
  clearElement(document.getElementById("recent-section"));
  document.getElementById("recent-section").appendChild(recentPanel);

  loadPlayers();

</script>

</body>
</html>
