<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brawl Stars Norge</title>
<link rel="icon" href="/images/bsnorge.jpg" type="image/jpg">
<style>
  :root {
    --bg: #0b1120;
    --panel: #131c31;
    --panel-border: #232f4a;
    --text-primary: #f4f6fb;
    --text-secondary: #97a3bd;
    --accent-gold: #ffd23d;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 40px 20px;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .brand img {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    object-fit: cover;
  }

  .brand h1 {
    margin: 0;
    font-size: 1.6em;
  }

  .brand p {
    margin: 0;
    color: var(--text-secondary);
    max-width: 420px;
  }

  .choices {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
  }

  .choice-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 220px;
    padding: 28px 20px;
    border-radius: 14px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text-primary);
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .choice-card:hover {
    border-color: var(--accent-gold);
    transform: translateY(-2px);
  }

  .choice-icon {
    font-size: 2em;
  }

  .choice-title {
    font-size: 1.15em;
    font-weight: 700;
  }

  .choice-desc {
    font-size: 0.85em;
    color: var(--text-secondary);
  }
</style>
</head>
<body>

  <div class="brand">
    <img src="/images/bsnorge.jpg" alt="Brawl Stars Norge">
    <h1>Brawl Stars Norge</h1>
    <p>Velg hvor du vil gå.</p>
  </div>

  <div class="choices">
    <a class="choice-card" href="/wiki/">
      <span class="choice-icon">📖</span>
      <span class="choice-title">Wiki</span>
      <span class="choice-desc">Historie, klubber og spillere i det norske Brawl Stars-miljøet.</span>
    </a>
    <a class="choice-card" href="/rankedstats/stats.html">
      <span class="choice-icon">📊</span>
      <span class="choice-title">Ranked Stats</span>
      <span class="choice-desc">Kart-, brawler- og lagkamerat-statistikk for rangerte sett.</span>
    </a>
  </div>

</body>
</html>
