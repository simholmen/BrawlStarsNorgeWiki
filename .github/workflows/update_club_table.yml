name: Auto-push winloss markdown

on:
  schedule:
    - cron: '5,35 * * * *'  # at minute 5 and 35 every hour
  workflow_dispatch:

jobs:
  push-winloss-md:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push winloss .md files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-push winloss markdown [auto]"
          file_pattern: docs/diverse/slindringene/winloss_*.md